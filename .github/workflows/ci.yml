# roster had none of this until now, and `CLAUDE.md` already said it did --
# "`go tool pd gen --check .` # what CI runs". Nothing ran it. This is that file.
#
# The check worth having a machine for is the last one in the `go` job. Build
# failures and test failures are found at a desk; a generated file that was not
# regenerated **compiles perfectly and is wrong**, and `pd gen --check` is the
# only thing that looks. payday's own `main` sat red for four commits on exactly
# that, so this is not a hypothetical about an app that generates most of itself.
#
# The image is the last job and it `needs` every other one, so what reaches the
# registry is what the gates passed. It was its own workflow for a commit, which
# is the arrangement where a red `ci` does not stop a push.
#
# And roster is compiled for an image **once**, by `build`. The jobs that test an
# image and the one that pushes it copy those binaries onto a base and do not
# compile them again -- so what `cluster` and `hydra` walked is, byte for byte,
# the binary that is pushed. It was compiled four times a run before this, in
# three jobs, and the one that was pushed was not one of the ones tested: only
# the image job handed in `APP_VERSION`.
name: ci

# `workflow_dispatch` because the image job is here: a rebuild of what `main`
# already is should not need an empty commit.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# To read the checkout, and nothing else, unless a job says otherwise -- and
# one does, `push`. Said here rather than left to the repository's default,
# which is a setting nobody reviews.
permissions:
  contents: read

# Every job names its image rather than `ubuntu-latest`, so that the runner
# moves when this file says so and not on GitHub's schedule.
#
# And every action is named by the commit its version had when it was written
# here, with that version after it: a tag is moved by whoever can push to the
# action's repository, so a tag is code this file has never seen -- and two of
# these are handed the token that pushes the image. Renovate moves the commit
# and the comment together (`helpers:pinGitHubActionDigests`, in payday's
# preset).
jobs:
  # The binaries of every platform, and the pages, compiled once: `dist` in
  # `docker-bake.hcl`, cross-compiled from this runner's architecture.
  #
  # A tar and not the directory, because an artifact does not keep file modes
  # and a binary that arrives without `x` is an image that does not start. One
  # day, because nothing reads it after this run.
  #
  # The timestamp is taken here and handed to `image`, because `APP_VERSION` is
  # derived from it and is compiled into the binary: a run that crossed midnight
  # would otherwise tag the image with a day the binary does not say.
  build:
    runs-on: ubuntu-26.04
    outputs:
      timestamp: ${{ steps.when.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: when
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The BuildKit that builds, by its version and digest rather than
          # whichever the action pulls that day: what the builder is is part of
          # what the binaries and the image are made of, as the actions above
          # are. Renovate moves it (`renovate.json`); `image` and `push` name
          # the same one.
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          BUILD_ID: r${{ github.run_id }}
          BUILD_TIMESTAMP: ${{ steps.when.outputs.timestamp }}
        with:
          source: .
          files: docker-bake.hcl
          targets: dist
          set: |
            dist.output=type=tar,dest=dist.tar
            dist.cache-from=type=gha,scope=dist
            dist.cache-to=type=gha,scope=dist,mode=max

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar
          retention-days: 1

  go:
    runs-on: ubuntu-26.04
    steps:
      # The whole history, because `buf breaking` below compares against the
      # branch tip and a shallow checkout has no ref to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The buf `pd` pins, kept between runs. `pd` fetches it from GitHub's
      # releases into ~/.cache/payday/buf/<version> the first time it needs
      # one and finds it there after, and a runner starts with that empty --
      # so every run fetched it, from releases that answer 504 for minutes at
      # a time: this job failed on it twice on 2026-11-08 (#227). Kept under
      # the payday go.mod requires, which is what decides the version, it is
      # fetched once for each payday rather than on every run.
      - name: the payday roster requires
        id: payday
        run: echo "version=$(go list -m -f '{{.Version}}' github.com/lesomnus/payday)" >> "${GITHUB_OUTPUT}"
      - id: buf
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/payday/buf
          key: payday-buf-${{ steps.payday.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
      # Not there, it is fetched as every generation fetches it: by `pd`,
      # checked against its digest, and asked again for a minute when GitHub
      # does not answer. `pd doctor` reads the schema with it and is the least
      # that does. Then on the PATH, where buf-action finds it below.
      - name: pd's buf, on the PATH
        id: pdbuf
        env:
          HIT: ${{ steps.buf.outputs.cache-hit }}
        run: |
          if [ "${HIT}" != true ]; then
            go tool pd doctor .
          fi
          set -- "${HOME}"/.cache/payday/buf/*/buf
          if [ "$#" -ne 1 ] || [ ! -x "$1" ]; then
            echo "no one buf in ${HOME}/.cache/payday/buf: $*" >&2
            exit 1
          fi
          echo "version=$("$1" --version)" >> "${GITHUB_OUTPUT}"
          dirname "$1" >> "${GITHUB_PATH}"
      # Saved now rather than at the end of the job, which `actions/cache`
      # does only for a job that passed.
      - if: steps.buf.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/payday/buf
          key: ${{ steps.buf.outputs.cache-primary-key }}
      # buf-action given no version takes buf's latest release -- 1.75.0 on
      # 2026-11-08, where `pd` pins 1.72.0 -- and downloads it on every run.
      # Given one, it takes a buf on the PATH that says that version and
      # fetches nothing. So it is given the version of `pd`'s buf: payday's
      # `pdcli.BufVersion`, which moves with payday and nothing else, and
      # `buf breaking` runs the buf every generation does.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: ${{ steps.pdbuf.outputs.version }}
          setup_only: true

      # One baseline, and only one: roster's buf module has no name, so it is
      # published nowhere and there is no BSR ref to compare against. That does
      # not make the check pointless -- roster's protos are an API and there is
      # already an app on the other side of it. From the first app's launch on,
      # breaking the wire on purpose is a migration and should be argued for in
      # a review rather than discovered downstream. Until then it needs no
      # migration -- roster keeps nothing for an older caller before the launch
      # (the owner's decision of 2026-11-09, CLAUDE.md) -- only an `ignore_only`
      # in `buf.yaml` for that one change, out again with the first change after
      # it reaches `main`.
      #
      # `ref=origin/main` rather than `branch=main`: a pull request is checked
      # out detached and has no local `main`.
      - run: buf breaking --against '.git#ref=origin/main'

      # No `buf lint`. roster's `buf.yaml` configures it, but it exits 100 on
      # the generated contracts -- `audit_svc.g.proto` is not lower_snake_case
      # to buf, because of the `.g.` that marks who wrote the file. That naming
      # is payday's and is not roster's to change, so linting here would mean
      # arguing with the generator on every push. Left out deliberately; the
      # `lint:` block in `buf.yaml` is what a `buf lint` run by hand obeys.

      # Before the gate, because the gate ends by checking the TypeScript half
      # of what is generated and by building the console, and both need the
      # plugin. A run without it is a run that says the generated code is fine
      # having looked at two thirds of it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci --prefix ts

      # One step rather than seven, which is the point of the script: what CI
      # runs and what a desk runs are the same command, so a green run there
      # cannot mean less than a green run here. It covers gofmt, the build, the
      # vet, the tests, `pd doctor`, `pd gen --check --ts`, the wasm build and
      # the console -- and everything above is what it deliberately does not,
      # being about this branch rather than about this checkout.
      - run: ./scripts/test.sh

  # The same suite, on the database roster is actually deployed on.
  #
  # SQLite needs no server, which is why the job above uses it and why it should
  # stay that way -- a suite nobody can run without a database is a suite nobody
  # runs. But SQLite is permissive in the directions that hide mistakes: it has
  # no real types, it sorts NULLs the other way round, and its driver turns a
  # nil []byte into an empty blob where pgx sends SQL NULL.
  #
  # That last one was not hypothetical for payday: the first time its suite met
  # PostgreSQL, ten tests failed on two NOT NULL columns the trail and the outbox
  # had been writing nil into since they were written. roster generates the same
  # SQL from the same generator and has never been run against PostgreSQL at all.
  postgres:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        # Without this the container is up before the database accepts, and the
        # first test is the one that finds out.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The tests alone rather than the whole gate: `scripts/test.sh` is the
      # same command with the variable set, but the parts of it that are not
      # tests -- gofmt, the generation check, two builds -- do not become a
      # different question on PostgreSQL, and this job has no node on it.
      - run: go test ./... -count=1
        env:
          PDTEST_POSTGRES: postgres://app:app@127.0.0.1:5432/app?sslmode=disable

  # The tests that race callers against each other, under the race detector, on
  # the database where two transactions really do run at once.
  #
  # `cmd` is where they are: two callers removing somebody's last two ways in,
  # two batches doing it, two agreements to one document. A test like that
  # checks what the database ends with, and it can pass while the code races
  # underneath -- `cmd.Locking` wrote the transaction a call handed it into the
  # client every call shares, so one call's lock could land on another's
  # transaction, and every job above was green on it. `go test -race` on
  # PostgreSQL said so on the first run, in a test that already existed
  # (roster#174). SQLite serialises its writers, so the calls rarely overlap
  # there and the detector has little to see; PostgreSQL is where they do.
  #
  # `cmd` alone because the race detector costs what it costs, and the other
  # packages' goroutines are servers standing up for a test rather than callers
  # meeting. A package that grows tests of the second kind joins the list.
  race:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A longer timeout than go's ten minutes for one package: the detector
      # makes the same tests several times slower, and running out of time is
      # not the finding this job is for.
      - run: go test -race -count=1 -timeout 30m ./cmd/
        env:
          PDTEST_POSTGRES: postgres://app:app@127.0.0.1:5432/app?sslmode=disable

  # An upgrade, rehearsed (`scripts/upgrade.sh`): a build makes a deployment's
  # databases, a row goes into every table, and this one starts on them twice.
  #
  # Every other job migrates a database that is empty, and an upgrade fails in
  # the one way an empty database cannot: a column that comes to a table that
  # already has rows. Three such columns came between two releases of the one
  # deployment with every job here green, and its init container would not
  # have finished.
  #
  # From two builds. The one this comes after -- the pull request's base, or
  # what `main` was before this push -- is one step. The oldest a deployment
  # still runs, OLDEST, is however many steps a deployment that skipped some
  # takes at once: staging's, written below, and moved forward when staging
  # moves. It was the nearest `v*` tag until the owner agreed that roster does
  # without tags for this (2026-11-11): nothing tagged what staging ran, so the
  # job upgraded from v0.1.1 and nothing else.
  #
  # Except across a compatibility epoch, `.github/compat-epoch`. Until the
  # first app launches, roster keeps nothing for an earlier roster (the
  # owner's decision of 2026-11-09, CLAUDE.md): a change that breaks what an
  # earlier build made moves the number instead, so a build of another epoch
  # is not built and nothing it makes is migrated. The job says why as a notice
  # and in the step summary, and passes -- it is required, and what it would
  # find there is what was meant. A tree with no such file is epoch 0. OLDEST
  # moves to the first build of the new epoch once staging runs it; from the
  # launch on the epoch does not move without the owner's word.
  upgrade:
    runs-on: ubuntu-26.04
    steps:
      # The whole history, since BEFORE and OLDEST are built from their trees.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: this build, the one it comes after, and the oldest a deployment runs
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The build staging runs, 1bcd27a (2026-11-11). It moves when staging
          # moves: to what staging runs once it runs it.
          OLDEST: 1bcd27a89c854ef1382ba7f0831ee385a9ecf93d
        run: |
          go build -o "${RUNNER_TEMP}/bin-now/" ./cmd/roster
          # epoch TREE: the compatibility epoch TREE is of, and 0 for a tree
          # with no .github/compat-epoch.
          epoch() {
            if [ -f "$1/.github/compat-epoch" ]; then
              tr -d '[:space:]' <"$1/.github/compat-epoch"
            else
              echo 0
            fi
          }
          now=$(epoch .)
          # old NAME COMMIT: the build at COMMIT, in bin-NAME -- or, for one
          # of another epoch, nothing built, a notice of why, and the why in
          # why-NAME for the step that would have migrated what it made. A run
          # started by hand has no build before it, and says so the same way.
          old() {
            case "$2" in
            "" | 0000000000000000000000000000000000000000)
              why="$1: this run names no build before it -- it was started by hand -- so nothing is migrated from one."
              echo "::notice title=upgrade::${why}"
              echo "${why}" >"${RUNNER_TEMP}/why-$1"
              return
              ;;
            esac
            git worktree add --detach "${RUNNER_TEMP}/$1" "$2"
            was=$(epoch "${RUNNER_TEMP}/$1")
            if [ "${was}" = "${now}" ]; then
              (cd "${RUNNER_TEMP}/$1" && go build -o "${RUNNER_TEMP}/bin-$1/" ./cmd/roster)
            else
              why="$1 is $2, of compatibility epoch ${was}, and this build is of epoch ${now}: it is not built, and nothing it makes is migrated. The epoch moved on purpose: until the first app launches roster keeps nothing for an earlier roster (the owner's decision of 2026-11-09, CLAUDE.md), so staging is made again from nothing, and OLDEST moves to the first build of epoch ${now} once staging runs it."
              echo "::notice title=upgrade::${why}"
              echo "${why}" >"${RUNNER_TEMP}/why-$1"
            fi
          }
          old before "${BEFORE}"
          old oldest "${OLDEST}"
      - name: what the build before made, migrated by this one
        run: |
          if [ ! -x "${RUNNER_TEMP}/bin-before/roster" ]; then
            tee -a "${GITHUB_STEP_SUMMARY}" <"${RUNNER_TEMP}/why-before"
            exit 0
          fi
          scripts/upgrade.sh "${RUNNER_TEMP}/bin-before" "${RUNNER_TEMP}/bin-now"
      - name: what the oldest build a deployment runs made, migrated by this one
        run: |
          if [ ! -x "${RUNNER_TEMP}/bin-oldest/roster" ]; then
            tee -a "${GITHUB_STEP_SUMMARY}" <"${RUNNER_TEMP}/why-oldest"
            exit 0
          fi
          scripts/upgrade.sh "${RUNNER_TEMP}/bin-oldest" "${RUNNER_TEMP}/bin-now"

  # The TypeScript half: it type-checks, and it builds.
  #
  # There is no `npm test` here because `ts/package.json` declares no test
  # script. What that means is worth stating rather than leaving to be inferred:
  # the console is checked by the compiler and by nothing else. The `go` job
  # covers whether `ts/gen/` matches the schema; this covers whether the code
  # written against it still compiles and bundles.
  ts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: npm ci
        working-directory: ts
      - run: npm run check
        working-directory: ts
      - run: npm run build
        working-directory: ts

  # The pages, driven: a browser against a deployment stood up the way the
  # operating guide says to. Its own job because it needs both toolchains and
  # a browser, and because what it checks -- that the page posts what the
  # server reads -- is what every job above has no way to see.
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: npm ci
        working-directory: ts
      - run: npx playwright install --with-deps chromium
        working-directory: ts
      - run: ./scripts/e2e.sh

  # One OAuth flow through a real Hydra, which is the half the Login App's own
  # tests cannot have: they run against a fake, because what they are about is
  # which operator a challenge resolves to and what ends up in the token, and
  # that is decided here rather than by Hydra. What Hydra decides is the
  # protocol around it, and two things were wrong in it with every other gate
  # green -- the challenge does not fit in a cookie, and the app's own
  # environment variables were reported as typos.
  #
  # Its own job because it is `compose.yaml` and an engine rather than a `go
  # test`, and because a minute of it is not a minute every other job should
  # pay.
  #
  # The compose image is `build`'s binaries copied onto alpine -- `DIST` in
  # `docker-bake.hcl` -- and handed to the script rather than built by it.
  hydra:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - run: mkdir dist && tar -xf dist.tar -C dist
      - run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --load dev
        env:
          DIST: ./dist
      - run: ./scripts/hydra.sh
        env:
          ROSTER_DEV_IMAGE: roster-dev

  # The reference deployment, in a real cluster, and the class no fresh process
  # can see.
  #
  # `scripts/cluster.sh`: `deploy/` stood up in k3d with the image this commit
  # builds, against a Hydra with **no `--dev`**; all three walks from `docker/`
  # as Jobs inside it; the declared client changed **under the running pods** and
  # the whole thing asked again; and then the same flow with TLS ending in front
  # of everything, as an overlay -- which is the shape a deployment has.
  #
  # It is here because of what it found in two days: eight defects in `deploy/`,
  # every one of them a thing the deployment that uses it knew and the base did
  # not, and three of them a deployment that would not have started or rendered
  # at all. None of that is reachable from a `go test` or from `compose.yaml`,
  # which runs `--dev` and says so.
  #
  # **Not path-filtered, and that is deliberate.** The obvious version -- run it
  # only when `deploy/` or `examples/product` changed -- needs an `if:`, and a
  # `needs` job that is *skipped* skips its dependents: `image` would stop
  # building on every pull request, which is the property that job exists for. A
  # gate that is sometimes skipped is also a gate somebody has to reason about
  # before trusting it, and this one is ten minutes on a runner nobody is waiting
  # for.
  #
  # Both images out of `build`'s binaries, as `hydra` does: the `app` one that is
  # under test, and the `dev` one the walks run in.
  cluster:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - run: mkdir dist && tar -xf dist.tar -C dist
      - run: docker buildx bake -f docker-bake.hcl --set '*.platform=linux/amd64' --set app.tags=roster-app --load app dev
        env:
          DIST: ./dist
      # Pinned, because a cluster that comes up differently next month is a red
      # run about the wrong thing: the release's own binary, held to the digest
      # its checksums say, rather than the installer, which is read from `main`
      # and fetched the binary with no second attempt. GitHub's releases answer
      # 504 for minutes at a time, so it is asked again (loft#311's `cluster`
      # died on one).
      - name: k3d
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -o "${RUNNER_TEMP}/bin/k3d" https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  ${RUNNER_TEMP}/bin/k3d" | sha256sum -c -
          chmod +x "${RUNNER_TEMP}/bin/k3d"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - run: ./scripts/cluster.sh
        env:
          ROSTER_APP_IMAGE: roster-app
          ROSTER_DEV_IMAGE: roster-dev

  # The image, last, and only after everything above is green.
  #
  # A job of this workflow rather than one of its own, which is the mistake it
  # was: two workflows run beside each other, so a red `ci` does not stop a
  # push, and `:edge` would move to a commit whose tests failed. `needs` is the
  # whole of the fix -- what is in the registry is what the gates passed.
  #
  # Built on every pull request and pushed only from `main`. What is there has
  # to be deployable, and a branch that has not been merged is not that; a
  # change that breaks the build still fails in `build` rather than on the day
  # somebody deploys.
  #
  # Two jobs, `image` and `push`, because permissions are given to a job and
  # not to a step: whatever runs in the job can reach its token, and with
  # `id-token: write` ask for one that says it is this workflow -- whether or
  # not the step that needed them runs. A pull request is code nobody has
  # merged, and a Renovate branch is one, so its build is `image`, which may do
  # what every other job may. `push` is the same build on `main`, and the only
  # job here that can write to the registry or sign as this workflow.
  #
  # Built out of `build`'s binaries and not out of the source: every platform's
  # image is those files copied onto distroless, so this compiles nothing, and
  # the binary pushed is the one `cluster` and `hydra` ran.
  image:
    if: github.event_name != 'push'
    needs: [build, go, postgres, race, upgrade, ts, e2e, hydra, cluster]
    runs-on: ubuntu-26.04

    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
      BUILD_TIMESTAMP: ${{ needs.build.outputs.timestamp }}
      DIST: ./dist

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - run: mkdir dist && tar -xf dist.tar -C dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      # No QEMU. Nothing here runs: the `app` stage is copies onto distroless,
      # and the compiling was `build`'s, cross from the runner's architecture --
      # see `Dockerfile`. Setting it up anyway would be time spent on nothing.

      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # The checkout, not the action's default of the commit fetched again:
          # `./dist` is in neither the repository nor its history. And no cache,
          # because there is nothing here worth keeping -- the layers are files
          # this run just downloaded.
          source: .
          files: docker-bake.hcl
          targets: app

  # `image`, on a push to `main`, and pushed. The steps up to the build are
  # `image`'s, and so is what it says of them.
  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, go, postgres, race, upgrade, ts, e2e, hydra, cluster]
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write # to push to ghcr.io/lesomnus/roster, and the SBOM beside it
      id-token: write # to sign the SBOM, keyless, as this workflow on this ref

    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
      BUILD_TIMESTAMP: ${{ needs.build.outputs.timestamp }}
      DIST: ./dist

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - run: mkdir dist && tar -xf dist.tar -C dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by buildx itself rather than by bake-action, so that a push
      # GHCR refuses is tried again. It has answered `permission_denied:
      # write_package` right after a login that succeeded -- twice on loft's
      # `main` in one week, and a rerun passed each time. Three tries, 10 s and
      # then 30 s apart, each failure said, and the step fails only when all
      # three do. A try again is the same build and push: copies onto a base out
      # of `./dist`, so seconds, and the manifests and blobs a refused try left
      # are what the next one writes. The metadata is what bake-action would
      # have handed the steps below.
      - name: Build
        id: build
        run: |
          meta="${RUNNER_TEMP}/bake-metadata.json"
          try=1
          for wait in 10 30 ''; do
            if docker buildx bake --file docker-bake.hcl --metadata-file "${meta}" --push app; then
              echo "metadata=$(jq -c . "${meta}")" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            if [ -z "${wait}" ]; then
              echo "::error title=push::try ${try} of 3 failed, and it was the last"
              exit 1
            fi
            echo "::warning title=push::try ${try} of 3 failed; trying again in ${wait}s"
            sleep "${wait}"
            try=$((try + 1))
          done

      # What was pushed, said once, rather than left for somebody to ask the
      # registry what a moving tag points at now. `:edge` moves; the digest is
      # what a deployment that means to stay put is told.
      - name: Summarise
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -eu
          {
            echo "| image | digest |"
            echo "| ----- | ------ |"
            printf '%s' "$METADATA" | jq -r '
              to_entries[]
              | select(.value["image.name"])
              | "| \(.value["image.name"] | split(",")[0]) | `\(.value["containerimage.digest"])` |"
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # What the image is made of, attached to exactly the digest just pushed: a
      # CycloneDX referrer, which a scanner reads without pulling the image, and
      # the same document signed as a Sigstore attestation by this workflow on
      # `main` (README, "What the image is made of").
      #
      # The scan of the image finds the Go modules both binaries carry and the
      # base's Debian packages. What it cannot find is the pages: `page` bundles
      # them, and their npm packages leave no trace in the image -- so those come
      # from `ts/package-lock.json`, without the dev dependencies, which is why a
      # package a page imports is a `dependency` there and not a dev one.
      #
      # After `Summarise`, so that a Sigstore outage failing this step still
      # leaves the digest said.
      - name: SBOM
        uses: lesomnus/sbom-attach@08dc096ad211b6ea69f0c98fc315f091db58947e # v1.0.0
        with:
          metadata: ${{ steps.build.outputs.metadata }}
          source: ts
