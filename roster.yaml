# What this deployment is configured with.
#
# A file, then the environment over the top of it: `ROSTER_DB_DSN` beats what
# is written here. `roster config` prints what came out, and
# `roster config env` lists every variable there is.

db:
  driver: sqlite3
  dsn: "file:roster.db?_pragma=foreign_keys(1)"

server:
  addr: ":50051"

  # The second listener, for whatever cannot speak gRPC -- which is every
  # browser. Delete this block and no port is opened, which is what an app with
  # no page in front of it should do.
  #
  # It is the same server: a call arrives as JSON over POST, is re-encoded and
  # handed to the handler a gRPC client would have reached, so it goes through
  # the same interceptors and behind the same wall.
  http:
    addr: ":8080"
    allow_web: true
    # Which page may call. Nothing here is same-origin only, which is right for
    # a built UI this server also serves and wrong for `npm run dev` -- that is
    # 5173, and a different origin.
    origins: ["http://localhost:5173"]

# Who may call this deployment, and who runs it: roster again, on its own
# database, holding keys rather than people. See docs/operating.md.
#
# **Not optional, and it is written out rather than commented out.** `roster
# init` refuses a file with no `control.db`, which is the one setting it insists
# on -- a deployment that adds a control plane later serves `auth.Plain` until
# it does, and an `rt_` minted while nobody is checking becomes a working
# credential the day one is named.
#
# `db` is what decides and not `addr`: a control plane is a database, and an
# address is only how it is reached. A block with everything but the database is
# refused rather than served.
control:
  db:
    driver: sqlite3
    dsn: "file:roster-control.db?_pragma=foreign_keys(1)"
  addr: "127.0.0.1:50052"
  # What the console talks to. A browser cannot speak gRPC, and this is the
  # port that has the rows a console is for. `ts/src/main.tsx` looks here by
  # default.
  http:
    addr: "127.0.0.1:8082"
    allow_web: true
    origins: ["http://localhost:5173"]
  # Its own broker, and empty takes the one `watch.broker` names below. See
  # there for why the two planes do not share one.
  #
  # watch:
  #   broker: memory

# Where an operator administers **customers**: the data plane with no wall,
# behind a session. Its `http` is what a console talks to -- a browser cannot
# speak gRPC, and the transcoder above is in front of the data plane, where an
# operator's session names nobody.
#
# This is where the **first customer** comes from. `init` seeds the control
# plane and nothing else, so a fresh deployment has no tenants at all and the
# console's customers screen is what makes one -- a tenant, somebody in it, the
# role that administers it, and then a password or a key for them. Comment this
# out and there is no way to make a customer but a shell on the box.
#
# It needs a control plane and is refused without one, because the session it
# reads names a holder of that plane.
admin:
  addr: "127.0.0.1:50053"
  http:
    addr: "127.0.0.1:8081"
    allow_web: true
    origins: ["http://localhost:5173"]

# Where `roster tenant ls`, `roster holder get` and the rest send their calls.
#
# **Empty, which is the default, is this process**: the command opens the
# database, builds the server, and reads it over a pipe with no address. That is
# the same answer `roster init` and `roster key` give -- neither has a remote
# form, because what they write is not served -- and it is why the default here
# is the local one rather than the wire. Going local writes a line to the log
# saying so on stderr.
#
# `--HAL` on the root forces the local one whatever this says, for somebody with
# a shell on the box who wants to look at the rows under a deployment configured
# for the wire.
#
# Set, it is a caller like any other, so the wall runs and what comes back is
# what the credential may see. Naming `auth` with no `addr` is **refused**: a
# credential with nowhere to send it would otherwise read the database directly
# while the deployment believes it is calling a server. Which port to name is
# the part with a real answer:
#
#   server.addr   the data plane, walled. A tenant key sees its own tenant, so
#                 `tenant ls` answers with one. Right for a service, not for an
#                 operator.
#   admin.addr    the data plane with no wall -- the operator's view -- and a
#                 command cannot reach it yet. That port takes a session
#                 cookie, which is what a console holds after signing in, and
#                 nothing here signs in. Until that is decided, an operator's
#                 `tenant ls` is the local one.
#
# client:
#   addr: "dns:///roster.internal:50051"
#   # Without TLS, for a network only this deployment is on. Written down rather
#   # than inferred from the address, because inferring it is how a production
#   # address gets served in plaintext by a default nobody read.
#   insecure: true
#   auth:
#     # bearer | plain | none -- the word before the credential in
#     # `authorization`. It is a setting because this app serves more than one,
#     # and which it serves depends on the `control` block above:
#     #
#     #   bearer  an API key, checked against the control plane.
#     #   plain   the caller says who it is and is believed, so the credential
#     #           is a slug: "@contoso/admin". This is what a deployment with **no
#     #           control plane** serves, which is most of them on a first day
#     #           -- and is not something to serve where anyone can reach it.
#     #   none    send nothing, for a port that authenticates at the transport.
#     #
#     # Empty with a credential given is `bearer`. A name that is none of the
#     # three is refused rather than ignored.
#     scheme: bearer
#     # `credential_file` is the same thing from a mount and wins over
#     # `credential`; a file that is named and not there is an error rather than
#     # a call as nobody.
#     credential_file: /run/secrets/roster-key

watch:
  # Named rather than defaulted, and it is the one field this app is refused for
  # leaving out. `memory` publishes inside this process, which is right for one
  # replica and silently wrong for two -- a client watching against one never
  # hears about a write that landed on another, and nothing reports it.
  #
  # A deployment of two replicas needs a broker that crosses them, and this
  # binary has one: `postgres`, which is `LISTEN`/`NOTIFY` on **the database the
  # rows are already in**. No storage, no address, nothing to run -- if this
  # deployment is on PostgreSQL, that is the whole of what scaling out takes.
  #
  #   broker: postgres
  #
  # `watch.dsn` goes with it and should stay empty. It is there for a deployment
  # whose PostgreSQL is reachable at a different address from the one it writes
  # through -- a pooler in front of the writer is the case, and `LISTEN` does
  # not survive one.
  #
  # `memory` is what a single replica and a sandbox want, and is what this file
  # names because it is also what runs on SQLite.
  #
  # `none` serves no Watch at all, and says so -- a stream is refused outright
  # rather than opening and never speaking. It is not a way to run two replicas;
  # it is a way to say this deployment has no watchers.
  #
  # An **outbox** is a different question and it composes with this one. It
  # makes an event survive a crash between the commit and the publish, by
  # writing a row in the same transaction, and the drainer then publishes into
  # whatever broker is named here. So with `memory` it is durability and not
  # fan-out; with `postgres` it is both, which is what a deployment that can
  # lose neither wants.
  broker: memory

  # The control plane publishes its own changes, to its own broker, and this is
  # where that is said. Empty takes the name above.
  #
  # Two brokers because they are two subjects: one publishing into the other
  # would have a key being issued look like a person changing, to every client
  # watching. This used to be `memory` written into the code, which made the
  # console the one screen a second replica broke without saying so.
  #
  # It is `control.watch.broker`, beside `control.db` -- see the block above.
