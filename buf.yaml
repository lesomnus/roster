version: v2
modules:
  - path: ./proto
    excludes:
      # The overlays: what this app adds to a generated contract. They are
      # fragments rather than files that compile -- a message in one names
      # types that exist only after the merge -- so buf must not read them.
      # `pd gen` hands them to protobuf-merge by path.
      - proto/ext
deps:
  # payday's own: the `(payday.entity)` option every entity carries, and the
  # batch service. It is the `dev` label rather than a version because payday
  # has no users yet -- pin a commit when it does.
  - buf.build/payday/payday:dev
  - buf.build/orm/orm
  - buf.build/patch/patch
lint:
  use:
    - STANDARD
  except:
    # The service contracts are generated from the entities: a request is named
    # after the entity it is about and the answer is the entity itself. That is
    # the shape of the whole stack, and it is not what buf expects of a service
    # somebody wrote by hand.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_SAME_DIRECTORY
breaking:
  use:
    - FILE
    # A message's or a service's **file** is not its wire either, so long as the
    # package keeps it. Moving one between files of `roster` changes neither its
    # full name nor the Go package a client imports (`rstr`); what moves is the
    # generated TypeScript module that exports it, and every reader of those is
    # this repository's console. So a deletion is checked per package and not
    # per file -- taken when `GroupMembership` moved beside the team's and the
    # site's memberships for its role edge (#120), since `role.proto` imports
    # `group.proto` and the edge could not be declared there.
    #
    # The day something outside this repository imports the TypeScript, put the
    # file rules back.
    - PACKAGE_MESSAGE_NO_DELETE
    - PACKAGE_SERVICE_NO_DELETE
    # Cardinality as the wire and JSON see it, in place of `FIELD_SAME_CARDINALITY`
    # below. A field going singular to repeated, or into a oneof, still fails;
    # a field going from implicit to explicit presence does not, since its bytes
    # and its JSON are the same either way.
    - FIELD_WIRE_JSON_COMPATIBLE_CARDINALITY
  except:
    - MESSAGE_NO_DELETE
    - SERVICE_NO_DELETE
    # A field's **name** is not its wire. The number and the type are what an
    # encoded message carries, and those are still checked -- what these two
    # rules cover is the accessor a generated client calls and the key a JSON
    # body uses, and both are regenerated here from this schema. Excluded when
    # `service` became `holder_alias` on `ApiKey.Issue` and `Credential.Issue`
    # (#28): the field named a kind of holder that does not exist, and the only
    # caller that sends it as JSON is this repository's own console.
    #
    # The day something outside this repository reads these, put them back:
    # then a rename is a migration somebody else has to make.
    - FIELD_SAME_NAME
    - FIELD_SAME_JSON_NAME
    # And a field's **presence** is not its wire either. A field that declares
    # `(orm.field).default` is one an `Add` may leave out, so the generated
    # request gives it explicit presence -- `*string` in Go where it was
    # `string` -- while its bytes and its JSON stay what they were. Excluded when
    # `connection.subject_claim`, `connection.provisions` and `holder.directory`
    # declared theirs, so that a row that predates the column holds it (#124).
    #
    # The day something outside this repository builds these requests, put it
    # back: then a field that became a pointer is a compile error somebody else
    # has to fix.
    - FIELD_SAME_CARDINALITY
  # One change, payday's and on purpose (lesomnus/payday#171), read here
  # because `buf breaking` reads the imports too: an event message declares the
  # kinds it holds, `repeated string kinds = 1`, where it declared one,
  # `string kind = 1`. It is the option an app writes on its event messages,
  # and roster writes none -- and it keeps the number, so an option compiled
  # against the old one reads as its one kind. Nothing on roster's wire moves.
  #
  # payday took the same exception for its own check and took it out once its
  # baselines had the change (payday#172). This one comes out with the first
  # change after it reaches `main`, which is the only baseline here: left in,
  # it is a hole in the check for the next change to that file. The path is the
  # import's, under the module it is read into.
  ignore_only:
    FIELD_WIRE_JSON_COMPATIBLE_CARDINALITY:
      - proto/payday/past.proto
