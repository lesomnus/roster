edition = "2023";
package roster;

import "app/delegation.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/holder_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service DelegationService {
  // Add creates a new Delegation
  rpc Add(DelegationAddRequest) returns (Delegation);
  // Get retrieves a Delegation
  rpc Get(DelegationGetRequest) returns (Delegation);
  // Patch updates an existing Delegation
  rpc Patch(DelegationPatchRequest) returns (Delegation);
  // Apply applies a patch document to an existing Delegation
  rpc Apply(DelegationApplyRequest) returns (Delegation);
  // Erase deletes a Delegation
  rpc Erase(DelegationRef) returns (DelegationEraseResponse);
  // List reads Delegations a page at a time.
  rpc List(DelegationListRequest) returns (DelegationListResponse);
  // Revoke ends a delegation before its expiry -- the delete D23 said a sign-out
  // has to be able to make.
  //
  // Everything answers the same: a token that was never here, one that has
  // expired, one somebody else was issued -- each succeeds and removes nothing,
  // which is `Erase`'s rule (*erasing what is not there succeeds*) and what
  // keeps the answer from telling whoever holds a found string whether it is
  // real, whose it is, or still alive. What a caller may rely on is that a
  // delegation **it** was issued is gone afterwards.
  rpc Revoke(DelegationRevokeRequest) returns (DelegationRevokeResponse);
  // Exchange is a short-lived token naming the caller, for one other app in the
  // same tenant to check -- how one roster-hosted app proves who it is to
  // another (#74, `docs/apps.md`).
  //
  // # A delegation, issued to the receiver
  //
  // A delegation already says *who* (`holder`) and *who may present it*
  // (`issuer`), and `TokenService/Introspect` already answers only the caller
  // it was issued to. So this mints one about the **caller** and issues it to
  // the **audience**: kamino, narrowed to acme, asks for a token for
  // `@acme/khala`; khala, narrowed to acme too, introspects it and is told
  // `@acme/kamino`. Nobody else is told anything -- kamino included -- and the
  // token is as good as a stranger's string to every caller but khala.
  //
  // # Checked by roster, which is why roster may make it
  //
  // roster issues nothing a third party verifies without asking (CLAUDE.md,
  // *the other rule*). This is opaque, and the receiver asks: the same kind of
  // thing an `rt_` is.
  //
  // # Who may ask
  //
  // A holder: a person's credential, or a deployment key narrowed with
  // `roster-at` to the holder a tenant nominated for it. A deployment key as
  // itself is nobody in any tenant and is refused, and so is a caller acting
  // through a delegation (`roster-as`) -- minting from one would renew it. The
  // audience is one of the caller's own tenant's holders, and not the caller:
  // a call across tenants is not something this can say, and a token for
  // yourself proves nothing to anybody.
  rpc Exchange(DelegationExchangeRequest) returns (DelegationExchangeResponse);
}

message DelegationAddRequest {
  bytes id = 1;
  HolderRef holder = 2;
  repeated string methods = 8;
  bytes secret = 9 [features.field_presence = IMPLICIT];
  bytes issuer = 10 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_expires = 11;
  google.protobuf.Timestamp date_created = 15;
}

message DelegationGetRequest {
  DelegationRef ref = 1;
  DelegationSelect select = 2;
}

message DelegationRef {
  oneof key {
    bytes id = 1;
    bytes secret = 9;
  }
}

message DelegationSelect {
  bool all = 1;
  HolderSelect holder = 2;
  bool methods = 8;
  bool secret = 9;
  bool issuer = 10;
  bool date_expires = 11;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message DelegationPatchRequest {
  DelegationRef ref = 1;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message DelegationApplyRequest {
  DelegationRef ref = 1;
  patch.Patch patch = 2;
}

message DelegationEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message DelegationListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated DelegationFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message DelegationListResponse {
  repeated Delegation items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message DelegationFilter {
  DelegationRef ref = 1;
  HolderRef holder = 2;
}

message DelegationRevokeRequest {
  // The delegation to end, as it was handed over.
  string token = 1 [features.field_presence = IMPLICIT];
}

message DelegationRevokeResponse {}

message DelegationExchangeRequest {
  // Who the token is for: the holder the receiving app is in this tenant -- the
  // one its own key is narrowed to when it introspects.
  HolderRef audience = 1;

  // What the token is for, at the receiver: usually its own methods. The
  // receiver narrows by them as it would by a key's; what the caller may
  // actually do there is still the receiver's to decide, with
  // `HolderService/Reaches`. Required, for `Delegate`'s reason: a token that
  // allows nothing opens no door.
  //
  // Held to what the caller's own credential allows, as `Vouch.Delegate`
  // holds its tokens: the receiver may present this beside its key in
  // `roster-as`, and roster answers that as the caller within these methods,
  // whatever they name. A key attenuated to a few methods hands on no more.
  repeated string methods = 2;
}

message DelegationExchangeResponse {
  // The token, shown once.
  string token = 1 [features.field_presence = IMPLICIT];

  // When it stops working.
  google.protobuf.Timestamp date_expires = 2;
}
