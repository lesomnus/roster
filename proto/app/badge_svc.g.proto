edition = "2023";
package roster;

import "app/badge.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "roster/payday/holder_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service BadgeService {
  // Add creates a new Badge
  rpc Add(BadgeAddRequest) returns (Badge);
  // Get retrieves a Badge
  rpc Get(BadgeGetRequest) returns (Badge);
  // Patch updates an existing Badge
  rpc Patch(BadgePatchRequest) returns (Badge);
  // Erase deletes a Badge
  rpc Erase(BadgeRef) returns (BadgeEraseResponse);
  // List reads Badges a page at a time.
  rpc List(BadgeListRequest) returns (BadgeListResponse);
  // Enrol makes somebody's badge, or replaces all of it where they have one:
  // the code, the PIN, the count and the lock. Answers the badge as `Get`
  // would, without the verifier.
  //
  // For whoever administers the tenant's people, and held to the rule every
  // way in is held to: nobody writes a way into an account wider than their
  // own (`mayReach`). A badge is a way in at every station that asks.
  //
  // The PIN is decimal digits, at least `vouch.badge.pin.min_length` of them
  // and at most twelve. A code another person of the tenant has is
  // `AlreadyExists`, naming the field and nobody. A deployment with no
  // keyring is `Unimplemented`: the verifier is sealed under it.
  rpc Enrol(BadgeEnrolRequest) returns (Badge);
  // Unlock clears somebody's lock and their count, leaving the PIN. Held to
  // `mayReach`, as a password's unlock is: a lock you may clear is one you
  // could have caused.
  rpc Unlock(BadgeUnlockRequest) returns (BadgeUnlockResponse);
  // Verify answers whether a PIN is the one held for the badge that says
  // `code`, in the caller's tenant.
  //
  // In the shape and the habit of `VouchService/Verify`, so that a station
  // is written against one: the call succeeds and `ok` is false, one answer
  // at one cost, for a code nobody has, a wrong PIN, somebody suspended,
  // erased or of a closed tenant, and somebody the caller's grant does not
  // reach -- a station bound in a site checks the badges of that site's
  // people and no others. `locked` beside it for a badge that is locked,
  // which a person at a station needs to be told. Anything else is roster
  // not having answered.
  //
  // A wrong PIN is counted on the badge, and at `vouch.badge.lockout.
  // failures` the badge locks; a locked badge is not compared and not
  // counted. It makes no session, no delegation and nothing to sign out of:
  // what a station holds afterwards is its app's own.
  rpc Verify(BadgeVerifyRequest) returns (BadgeVerifyResponse);
}

message BadgeAddRequest {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
  HolderRef holder = 2;
  string code = 8 [features.field_presence = IMPLICIT];
  bytes secret = 9 [features.field_presence = IMPLICIT];
  int32 failures = 10 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_locked = 11;
  google.protobuf.Timestamp date_rotated = 12;
  bytes tenant_id = 16 [
    (orm.field) = {type: TYPE_UUID},
    features.field_presence = IMPLICIT
  ];
  google.protobuf.Timestamp date_created = 15;
}

message BadgeGetRequest {
  BadgeRef ref = 1;
  BadgeSelect select = 2;
}

message BadgeRef {
  oneof key {
    bytes id = 1 [(orm.field) = {type: TYPE_UUID}];
    BadgeRefByHolder holder = 2;
    BadgeRefByCode code = 16;
  }
}

message BadgeRefByHolder {
  HolderRef holder = 2;
}

message BadgeRefByCode {
  bytes tenant_id = 16 [(orm.field) = {type: TYPE_UUID}];
  string code = 8;
}

message BadgeSelect {
  bool all = 1;
  HolderSelect holder = 2;
  bool code = 8;
  bool secret = 9;
  bool failures = 10;
  bool date_locked = 11;
  bool date_rotated = 12;
  bool tenant_id = 16;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message BadgePatchRequest {
  BadgeRef ref = 1;
  string code = 16;
  bytes secret = 18;
  int32 failures = 20;
  google.protobuf.Timestamp date_locked = 22;
  // Clear date_locked instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_locked clears.
  bool date_locked_null = 23;
  google.protobuf.Timestamp date_rotated = 24;
  // Clear date_rotated instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_rotated clears.
  bool date_rotated_null = 25;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message BadgeEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message BadgeListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated BadgeFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];

  // Read the order the other way round, every column of it at once -- newest
  // first where it is oldest first -- which the index the order walks walks
  // from the other end. A cursor is of the way it was read, so the next page
  // carries on that way, and one of the other way is refused.
  bool reverse = 4 [features.field_presence = IMPLICIT];

  // Which fields of each row to answer with, and which edges filled and how
  // deep, as a Get's select says it. Unset is what a list answers without
  // one. Each row is read as a Get of it with this select would read it, each
  // edge through what the caller may see of its entity; a list costs one
  // read for the rows and one for each edge selected, at any depth, however
  // many rows the page holds.
  //
  // Field 6 in every entity: 5 is the order's, declared or not.
  BadgeSelect select = 6;
}

message BadgeListResponse {
  repeated Badge items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message BadgeFilter {
  BadgeRef ref = 1;
  HolderRef holder = 2;
  bytes tenant_id = 3 [(orm.field) = {type: TYPE_UUID}];
}

message BadgeEnrolRequest {
  // Whose badge, by reference -- an id or `@tenant/alias`.
  HolderRef holder = 1;

  // What the badge says: 1 to 128 bytes, no control character, compared as
  // written.
  string code = 2 [features.field_presence = IMPLICIT];

  // The PIN, as typed: decimal digits. Hashed and sealed here, never stored
  // as given.
  string pin = 3 [features.field_presence = IMPLICIT];
}

message BadgeUnlockRequest {
  // Whose badge, by reference -- an id or `@tenant/alias`.
  HolderRef holder = 1;
}

message BadgeUnlockResponse {
  // When it had locked, or unset if it was not locked -- so an administrator
  // can tell "I opened it" from "it was not closed".
  google.protobuf.Timestamp date_locked = 1;
}

message BadgeVerifyRequest {
  // What the badge says, as the station read it.
  string code = 1 [features.field_presence = IMPLICIT];

  // The PIN, as typed.
  string pin = 2 [features.field_presence = IMPLICIT];
}

message BadgeVerifyResponse {
  // The PIN is the one held, and the badge's person may be let in. False for
  // everything else, told apart by nothing but `locked`.
  bool ok = 1 [features.field_presence = IMPLICIT];

  // Whose badge it is, and their tenant, when `ok`; empty otherwise.
  bytes holder = 2 [features.field_presence = IMPLICIT];
  bytes tenant = 3 [features.field_presence = IMPLICIT];

  // The badge is locked, and nothing was compared: somebody who administers
  // its person unlocks it, or the deployment's `vouch.badge.lockout.for`
  // runs out.
  bool locked = 4 [features.field_presence = IMPLICIT];
}
