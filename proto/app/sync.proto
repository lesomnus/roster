edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// SyncService is the one stream an app that trusts roster holds open.
//
// # What it is for
//
// An app that has signed somebody in holds a copy of a decision: *this browser
// is this person, and they may do these things.* That copy is true when it is
// made and roster is where it stops being true -- somebody is suspended, signed
// out everywhere, or erased -- and until this there was no way for the app to
// hear about it. Item 4 has carried this as "the sync channel" from the
// beginning, and D26 named its first real subject: *this person's credentials
// changed, stop trusting what you were told.*
//
// # The app dials roster, and roster calls nobody
//
// Which is the whole of what keeps it small. There are no subscription URLs to
// keep, no outbound requests from roster to wherever an app said, and a
// reconnect in place of a retry-and-dead-letter machine. roster already speaks
// server streaming; this is one more stream on the port an app already holds a
// credential for.
//
// # Why it is not the entity `Watch`
//
// `Holder` declares `watch: {}` and every fact this carries is a column on that
// row, so an app **could** watch holders and read the three columns itself.
// Item 4 says why not, and the sentence is the whole design: *a `Holder`
// changes for reasons nobody needs to hear about.* A rename, a profile, a
// label -- all of them wake every subscriber and none of them means anything
// to a session. This wakes an app when a session it may be holding has stopped
// being good, and -- once per person per connection, the first time it hears of
// them with anything at all set -- when one may already have.
//
// It is also **less** than a watch on purpose: no row travels, only the three
// facts. And the generated `Watch` refuses a subscription with no filters --
// *the whole table, forever* -- which is exactly the subscription an app wants
// here and cannot narrow, because it does not know in advance who will sign in
// next. What makes that affordable is that this carries no rows: the cost is
// set by how many people change while an app is connected, and not by how many
// people there are.
//
// # What it does not promise, and what to do about that
//
// **It says what changed while you were listening.** Nothing is replayed and
// there is no snapshot: a stream that ended is a stream that missed things, and
// the honest answer to a reconnect is to stop trusting what you hold rather
// than to ask this for a catch-up it cannot give.
//
// That is not a gap, because the authority already exists.
// `payday.TokenService/Introspect` answers whether a credential is still good,
// synchronously, and is what an app falls back to. This stream is the
// optimisation that saves asking; `Introspect` is the truth.
//
// A deployment with no broker cannot serve this at all and says so --
// `watch.ErrNoBroker` -- rather than opening a stream that will never carry
// anything, which is the one failure a client cannot tell from a quiet system.
service SyncService {
  rpc Watch(SyncWatchRequest) returns (stream SyncEvent);
}

message SyncWatchRequest {
  // Nothing, and that is the shape rather than a first version.
  //
  // What an app hears is narrowed by the **wall**, exactly as a read is: a key
  // belongs to the deployment and hears every tenant, and a credential
  // resolving to a person hears their tenant. A field naming whose events to
  // send would be a second narrowing beside the one that already decides, and
  // two answers to *what may this caller see* is the shape of the bug rather
  // than a convenience.
}

// SyncEvent is what is true about somebody now, sent because it may have
// stopped being what an app was told.
//
// # It carries state and not a delta
//
// Which is the rule the whole watch machinery is built on, and the reason a
// stream that missed something is still correct: what arrives is the three
// facts as they are, so a duplicate is a no-op, an out-of-order pair converges,
// and an app that reconnects is told the truth rather than a history. An event
// saying only *invalidated* would be a delta, and a delta that did not arrive
// is a lie that never gets corrected.
//
// So the three timestamps below are the message, and [SyncEvent.reason] is
// commentary on them.
message SyncEvent {
  // Who it is about, by the identifier every product knows them by -- `sub`.
  bytes holder = 1;

  // And which tenant they are in, so an app serving several does not have to
  // ask to know which of its sessions to look at.
  bytes tenant = 2;

  // What an app has to do about it, when this stream can tell.
  //
  // Named for the act rather than for the column that moved, because the column
  // is roster's vocabulary and this is read by somebody who has never seen the
  // schema.
  //
  // **Best effort, and `UNSPECIFIED` is a real answer.** This stream works out
  // what changed by remembering what it last sent, so the first time it hears
  // about somebody it has the facts and not the movement -- which is exactly
  // what every event is immediately after a reconnect, and is why the facts are
  // here beside it. An app that switches on this field alone will be told
  // nothing on that first event; an app that compares the three timestamps
  // against its own session is right every time.
  SyncReason reason = 8;

  // When this was sent, which is worth having for a log and for nothing else.
  // What decides anything is the three fields below.
  google.protobuf.Timestamp at = 9;

  // Everything issued to them before this is void, and unset means nothing is.
  //
  // The one field an app cannot work out for itself, and the one it is most
  // likely to be holding a stale answer to: a session older than this is not a
  // session, and one minted after it is untouched. Compare rather than drop.
  google.protobuf.Timestamp date_invalidated = 11;

  // They may not sign in, and everything they already held stopped working.
  // Unset is somebody in good standing -- including somebody who **was**
  // suspended and is not any more, which is a fact an app has no other way to
  // learn.
  google.protobuf.Timestamp date_disabled = 12;

  // They are gone. Nothing resolves to them any more, and an app holding a
  // session for them is holding a name for nobody.
  google.protobuf.Timestamp date_erased = 14;
}

// SyncReason is why a copy has stopped being good.
//
// See [SyncEvent.reason]: this is commentary on the timestamps and not the
// message. Every value here can be derived from a pair of events, and is here
// so that a log and a screen have a word for what happened.
enum SyncReason {
  // This stream has the facts and not the movement -- the first thing it heard
  // about this person, which is what every event is immediately after a
  // reconnect. The timestamps are still true.
  SYNC_REASON_UNSPECIFIED = 0;

  // [SyncEvent.date_invalidated] moved forward.
  SYNC_REASON_INVALIDATED = 1;

  // [SyncEvent.date_disabled] was set.
  SYNC_REASON_SUSPENDED = 2;

  // And cleared, which is here because an app that dropped their sessions has
  // no other way to learn it may stop refusing them.
  SYNC_REASON_REINSTATED = 3;

  // [SyncEvent.date_erased] was set.
  SYNC_REASON_ERASED = 4;
}
