edition = "2023";

package roster;

import "roster/payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Site is where a deployment of the product runs, and the boundary everything
// in it is isolated by.
//
// A tenant is the wall between customers; a site is the wall inside one. A
// factory, a region, an environment -- whatever the customer runs a copy for.
// It is payday's **second axis**: an entity that names a site at field 3 is
// narrowed by both, and a caller who may see a tenant does not thereby see
// every site in it.
//
// It is a row rather than a label because things point at it and because it has
// a name people say.
//
// # What is said of one is said when it is made
//
// A site has `Add` and `Erase` and no write between them, and no port serves
// a general one (`cmd/serve.go`). So over the wire its alias, its name, its
// description and its labels are what `Add` was told. Changing one is the
// deployment's, at the box (`roster site patch`); or the site is erased and
// made again, which takes what is in it out first.
message Site {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Unique within the tenant, which is what makes `@contoso/seoul` a name
  // somebody can type into a configuration file.
  string alias = 4;

  string name = 5;
  string desc = 6;

  // Whatever the deployment keeps about a site that the schema does not name.
  //
  // Nothing reads them. They were to be what a grant selects on -- a grant
  // over `{"region": "asia"}`, the design's `admin_scope` -- and no grant
  // does: a binding names one site or none (`role.proto`), and nothing
  // resolves a selector to a set of sites.
  map<string, string> labels = 7;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "tenant", number: 2},
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "slug"
        refs: [
          {name: "alias", number: 4},
          {name: "tenant", number: 2}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 7
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "tenant"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}
