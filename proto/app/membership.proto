edition = "2023";

package roster;

import "app/site.proto";
import "app/team.proto";
import "app/group.proto";
import "app/role.proto";
import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// SiteMembership is somebody being in a site.
//
// Unlike the two memberships below it, writing one is **not** a grant: nothing
// that decides what the gate answers reads this row. Worth saying because it is
// the reader's next question once the other two are refused as grants, and
// because the answer is a property of `cmd.policy` rather than of this message
// -- a row the policy started reading would become one.
//
// # And it does not widen a read either
//
// Which is the half that is easy to get wrong, and was written here wrongly
// once: *changes what they may see and not what they may do*. It changes
// neither. `policy.of` builds the sites a caller is narrowed to out of the site
// on each `Binding` that reaches them and the site of each `Team` they are on,
// and it never queries this table -- so somebody with a membership in Frankfurt
// and no binding there reads nothing of Frankfurt's.
//
// So this is a **record** rather than an input: it answers *who is here*, which
// is a question a product asks and a console draws. Giving somebody a site's
// rows is a binding scoped to that site, and it is a separate act on purpose.
//
// A row rather than an edge on the Holder because it is many-to-many: a person
// works at one factory and audits another, and a support engineer sees several.
// That is why the Holder itself carries no site -- see `team.proto`.
//
// It sits on the second axis itself. A caller narrowed to Seoul reads Seoul's
// memberships and not Frankfurt's, which is what makes "who is here" answerable
// without seeing who is anywhere else.
message SiteMembership {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // Immutable: moving somebody between sites is leaving one and joining
  // another, and the trail should say both happened rather than showing one row
  // that changed its mind.
  Site site = 3 [(orm.edge) = {immutable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "member"
        refs: [
          {name: "holder", number: 2},
          {name: "site", number: 3}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 11
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "holder"}, {name: "site"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}

// TeamMembership is somebody being on a team, which is where a role comes from.
//
// # Naming a role here is granting it
//
// The gate is outermost and never sees which team a call is about, so
// `policy.of` unions the methods of a role held in a team into what somebody
// may **ever** call, and `server/core` refuses the wrong team per call. Which
// means attaching a role here hands out its methods, and `Add` and `Patch` are
// both refused when they name one the caller does not hold -- at the team's
// site, which is the scope a team sits in. `server/core/escalate.go`.
//
// The design derives roles from team membership **within a site**: the same
// person is an operator in Seoul and a reader in Frankfurt, and a role that
// meant one thing everywhere could not say that. A team belongs to a site, so
// this row inherits the distinction rather than repeating it.
message TeamMembership {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // 3 is not a Site here, and deliberately: the site is the team's, and saying
  // it twice is two facts that can disagree. What narrows this by site is the
  // team it points at.
  Team team = 8 [(orm.edge) = {immutable: true}];

  // What being on it means. A string rather than an enum for the reason
  // `Identity.provider` is one: the set is a deployment's to choose.
  // What they may do in it, and empty is a plain member.
  //
  // An edge and not the string it used to be. A string is a role nothing reads
  // -- which is what it was -- and the thing that reads one has to know what it
  // allows. Where the reference sits is the scope: on this row it is that team,
  // and on a [Binding] it is a site or the whole tenant.
  Role role = 9 [(orm.edge) = {nullable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "member"
        refs: [
          {name: "holder", number: 2},
          {name: "team", number: 8}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 12
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "holder"}, {name: "team"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}

// GroupMembership is somebody being in a [Group].
//
// # Writing one is a grant
//
// A binding written to a group is held by everybody in it -- that is what a
// group is for -- so putting somebody in one hands them every binding that
// names it. Which makes this a grant although it mentions no role, and it is
// refused on the same terms `Binding.Add` is: nobody hands out what they do not
// hold, each binding checked at the scope it was made in.
// `server/core/escalate.go`.
//
// A row rather than a list on either side, for the reason every membership here
// is one: it is many-to-many, and it is a fact with a date of its own.
//
// # A group's managers
//
// Somebody whose membership carries a [role] manages that group: they may put
// people into it and take them out, and they may not do either to another
// group. The rule a team's administrators have, and asked the same way -- the
// gate lets them through for the method, and `server/core` refuses every group
// but the one they hold it in (`mayChangeGroup`).
//
// A manager is a member. Keeping them out of the group would protect nothing,
// since a manager can put an accomplice in.
message GroupMembership {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  Group group = 8 [(orm.edge) = {immutable: true}];

  // What they may do in this group, and empty is a plain member.
  //
  // Held here, it reaches this group and nothing else, so it may name only
  // what changes the group's members -- `GroupMembershipService/Add` and
  // `/Erase`. Anything wider would be handed out tenant-wide by the gate,
  // which never sees which group a call is about.
  //
  // Attaching one is appointing a manager, and is held to what the appointer
  // holds through a binding: a manager may put people in and may not make
  // another manager.
  Role role = 9 [(orm.edge) = {nullable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "member"
        refs: [
          {name: "holder", number: 2},
          {name: "group", number: 8}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 17
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "holder"}, {name: "group"}]
      size: 20
      max: 100
    }
  };
}
