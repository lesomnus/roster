edition = "2023";

package roster;

import "roster/payday/tenant.proto";
import "roster/payday/holder.proto";
import "app/site.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Group is a named set of people, and nothing else.
//
// The row grants nothing by itself, which is not the same as a group granting
// nothing: a binding written to one is held by everybody in it, so joining is
// where the grant lands. See [GroupMembership].
//
// What a group can do is what a [Binding] gives it, and that separation is
// deliberate: a group that carried permissions would
// be a role wearing a membership's clothes, and the two change for different
// reasons -- who is in marketing changes weekly, what marketing may do changes
// when somebody decides it does.
//
// # Why it is not a Team
//
// A `Team` belongs to a `Site` and is the organisation's own structure: who
// works together. A group is who a rule is written about, and a deployment with
// no sites at all still needs one. Using a team would mean inventing a site
// nobody wanted in order to say "these three people may reset passwords".
message Group {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Optional, the way a role's is: a group belonging to a site is narrowed by
  // it, and one belonging to none is the tenant's.
  Site site = 3 [(orm.edge) = {immutable: true, nullable: true}];

  string alias = 4;
  string name = 5;
  string desc = 6;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "alias"
        refs: [
          {name: "tenant", number: 2},
          {name: "alias", number: 4}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 16
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}]
      size: 20
      max: 100
    }
  };
}

// GroupMembership is somebody being in a [Group].
//
// # Writing one is a grant
//
// A binding written to a group is held by everybody in it -- that is what a
// group is for -- so putting somebody in one hands them every binding that
// names it. Which makes this a grant although it mentions no role, and it is
// refused on the same terms `Binding.Add` is: nobody hands out what they do not
// hold, each binding checked at the scope it was made in. PLAN.md D40.
//
// A row rather than a list on either side, for the reason every membership here
// is one: it is many-to-many, and it is a fact with a date of its own.
message GroupMembership {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  Group group = 8 [(orm.edge) = {immutable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "member"
        refs: [
          {name: "holder", number: 2},
          {name: "group", number: 8}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 17
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}]
      size: 20
      max: 100
    }
  };
}
