edition = "2023";

package roster;

import "roster/payday/tenant.proto";
import "app/site.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Group is a named set of people, and nothing else.
//
// The row grants nothing by itself, which is not the same as a group granting
// nothing: a binding written to one is held by everybody in it, so joining is
// where the grant lands. See [GroupMembership].
//
// What a group can do is what a [Binding] gives it, and that separation is
// deliberate: a group that carried permissions would
// be a role wearing a membership's clothes, and the two change for different
// reasons -- who is in marketing changes weekly, what marketing may do changes
// when somebody decides it does.
//
// # Why it is not a Team
//
// A `Team` belongs to a `Site` and is the organisation's own structure: who
// works together. A group is who a rule is written about, and a deployment with
// no sites at all still needs one. Using a team would mean inventing a site
// nobody wanted in order to say "these three people may reset passwords".
message Group {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Optional, the way a role's is: a group belonging to a site is narrowed by
  // it, and one belonging to none is the tenant's.
  //
  // # It narrows who can see this row, and not who may be in it
  //
  // Which is worth saying because the other reading is the natural one and is
  // wrong. Nothing requires a member to belong to this site: [GroupMembership]
  // carries no site at all -- no field 3, so the second axis does not reach it
  // -- and `server/core` refuses only a member from another **tenant**. A
  // `Holder` has no site of its own either, since being in one is
  // `SiteMembership` and that is many-to-many.
  //
  // So a group is the one place where people across several sites are one
  // subject, and that is what it is for. A team is the other shape and belongs
  // to exactly one site.
  //
  // # And it is not what scopes the grant
  //
  // The [Binding]'s site is. A group with members in Seoul and in Frankfurt,
  // bound to a role within Seoul, gives all of them that role in Seoul --
  // `cmd.policy` unions the sites off the bindings that reach somebody and
  // never reads their `SiteMembership`.
  //
  // Read *a group in a site* as **whose group this is**, never as *whose people
  // these are*.
  Site site = 3 [(orm.edge) = {immutable: true, nullable: true}];

  string alias = 4;
  string name = 5;
  string desc = 6;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "tenant", number: 2},
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        // payday's shape: `slug`, alias before parent. See `Role` and D58.
        name: "slug"
        refs: [
          {name: "alias", number: 4},
          {name: "tenant", number: 2}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 16
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "tenant"}, {name: "site"}]
      size: 20
      max: 100
    }
  };
}

// GroupExposure is a client whose tokens carry a [Group]: the `client_id` of a
// relying party that grants on the group, by its alias.
//
// # Why a token carries a group at all
//
// Most of what reads a roster token asks roster what somebody may do
// (`HolderService.Reaches`), and a group is never in a token for them. Some
// relying parties cannot ask anything -- Dependency-Track, kube-apiserver --
// and authorize from a token's claims alone: a list of names, mapped to their
// own permissions. For them, and only for a client registered for the
// `groups` scope, a token carries the person's groups that name that client
// here, as `groups`, and nothing else of their membership.
//
// So a group reaches a client because a tenant's administrator said it does,
// one row per client. Its managers decide who is in it (`GroupMembership`), and
// not who sees it.
//
// # A row rather than a list on the group
//
// The reason every membership here is one: it is many-to-many, and a fact with
// a date of its own -- the trail says who showed which group to which relying
// party, and when. And a list is what a write could not empty: a generated
// `Patch` leaves an empty list as it was, and a row is erased.
message GroupExposure {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Group group = 2 [(orm.edge) = {immutable: true}];

  // The client, as the issuer names it: what a token's `azp` and an ID
  // token's `aud` say. A string because the client is the issuer's row and not
  // roster's.
  string client = 8 [(orm.field) = {immutable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "carried"
        refs: [
          {name: "group", number: 2},
          {name: "client", number: 8}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 28
    tenanted: {via: "group.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "group"}]
      size: 20
      max: 100
    }
  };
}
