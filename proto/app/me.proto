edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// MeService answers what a caller is, in one round trip.
//
// # Why it is not four reads
//
// Everything here is already readable: a `Holder`, their `Email` rows, the
// teams they are in, the roles they hold. A page that drew them would make four
// calls and then do the join itself -- in TypeScript, differently in every app
// that tried.
//
// What makes it one RPC rather than a convenience is that the **join is
// roster's**. Which roles somebody effectively holds is a union over bindings,
// group memberships and team memberships, and an app that computed it from the
// parts would be a second implementation of `gate.Policy` that drifts from the
// one enforcing it. So this answers with what roster itself would decide.
//
// # It takes nothing
//
// There is no subject field, and that is the point: it answers about **the
// caller**, read from the frame. A version that took an identifier would be
// `Holder.Get` with extra steps, and would need its own rule about who may ask
// about whom -- which `Holder.Get` already has, in the wall.
//
// # Only what no role can be asked for
//
// Three methods, and each is one somebody **must** be able to do with no role
// at all: read their own record, sign out of every session they no longer
// trust, and -- where their tenant offers it -- leave. `cmd.Policy` waives a
// binding for exactly these, and a method can be waived only if it takes no
// subject -- `cmd/asself_test.go` refuses one that carries a field that could
// name somebody -- so these are subject-less by necessity, not by preference.
//
// Everything else a person does to their own account is the entity's own verb
// with their own reference: `Identity.Add` to attach a provider account and
// `Identity.Erase` to take one away, `ApiKey.Issue` to mint a key that acts as
// them, `ApiKey.Erase` to end one, `Credential.Set`/`Enrol` for a password and
// a factor. Those were once `Link`, `IssueKey` and `RevokeKey` here -- a
// self-only twin of each verb, for the grant it let a role name -- and were
// folded back by the rule in CLAUDE.md,
// *no self-only twin of a verb*: RBAC grants the method, *whose row* is the
// layer's (`mayReach`), and the app that serves a person is what passes only
// their reference.
//
// # What it is not
//
// Not a token, not a session, and not something to cache. It is a read, and the
// answer is true when it was made.
service MeService {
  rpc Get(MeGetRequest) returns (MeGetResponse);

  // SignOutEverywhere voids everything issued to the caller before now.
  //
  // The self-service half of D26. `HolderService.Invalidate` takes a subject
  // and is therefore an operator's; this takes nothing and is the person's own,
  // which is the same split `Get` makes and for the same reason.
  //
  // What it does **not** do is end the session the caller is holding. That
  // session belongs to whatever app they are talking to, and roster does not
  // know it exists -- so the app that draws this button ends its own cookie
  // beside it. roster answers *invalid since when*; an app answers *what is
  // still alive*.
  rpc SignOutEverywhere(MeSignOutEverywhereRequest) returns (MeSignOutEverywhereResponse);

  // Leave deletes the caller's own account: their holder erased, exactly as
  // `HolderService.Erase` erases one, after everything issued to them is void.
  //
  // # Why it is here and not on HolderService
  //
  // `SignOutEverywhere`'s reason. `HolderService.Erase` takes a subject and is
  // therefore an operator's: a role naming it lets its holder erase anybody
  // they can see, and there is no permission smaller than that to give a
  // person who should be able to erase themselves and nobody else. This takes
  // nothing that names anybody, so it cannot be pointed elsewhere, and
  // `cmd.Policy` waives a binding for it on that ground.
  //
  // # What it asks before it does it
  //
  // A tenant that is closed reaches nobody, this included: its people are
  // refused where every call is resolved, before any of the below. A tenant
  // under a hold still lets somebody leave -- an erase destroys nothing -- and
  // forgets them once the hold is lifted.
  //
  // Four things, in this order, and each refusal says which:
  //
  //   - that the caller's tenant offers it (`TenantConfig.leave`), which is
  //     **off** unless a tenant said otherwise -- `PermissionDenied`;
  //   - that the caller is not somebody their tenant's directory provisions:
  //     whoever signs in through the connection it provisions through
  //     (`Connection.provisions`) is the directory's to remove, and one who
  //     erased themselves would be a person it can neither find nor make again
  //     until they are forgotten, and then makes again -- `PermissionDenied`;
  //   - that they proved who they are in the last [server/me.LeaveWithin], by
  //     the sign-in the credential the call came with carries
  //     (`Delegation.date_authenticated`): a delegation a front door minted
  //     when somebody signed in there, or a key of their own a terminal was
  //     handed in the browser (`roster sign-in`), which carries the browser's
  //     sign-in. **Not** when the credential was minted: a key issued from
  //     another, however new, carries the first one's; a key somebody else
  //     minted for them carries none; and a sign-in through a directory
  //     counts from when the directory says it last authenticated them
  //     (`auth_time`), which the account page asks to be now. A session that
  //     has been open all afternoon is a session somebody may have walked
  //     away from -- `FailedPrecondition`, *sign in again*;
  //   - that `confirm` is the caller's own alias, as it is, so that nothing
  //     calls this by accident -- `InvalidArgument`.
  //
  // Somebody whose way in can never be that sign-in -- GitHub's never is -- is
  // mailed a link that stands for it instead (`VouchService.LeaveLink`), and
  // leaves by `VouchService.Leave`: every rule here but the third, and the
  // same erase, from `server/me` for both.
  //
  // # What happens, and what can still be undone
  //
  // An erase and nothing more: the person cannot sign in anywhere and every
  // app holding a session for them hears it on `SyncService.Watch`; nothing is
  // destroyed yet. An operator can still `roster restore` them while
  // `holder.forget_after` lasts, and they are forgotten from when it ends: by
  // the first pass after it, and a restore works until that pass.
  //
  // Their sessions and delegations are void first -- `SignOutEverywhere`, as
  // its own act -- so a restore brings the account back and none of its old
  // sign-ins. Their keys come back with it: an erase leaves a key where it is,
  // and `date_invalidated` says why it never voids one.
  //
  // A holder roster declares (a front door's own) is refused before anything is
  // written, by the rule `HolderService.Erase` refuses it with.
  rpc Leave(MeLeaveRequest) returns (MeLeaveResponse);

}

message MeGetRequest {}

message MeSignOutEverywhereRequest {}

message MeSignOutEverywhereResponse {
  // The moment everything before it became void, which is what an app compares
  // a session against.
  google.protobuf.Timestamp date_invalidated = 11;
}

message MeLeaveRequest {
  // The caller's own alias, typed: a guard against a call made by accident,
  // and never a *whose* -- one that is not the caller's is refused rather than
  // looked up.
  string confirm = 1;
}

message MeLeaveResponse {
  // When the account was erased.
  google.protobuf.Timestamp date_erased = 14;

  // From when it is forgotten -- the erase plus `holder.forget_after`, which
  // is when its grace runs out, and not the moment of the forget: that is the
  // first pass after it, up to `holder.every` later. Unset where the
  // deployment forgets nobody on a clock, which is a deployment where an
  // operator's `roster forget` is the only way, or while a hold on the tenant
  // stops that clock (`roster hold`). A hold placed after this was answered
  // stops it too, and nobody is told.
  //
  // What a page says of it is *from* this date, and what is kept past it:
  // what they consented to, for `consent.keep`, and the trail and the access
  // record, by identifier (`account.leftSaying`).
  google.protobuf.Timestamp date_forgotten = 15;
}

message MeGetResponse {
  // The caller, by the identifier every product knows them by -- `sub`.
  bytes id = 1;
  bytes tenant = 2;

  string alias = 4;
  string name = 5;

  // The addresses roster holds, and whether anybody checked each one.
  //
  // Unverified ones are here rather than filtered out, because "we have this
  // address and nobody has confirmed it" is a different fact from not having
  // it, and a page that wants to prompt somebody needs the difference.
  repeated MeEmail emails = 8;

  // The teams they are in, with the site each is in.
  repeated MeTeam teams = 9;

  // Every RPC they may call, which is the union `gate.Policy` enforces --
  // through bindings, through groups, and through a role held in a team.
  //
  // Written out rather than named, for the reason a `Role` holds methods
  // rather than a name: a name is a lookup somewhere else, and the somewhere
  // else is what an app would have to reimplement.
  //
  // A page uses it to decide what to **show**. It is not what decides what is
  // allowed -- that is the server, on every call, and a client that treated
  // this as the decision would be one an altered client could talk out of.
  //
  // Narrowed to what the **credential** may do and not only to what the person
  // may. A caller reached through a delegation or an api key can call less than
  // its holder, since the row's `methods` are an attenuation the gate applies
  // on every call -- so the person's whole union would draw buttons that are
  // refused when pressed. That is the same drift, in the direction nobody had
  // looked.
  repeated string methods = 10;

  // The sites what they hold reaches, each said once, in the order of their
  // identifiers, which is the order they were made in. It is `frame.Sets` as
  // an answer; see `cmd.Sets`.
  repeated bytes sites = 11;

  // Whether something they hold reaches the whole tenant: a binding with no
  // site. Empty `sites` is not every site; it is every site only beside this,
  // and somebody who holds nothing is answered no sites and not this.
  bool every_site = 12;

  // The apps a binding of a role of roster's that reaches them is for
  // (`Binding.app`), as the holders those apps are answered as: what of
  // `methods` is held for one app is held over that app's rows alone. Each is
  // said once, in the order of their identifiers, as `sites` is; what
  // `HolderService.Reaches` answers at roster as `apps`.
  repeated bytes apps = 19;

  // What they may call about **their own account**, and nobody else's: the
  // methods of their tenant's `self-service` role, which everybody of the
  // tenant holds over what is theirs and nobody is bound (`server/core`,
  // `own.go`). Their address, their numbers, their keys, how they sign in.
  //
  // Apart from `methods` on purpose. That list is what they hold, and reaches
  // whoever it reaches; this one reaches them. A page of somebody's own
  // account draws by this; a page about other people draws by `methods`, and
  // a method that is only here is refused there -- `NotFound`, since somebody
  // else's row is not one they see.
  //
  // Narrowed to the credential, as `methods` is.
  repeated string own = 18;

  // How they sign in elsewhere, and how they sign in here.
  //
  // # Why they are here and not read from their own services
  //
  // Because neither can be. `IdentityService` is held to the **tenant**: the
  // grant that lists a person's own identities lists their whole tenant's,
  // and `IdentityFilter.holder` narrows what a list answers, not what its
  // caller may read -- which is the leak D17 named and D23 exists to remove,
  // and it is exactly the shape a self-service screen would reach for.
  // `CredentialService`'s generated reads are shut a method at a time, because
  // its `Get` answers with the verifier (D13) -- so there is no read there to
  // narrow either.
  //
  // This message is the one shape narrowed to the person **by construction**:
  // it takes no subject, so there is nothing to point at somebody else. That is
  // also why `cmd.Policy` can waive a binding for it and for nothing else.
  //
  // Each of these, and `keys` below, is every one they have, in the order
  // they were made in: what `HolderService.SignsIn` answers an administrator
  // about them, in the same order.
  repeated SignInIdentity identities = 13;
  repeated SignInCredential credentials = 14;

  // And the keys that act as them, which is the third way in and the one that
  // is hardest to see: an `rt_` is a string in somebody's script, and the
  // question a person asks about it is *is this still being used* rather than
  // *what is it*.
  //
  // `ApiKeyService/List` answers the same rows, behind a role, and they are
  // here as well for two reasons. `MeService.Get` needs no role, so somebody
  // whose tenant took `ApiKeyService/List` out of `self-service` still sees
  // what acts as them; and this answers every key with no cursor, as
  // `HolderService.SignsIn` answers an administrator about them.
  //
  // The secret is not here and there is nowhere it could come from: what is
  // stored is a hash. A key is readable exactly once, at
  // `ApiKey.Issue` with your own reference.
  repeated SignInKey keys = 15;

  // The connection their tenant's directory provisions them through, and empty
  // when it provisions nobody or not them (`Connection.provisions`). Whoever
  // signs in through it is the directory's: it says when they leave, so `Leave`
  // refuses them, and a page offers it to nobody this names.
  string provisioned_through = 16;

  // The groups they are in, each with the clients it is shown to
  // (`GroupExposure`) and the role they hold in it -- which makes them its
  // manager.
  //
  // What a front door puts in a token for a client registered for the
  // `groups` scope is read from here: the groups that name that client, and no
  // other (`login/claims.go`).
  repeated MeGroup groups = 17;
}

// SignInKey is one API key that acts as somebody.
//
// A key is a way in like the other two, and a screen of somebody's ways in
// draws it beside them, from one answer. `ApiKeyService/List` answers the row
// too, behind a role and a page at a time; this is answered by `MeService.Get`,
// which needs no role, so a tenant that takes `ApiKeyService/List` out of
// `self-service` still lets its people see what acts as them, and by
// `HolderService.SignsIn`, every key with no cursor.
//
// What is **not** here is the secret, and there is nowhere it could come from:
// what is stored is a hash. A key is readable exactly once, at the moment
// `ApiKey.Issue` mints it.
message SignInKey {
  // The row, so that a screen with a revoke button has something to name.
  bytes id = 1;

  // What somebody called it when deciding whether to revoke it.
  string alias = 4;

  // What it may be used for, which is the whole of what a key **is** beyond
  // the person it hangs off: an `rt_` is never wider than them, and this is
  // how much narrower it was made.
  repeated string methods = 8;

  // When it stops working, unset for one that does not.
  google.protobuf.Timestamp date_expired = 9;

  // When it was last used, unset for never -- which is the field that answers
  // *is anything still calling with this* before somebody revokes it.
  google.protobuf.Timestamp date_used = 10;

  // The app it is spent at, as the holder that app is answered as, and empty
  // for one of roster's own (`ApiKey.app`): which `methods` are of, and
  // where the key is a credential at all. Said here because this is every key
  // somebody has, of every app, in one list.
  bytes app = 16;

  // The app's alias in the tenant, beside `app` as `MeTeam` says `site_alias`
  // beside `site`: what a screen draws, `@loft`. Empty for a key of roster's.
  string app_alias = 17;
}

// SignInIdentity is one way somebody arrives from outside.
//
// Named for what it describes rather than for the RPC that first answered with
// it, because there are two now: this one about the caller, and
// `HolderService.SignsIn` about somebody else. Two shapes saying one thing is
// two that drift, and the drift would be between what a person sees about
// themselves and what an operator sees about them.
message SignInIdentity {
  // The row, so that a screen with a remove button has something to name.
  bytes id = 1;

  // Which provider, and what that provider calls them.
  //
  // The subject is here rather than hidden. It is not a secret -- it is a
  // numeric account id or a directory GUID, and the person can read it at the
  // provider -- and a screen that lists two GitHub accounts with nothing
  // telling them apart is a screen somebody removes the wrong one from.
  string provider = 8;
  string subject = 9;

  // When it was linked, which is what a page shows beside it.
  google.protobuf.Timestamp date_created = 15;
}

// SignInCredential is one secret roster holds for somebody, and never the secret.
//
// The kind and its dates. `Credential.secret` is not here and there is nowhere
// to ask for it: this is a message with the fields written out, so the column
// is absent rather than deselected. That is the same statement D13 makes by not
// registering the service, said again where a page can hear it.
message SignInCredential {
  // "password", "totp".
  string kind = 8;

  // What they call this one, when there is more than one of a kind. Empty is
  // the only one, which is what a password and a first authenticator are.
  string name = 5;

  // When it was last changed, for a policy that expires them and for showing
  // somebody why they are being asked.
  google.protobuf.Timestamp date_rotated = 12;

  // Until when they may not try again, and null for an account that is open.
  // Shown because somebody locked out being told nothing is somebody who tries
  // forever -- the trade `VouchVerifyResponse` already took.
  google.protobuf.Timestamp date_unlocked = 11;
}

message MeEmail {
  string address = 8;
  google.protobuf.Timestamp date_verified = 9;
}

message MeGroup {
  bytes id = 1;
  string alias = 4;
  string name = 5;

  // The clients whose tokens may carry it, by the id their issuer gave them.
  repeated string clients = 8;

  // What they may do in it -- a manager's role -- and empty is a plain member.
  string role = 9;
}

message MeTeam {
  bytes id = 1;
  string alias = 4;
  string name = 5;

  bytes site = 8;
  string site_alias = 9;

  // What they may do in it, and empty is a plain member.
  string role = 10;
}
