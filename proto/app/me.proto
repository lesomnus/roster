edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// MeService answers what a caller is, in one round trip.
//
// # Why it is not four reads
//
// Everything here is already readable: a `Holder`, their `Email` rows, the
// teams they are in, the roles they hold. A page that drew them would make four
// calls and then do the join itself -- in TypeScript, differently in every app
// that tried.
//
// What makes it one RPC rather than a convenience is that the **join is
// roster's**. Which roles somebody effectively holds is a union over bindings,
// group memberships and team memberships, and an app that computed it from the
// parts would be a second implementation of `gate.Policy` that drifts from the
// one enforcing it. So this answers with what roster itself would decide.
//
// # It takes nothing
//
// There is no subject field, and that is the point: it answers about **the
// caller**, read from the frame. A version that took an identifier would be
// `Holder.Get` with extra steps, and would need its own rule about who may ask
// about whom -- which `Holder.Get` already has, in the wall.
//
// # Only what no role can be asked for
//
// Three methods, and each is one somebody **must** be able to do with no role
// at all: read their own record, take back a way in, sign out of every session
// they no longer trust. `cmd.Policy` waives a binding for exactly these, and a
// method can be waived only if it takes no subject -- `cmd/asself_test.go`
// refuses one that carries a field that could name somebody -- so these are
// subject-less by necessity, not by preference.
//
// Everything else a person does to their own account is the entity's own verb
// with their own reference: `Identity.Add` to attach a provider account,
// `ApiKey.Issue` to mint a key that acts as them, `Holder.RevokeKey` to end
// one, `Credential.Set`/`Enrol` for a password and a factor. Those were once
// `Link`, `IssueKey` and `RevokeKey` here -- a self-only twin of each verb, for
// the grant it let a role name -- and were folded back by the rule in CLAUDE.md,
// *no self-only twin of a verb*: RBAC grants the method, *whose row* is the
// layer's (`mayReach`), and the app that serves a person is what passes only
// their reference.
//
// # What it is not
//
// Not a token, not a session, and not something to cache. It is a read, and the
// answer is true when it was made.
service MeService {
  rpc Get(MeGetRequest) returns (MeGetResponse);

  // Unlink removes one of the caller's own ways in.
  //
  // # Why it is here and not on IdentityService
  //
  // The same reason `MeGetResponse` carries identities at all: `Identity` is
  // narrowed by the **tenant**, so a person removing their own through that
  // service would be doing it with a permission that reaches everybody else's
  // -- which is the leak D17 named and D23 exists to remove, arriving on the
  // one screen it is most tempting on.
  //
  // This takes an identifier and refuses one that is not the caller's, so the
  // argument is a *which*, never a *whose*. That is what keeps it in the same
  // category as `Get`: it cannot be pointed at anybody else.
  //
  // # What it does not let go of
  //
  // The last one. `server/core` refuses the removal of somebody's only way in,
  // and this goes through it -- so a person cannot lock themselves out with a
  // button, which is a rule no deployment would want configured differently.
  rpc Unlink(MeUnlinkRequest) returns (MeUnlinkResponse);

  // SignOutEverywhere voids everything issued to the caller before now.
  //
  // The self-service half of D26. `HolderService.Invalidate` takes a subject
  // and is therefore an operator's; this takes nothing and is the person's own,
  // which is the same split `Get` makes and for the same reason.
  //
  // What it does **not** do is end the session the caller is holding. That
  // session belongs to whatever app they are talking to, and roster does not
  // know it exists -- so the app that draws this button ends its own cookie
  // beside it. roster answers *invalid since when*; an app answers *what is
  // still alive*.
  rpc SignOutEverywhere(MeSignOutEverywhereRequest) returns (MeSignOutEverywhereResponse);

}

message MeGetRequest {}

message MeUnlinkRequest {
  // Which one, by the identifier `MeGetResponse` answers with.
  //
  // A *which* and never a *whose*: one that is not the caller's is `NotFound`,
  // told apart from nothing, so this cannot be used to ask whether somebody
  // else's identity exists.
  bytes id = 1;
}

message MeUnlinkResponse {}

message MeSignOutEverywhereRequest {}

message MeSignOutEverywhereResponse {
  // The moment everything before it became void, which is what an app compares
  // a session against.
  google.protobuf.Timestamp date_invalidated = 11;
}

message MeGetResponse {
  // The caller, by the identifier every product knows them by -- `sub`.
  bytes id = 1;
  bytes tenant = 2;

  string alias = 4;
  string name = 5;

  // The addresses roster holds, and whether anybody checked each one.
  //
  // Unverified ones are here rather than filtered out, because "we have this
  // address and nobody has confirmed it" is a different fact from not having
  // it, and a page that wants to prompt somebody needs the difference.
  repeated MeEmail emails = 8;

  // The teams they are in, with the site each is in.
  repeated MeTeam teams = 9;

  // Every RPC they may call, which is the union `gate.Policy` enforces --
  // through bindings, through groups, and through a role held in a team.
  //
  // Written out rather than named, for the reason a `Role` holds methods
  // rather than a name: a name is a lookup somewhere else, and the somewhere
  // else is what an app would have to reimplement.
  //
  // A page uses it to decide what to **show**. It is not what decides what is
  // allowed -- that is the server, on every call, and a client that treated
  // this as the decision would be one an altered client could talk out of.
  //
  // Narrowed to what the **credential** may do and not only to what the person
  // may. A caller reached through a delegation or an api key can call less than
  // its holder, since the row's `methods` are an attenuation the gate applies
  // on every call -- so the person's whole union would draw buttons that are
  // refused when pressed. That is the same drift, in the direction nobody had
  // looked.
  repeated string methods = 10;

  // The sites they are narrowed to, and empty means every site of their
  // tenant. It is `frame.Sets` as an answer; see `cmd.Sets`.
  repeated bytes sites = 11;
  bool every_site = 12;

  // How they sign in elsewhere, and how they sign in here.
  //
  // # Why they are here and not read from their own services
  //
  // Because neither can be. `IdentityService` narrows by the **tenant**, so a
  // person asking for their own identities through it is asking for their whole
  // tenant's and filtering -- which is the leak D17 named and D23 exists to
  // remove, and it is exactly the shape a self-service screen would reach for.
  // `CredentialService` is not registered at all, because its generated `Get`
  // answers with the verifier (D13).
  //
  // This message is the one shape narrowed to the person **by construction**:
  // it takes no subject, so there is nothing to point at somebody else. That is
  // also why `cmd.Policy` can waive a binding for it and for nothing else.
  repeated SignInIdentity identities = 13;
  repeated SignInCredential credentials = 14;

  // And the keys that act as them, which is the third way in and the one that
  // is hardest to see: an `rt_` is a string in somebody's script, and the
  // question a person asks about it is *is this still being used* rather than
  // *what is it*.
  //
  // Here for the same reason as the two above and one more. `ApiKeyService` is
  // unregistered everywhere -- its generated `Get` answers with the verifier --
  // so there is no read to narrow, and the read an operator uses,
  // `HolderService.SignsIn`, takes a subject and reaches their whole tenant.
  //
  // The secret is not here and there is nowhere it could come from: what is
  // stored is a hash. A key is readable exactly once, at
  // `ApiKey.Issue` with your own reference.
  repeated SignInKey keys = 15;
}

// SignInKey is one API key that acts as somebody.
//
// A key is a way in like the other two, and it is the one a screen most needs
// help to show: `ApiKeyService` is unregistered everywhere -- its generated
// `Get` answers with the verifier -- so a page listing one person's keys by
// reading and sifting would be reading every customer's to draw one. The same
// sentence `HolderService.SignsIn` already carries about identities.
//
// What is **not** here is the secret, and there is nowhere it could come from:
// what is stored is a hash. A key is readable exactly once, at the moment
// `IssueService` mints it.
message SignInKey {
  // The row, so that a screen with a revoke button has something to name.
  bytes id = 1;

  // What somebody called it when deciding whether to revoke it.
  string alias = 4;

  // What it may be used for, which is the whole of what a key **is** beyond
  // the person it hangs off: an `rt_` is never wider than them, and this is
  // how much narrower it was made.
  repeated string methods = 8;

  // When it stops working, unset for one that does not.
  google.protobuf.Timestamp date_expires = 9;

  // When it was last used, unset for never -- which is the field that answers
  // *is anything still calling with this* before somebody revokes it.
  google.protobuf.Timestamp date_used = 10;
}

// SignInIdentity is one way somebody arrives from outside.
//
// Named for what it describes rather than for the RPC that first answered with
// it, because there are two now: this one about the caller, and
// `HolderService.SignsIn` about somebody else. Two shapes saying one thing is
// two that drift, and the drift would be between what a person sees about
// themselves and what an operator sees about them.
message SignInIdentity {
  // The row, so that a screen with a remove button has something to name.
  bytes id = 1;

  // Which provider, and what that provider calls them.
  //
  // The subject is here rather than hidden. It is not a secret -- it is a
  // numeric account id or a directory GUID, and the person can read it at the
  // provider -- and a screen that lists two GitHub accounts with nothing
  // telling them apart is a screen somebody removes the wrong one from.
  string provider = 8;
  string subject = 9;

  // When it was linked, which is what a page shows beside it.
  google.protobuf.Timestamp date_created = 15;
}

// SignInCredential is one secret roster holds for somebody, and never the secret.
//
// The kind and its dates. `Credential.secret` is not here and there is nowhere
// to ask for it: this is a message with the fields written out, so the column
// is absent rather than deselected. That is the same statement D13 makes by not
// registering the service, said again where a page can hear it.
message SignInCredential {
  // "password", "totp".
  string kind = 8;

  // What they call this one, when there is more than one of a kind. Empty is
  // the only one, which is what a password and a first authenticator are.
  string name = 5;

  // When it was last changed, for a policy that expires them and for showing
  // somebody why they are being asked.
  google.protobuf.Timestamp date_rotated = 12;

  // Until when they may not try again, and null for an account that is open.
  // Shown because somebody locked out being told nothing is somebody who tries
  // forever -- the trade `VouchVerifyResponse` already took.
  google.protobuf.Timestamp date_locked = 11;
}

message MeEmail {
  string address = 8;
  google.protobuf.Timestamp date_verified = 9;
}

message MeTeam {
  bytes id = 1;
  string alias = 4;
  string name = 5;

  bytes site = 8;
  string site_alias = 9;

  // What they may do in it, and empty is a plain member.
  string role = 10;
}
