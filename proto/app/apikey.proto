edition = "2023";

package roster;

import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// ApiKey is what one service may call this deployment for.
//
// # Where these live
//
// In the **control plane**: a second roster, in the same process, on its own
// database. Its one tenant is the deployment's owner, its holders are that
// owner's services -- custody, and whatever else they run -- and these hang off
// them. See PLAN.md, D15.
//
// Two databases because a key must not live in the same tables as the data it
// protects: separate, a fault in the wall cannot reach one, since there is no
// query from the one instance to the other.
//
// # Why it is not a Credential
//
// A `Credential` is unique per `(holder, kind)`, which is right for a password
// and fatal for a key -- rotating without downtime needs two live at once, and
// this is 1:N.
//
// A credential proves **who**; a key grants **what**. There is nowhere on a
// credential to write the second.
//
// And the cost differs. argon2id at 19 MiB is right where the attack is a
// dictionary. There is no dictionary for 256 random bits, and every call from
// every service would pay it.
//
// # The actor is the key
//
// A request carrying one is served as **this row** and not as the holder it
// hangs off. So the trail names which key asked, revoking is a delete, and no
// person-row grants anything -- which is the case `frame.Everything` warns
// about: a privilege held by being a particular row cannot be revoked and
// cannot be narrowed. A key row exists to be revoked.
message ApiKey {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // Whose it is: the service, as a Holder of the control plane's one tenant.
  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // What somebody calls this key when deciding whether to revoke it --
  // "custody, production". Unique per holder so that a list of them reads.
  string alias = 4;

  string desc = 6;

  // What this key may be used for: the gRPC methods, in full, as
  // `frame.Grant.To` takes them.
  //
  // A list and not a role. A role is a name for a list that has to be looked up
  // somewhere, and the somewhere is the thing this deployment does not have
  // yet. Written out, a key says what it does to anybody reading the row.
  //
  // Empty allows **nothing**, which is `frame.Grant`'s zero value and the right
  // way round: a key somebody forgot to fill in opens no door.
  repeated string methods = 8;

  // The verifier, never the key: a hash of it, and the key itself is shown once
  // when it is made and never again. The same rule `Credential` states, and the
  // reason `ApiKeyService` is not registered either.
  //
  // # Why it is unsalted, and indexed
  //
  // It is also how the row is **found**. A salted hash cannot be: with a
  // different salt per row, matching a presented key means hashing it against
  // every row there is, which is a table scan on the busiest path this
  // deployment has.
  //
  // So the hash is deterministic and unique, and lookup is one indexed read.
  // What makes that safe is what makes the fast hash safe: the input is 256
  // bits from `crypto/rand`. A salt defends against a dictionary and against
  // one table answering for many rows, and neither exists here -- there is
  // nothing to look up a random 256-bit value in.
  //
  // A password is the opposite case in every one of those respects, which is
  // why `Credential.secret` is salted, slow, and found by who it belongs to
  // rather than by itself.
  //
  // Declared `secret` for the same reason `Credential.secret` is: `keys.Store`
  // finds a key **by** this value through an unwalled server, and the trail
  // must not end up holding a second copy of it.
  bytes secret = 9 [
    (orm.field) = {unique: true},
    (payday.field) = {secret: true}
  ];

  // When it was last used, for finding the key nobody needs any more. Written
  // on a verify, so it is the one field a read path writes.
  google.protobuf.Timestamp date_used = 10 [(orm.field) = {nullable: true}];

  // When it stops working. Null is a key that does not expire, which is what a
  // service running unattended needs and what makes rotation somebody's job
  // rather than an outage.
  google.protobuf.Timestamp date_expires = 11 [(orm.field) = {nullable: true}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "alias"
        refs: [
          {name: "holder", number: 2},
          {name: "alias", number: 4}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 14
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}]
      size: 20
      max: 100
    }
  };
}
