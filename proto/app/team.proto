edition = "2023";

package roster;

import "roster/payday/tenant.proto";
import "app/site.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Team is a group of people within one site, and what a role is derived from.
//
// The design says roles come from team membership **within a site**: the same
// person can be an operator in Seoul and a reader in Frankfurt, and a role that
// meant the same thing everywhere could not say that.
//
// # This is what field 3 is for
//
// The site is at 3, which payday reserves for a set smaller than a tenant.
// Everything that follows -- a read narrowed to the sites a caller may see, on
// top of the tenants they may see -- is generated from that one number.
//
// A team belongs to exactly **one** site, which is the condition. A Holder does
// not, so a Holder has no site edge.
//
// # What is said of one is said when it is made
//
// Its site is immutable, and over the wire so is the rest. A team has `Add`
// and `Erase` and no write between them, and no port serves a general one
// (`cmd/serve.go`): its alias, its name and its description are what `Add`
// was told. Changing one is the deployment's, at the box (`roster team
// patch`); or the team is erased and another made, whose places are added
// again, since a place is on one team.
message Team {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // Nullable, and not because a team without a site is meaningful. It is the
  // shape payday asks for: a required field-3 edge cannot be added to a schema
  // that already has rows, and this one will. A team in no site is then
  // invisible to a read narrowed to one, which is fail-closed and is the right
  // way round.
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // Which site, and **empty is none**, which is what an optional namespace
  // means.
  //
  // It is field 3 and therefore what a narrowed read is narrowed by -- so a
  // team with no site is seen by a read of the whole tenant and not by one
  // scoped to a site. That is the right way round: the alternative is a row
  // that turns up in every scoped read because it belongs to none of them.
  //
  // What it is **not** any more is how this row reaches a tenant. It was, and
  // then a team with no site reached none -- written, invisible to everybody,
  // with nothing saying so. The wall goes through field 2 and field 3 only ever
  // narrows; `server/core/tenant.go` says why nothing else can state it.
  Site site = 3 [(orm.edge) = {immutable: true, nullable: true}];

  // Unique within the site, so `operators` may exist in every one of them.
  // A team of no site is the tenant's, and its name is unique among the
  // tenant's teams of none: the index below binds nothing where the site is
  // null, so `server/core` holds it.
  //
  // Not personal, this, the name and the description: a team is the
  // tenant's own. Nobody is written into them, as into a tenant's
  // (`tenant.proto`): a team named after a person keeps that name on the
  // trail, where no forget reaches.
  string alias = 4 [(payday.field) = {personal: false}];

  string name = 5 [(payday.field) = {personal: false}];
  string desc = 6 [(payday.field) = {personal: false}];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {
      add: {}
      get: {}
      patch: {}
      apply: {}
      erase: {}
    }
    indexes: [
      {
        name: "page"
        refs: [
          {name: "tenant", number: 2},
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "slug"
        refs: [
          {name: "alias", number: 4},
          {name: "site", number: 3}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 10
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "tenant"}, {name: "site"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}
