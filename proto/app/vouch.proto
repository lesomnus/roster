edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// VouchService is how a secret is used without ever leaving the store.
//
// # Why it is not `CredentialService`
//
// The generated CRUD for `Credential` has a `Get` that returns every field it
// was asked for, and one of those fields is the hash. That is the right shape
// for a row this app reads itself and the wrong shape for anything on a wire,
// so `CredentialService` is **not registered** -- see `cmd/serve.go`. What is
// registered is this: RPCs that take a secret in and never hand back one this
// store was already holding.
//
// [VouchService.Delegate] answers with a string and is not an exception to
// that. What it hands back is a secret roster **made**, whose verifier goes
// into a row before the answer leaves -- which is `IssueService`'s established
// shape, and the opposite of answering with a verifier somebody else's password
// is checked against.
//
// The distinction is the same one `Credential` states about comparison. A hash
// that has left the store puts timing-safe comparison, attempt counting and
// lockout in two places that will disagree; and a hash *computed* somewhere
// else puts the argon2 parameters in two places, where the weaker of them is
// the one that matters. So both happen here.
//
// # Neither half is public, and the difference between them is the wall
//
// The person signing in has no credential -- that is what they are asking for
// -- but they are not who is calling. The caller is custody, or a Login App, or
// an admin console, and roster is reached only by those. So both RPCs need the
// caller's certificate like everything else here.
//
// What they differ in is the **frame**. `Verify` is asked before anybody has
// been resolved to a person, so it reads the server the wall was never
// installed on -- exactly as `cmd.Resolver` does and for the same reason:
// working out who somebody is cannot require knowing who they are.
//
// `Set` is a caller changing somebody's password, which is an ordinary
// authorised write. It goes behind the wall, so an administrator of one tenant
// cannot reach into another, and that narrowing costs this service nothing.
service VouchService {
  // Verify answers whether a secret is the one held for somebody.
  rpc Verify(VouchVerifyRequest) returns (VouchVerifyResponse);

  // Delegate is Verify, and on a yes it also mints a credential for the person
  // it just proved. See `delegation.proto`.
  //
  // # Why it is not a field on Verify
  //
  // A role here is a list of methods, so what a deployment can grant is
  // exactly what it can name -- the argument D26 made one entry earlier. As a
  // field, granting `Verify` would grant the power to mint a person-scoped
  // credential, and there would be no way to tell a Login App, which needs to
  // check a password and must never mint, from a product app, which needs the
  // token. It would also be invisible in a role, in an `Audit` row, and in
  // `roster key add --allow`.
  //
  // # And why it is not Verify-then-something
  //
  // That is the alternative this is measured against, and it is worse two ways:
  // two round trips, two argon2 comparisons and two entries in one lockout
  // count -- or, if the second call takes no secret, a credential minted for
  // somebody nobody just proved, which is the thing `keys.Delegate` refuses in
  // as many words. This is one call, one hash, one count, sharing Verify's path
  // verbatim.
  rpc Delegate(VouchDelegateRequest) returns (VouchDelegateResponse);

  // Reset gives somebody a new password and answers with it **once**.
  //
  // For a local operator in a deployment with no mail. Roadmap.md's item 10:
  // D13 closed `CredentialService` entirely, so nothing on the wire could set
  // a password and `init` plus a shell was the only way -- which is right for
  // the read and wrong for the write.
  //
  // # Why the operator does not choose it
  //
  // The same argument `IssueService` already makes about a key: a secret the
  // caller chose is a secret the caller knows, and one generated in a console
  // is only as good as that page's `crypto`. Here it is `crypto/rand` on the
  // server, and what the operator does is read it out.
  //
  // # Who may
  //
  // Somebody whose permissions cover the permissions of the person they are
  // resetting. Resetting a password is a way to **become** somebody, so an
  // operator who could reset anybody in their tenant would hold every
  // permission in it -- `server/core/escalate.go` is the rule and it went in
  // before this did.
  rpc Reset(VouchResetRequest) returns (VouchResetResponse);

  // Link mints a way in for somebody and answers with it **once**.
  //
  // What roster does not do is send it. D19 puts the delivery outside, and
  // separating the two is what makes the air-gapped case work at all: with no
  // mail the somebody else is a person, and what they hand over is a password
  // from [VouchService.Reset] rather than a link.
  //
  // # It says nothing about whether they are here
  //
  // A request for somebody who does not exist answers the same as one for
  // somebody who does: a token, and an expiry. So does one for somebody in
  // **another tenant**, which is the same sentence with the wall in it: the
  // person is read through the walled server, so who is elsewhere is no more
  // this caller's to learn than who is here at all. Otherwise the *sending* of
  // a link answers *is this address here*, which is the question the whole
  // careful set of equal-cost refusals exists to refuse -- asked through a form
  // that is meant to be filled in by strangers.
  //
  // The token it answers with in that case resolves to nobody, so redeeming it
  // fails the way every other bad token does.
  rpc Link(VouchLinkRequest) returns (VouchLinkResponse);

  // Redeem spends a link, which proves the person and nothing more.
  //
  // It answers in [VouchService.Delegate]'s shape, deliberately: if they have a
  // second factor it is asked for exactly as it would have been after a
  // password, because a link that skipped one would be a way to turn a mailbox
  // into an account.
  rpc Redeem(VouchRedeemRequest) returns (VouchDelegateResponse);

  // Continue proves the next factor, from where the last one left off.
  //
  // # Why it is a method and Begin is not
  //
  // D26's argument -- a role is a list of methods, so what a deployment can
  // grant is exactly what it can name -- lands on **proving a second factor**,
  // which is a distinct thing to hand out and takes a continuation rather than
  // a `who`. It does not land on starting: making `Verify` and `Delegate` grow
  // instead means a deployment with one factor pays exactly what it pays today,
  // and the single-factor path stays one round trip. A `Begin` would move every
  // sign-in in every deployment onto a new method for a feature most of them do
  // not use.
  //
  // # What it does not mint
  //
  // A token. Proving is one thing and minting is another, and there is exactly
  // one method in this service that mints: `Delegate`, which takes a
  // continuation in place of a `who` and a secret. So a two-step sign-in is
  // `Delegate` -> `Continue` -> `Delegate`, and the last call spends what the
  // first two proved.
  rpc Continue(VouchContinueRequest) returns (VouchContinueResponse);

  // Enrol makes a second factor and answers with it **once**.
  //
  // # Why Set cannot do it
  //
  // `Set` argon2-hashes whatever it is handed, which is the one thing a TOTP
  // seed must not be: computing the code somebody is about to type means
  // holding the seed, so the row **is** the secret rather than a verifier of
  // one. A seed put through `Set` is a seed nobody can ever read back.
  //
  // # Why the caller does not choose it
  //
  // `IssueService`'s argument about a key, unchanged: a secret the caller chose
  // is a secret the caller knows, and one generated in a browser is only as
  // good as that page's `crypto`. Here it is `crypto/rand` on the server, and
  // what leaves is a base32 seed and an `otpauth://` URI for a QR code.
  //
  // # It does not count until it is proved
  //
  // The row is written unconfirmed, and one code has to verify before it is a
  // factor anybody may be asked for. A seed that counted the moment it was
  // written would make a mis-scanned QR something somebody discovers when they
  // are already half signed in and cannot finish.
  rpc Enrol(VouchEnrolRequest) returns (VouchEnrolResponse);

  // Revoke ends a delegation before its expiry.
  //
  // D23 says *revoking it is a delete* and for a while nothing could:
  // `DelegationService` is unregistered and closed, so a person clicking sign
  // out left the app holding a credential that went on working. This is the
  // delete, and the caller who may make it is the one that can prove it holds
  // the token -- which is the same pair `roster-as` already carries.
  rpc Revoke(VouchRevokeRequest) returns (VouchRevokeResponse);

  // Accept mints for somebody a front door has **already** checked, and it is
  // the one method here that verifies nothing.
  //
  // # The gap it closes
  //
  // D23 left it open in as many words: *a deployment with Hydra in front does
  // not call `Vouch` at all, so there is nothing for the token to ride back on.
  // Exchanging an `id_token` for one is the obvious route and it is not
  // designed.* So an OIDC-fronted deployment could find out who somebody is and
  // could not get a credential to act **as** them -- which is the whole of what
  // `roster-as` is for.
  //
  // # Why roster does not check the token itself
  //
  // Because that is being the relying party, and `connection.proto` already
  // decided roster is not: *the secret has to reach the front door -- roster
  // cannot use it, because using it means doing the OIDC exchange, which is
  // being the relying party and is what D19 says roster is not.* The front door
  // holds the client secret, does the exchange, and verifies the signature
  // against an issuer it chose. roster holds none of that and would have to
  // acquire all of it.
  //
  // So this is not `Verify` with a token instead of a password. It is roster
  // **accepting** that somebody else did the checking, which is a different act
  // and is named like one.
  //
  // # What that costs, said plainly
  //
  // A caller allowed this mints a delegation for **anybody**. There is no
  // secret, no continuation and no proof -- the grant is the whole of the
  // control, which is why it is its own method rather than a field on
  // `Delegate`: a role names it, `roster key add` warns about it, and the trail
  // records which service asked.
  //
  // It is the same trust `keys.Acting` already places in a front door, made
  // explicit and made grantable separately. An app that checks passwords
  // through `Verify` and must never mint for somebody it did not check is a
  // different grant from one that runs an OIDC flow, and before this they were
  // the same key.
  //
  // What it is still not: **wider than the person**. `methods` is bounded by
  // what the caller may call, exactly as `Delegate`'s is, and the delegation is
  // bounded by what the holder may do. A front door that can mint for anybody
  // cannot mint anybody more permission than they have.
  rpc Accept(VouchAcceptRequest) returns (VouchDelegateResponse);
}

// VouchWho names somebody in the words a sign-in form collects.
//
// It is this file's own shape rather than the generated `HolderRef`, for the
// same reason custody's catalogue defines its own item: what a hand-written
// service takes is its own vocabulary, and `HolderRef` is roster's internal
// one. It is also the only thing that compiles -- the refs are generated from
// the entities in a later step than this file, so a service written by hand
// cannot name one.
//
// Exactly one of these ways is expected. More than one is a caller that has not
// decided, and it is refused rather than resolved in some order this comment
// would then have to define.
message VouchWho {
  // The identifier, when the caller already has it.
  bytes id = 1;

  // `@tenant/alias`, which is the pair a username field and a tenant selector
  // make -- or the tenant and an [VouchWho.address], which is what a form that
  // asks for an email collects.
  //
  // The tenant is required by either, and comes from the front door rather than
  // from the form: `FrontService.WhoseHost` turns the name a browser arrived at
  // into one.
  string tenant = 2;
  string alias = 3;

  // An address, within a tenant. What most sign-in forms actually collect.
  //
  // # This used to be empty, and F7 is why
  //
  // `Email` is unique **per holder**, deliberately, so that a consultant can be
  // one person in two tenants under one address -- which meant one address
  // could name two people and a sign-in resolving by it would pick one of them.
  // The comment here said so and left the field unspent.
  //
  // The way out was never a field. It was the second half of the same
  // sentence: *or a tenant that arrives from somewhere the form did not type.*
  // A front door has one now, from `FrontService.WhoseHost`, and `Email` has a
  // unique `(tenant, address)` to go with it -- so within the tenant somebody
  // arrived at, an address names one person again. D3's consultant is
  // untouched: that case is across tenants and this constrains within one.
  //
  // # It is the tenant **and** the address, always
  //
  // Named beside [VouchWho.tenant], which is the same pair an alias uses. There
  // is no form of this that takes an address alone, and that is the constraint
  // rather than an omission: a lookup that could be made without naming a
  // tenant is a lookup a front door that forgot to think about which one
  // compiles a wrong answer for.
  string address = 4;
}

// VouchClaim is what a front door read out of a token it verified.
//
// # Why it is not a `VouchWho`, and not a ref either
//
// `VouchWho` names a **person** -- an identifier, an alias, an address -- and
// this call is not about a person the caller looked up. It is about the
// assertion they were handed: *this issuer says this subject signed in*, which
// is what an `id_token` carries and what `Identity` was written to hold. Making
// it its own message is what keeps the two apart in a reader's head, and in a
// role: a caller that may present a claim is not thereby a caller that may name
// anybody.
//
// A generated `IdentityRef` would say the same thing and cannot be used here,
// for [VouchWho]'s reason one paragraph up: the refs are generated from the
// entities in a later step than this file.
//
// # And it names a tenant, always
//
// The same constraint [VouchWho.address] carries, and for the same reason: a
// subject is unique **within a provider within a tenant**, so a lookup made
// without naming one is a lookup a front door that forgot to think about which
// tenant compiles a wrong answer for. `FrontService.WhoseHost` is where the
// tenant comes from -- the name the browser arrived at -- and never from the
// token.
message VouchClaim {
  // Which tenant the front door is answering for.
  bytes tenant = 1;

  // The issuer, as this deployment named it when the identity was linked --
  // "google", "entra". Not the raw `iss` claim, deliberately: what roster holds
  // is the deployment's own word for a provider, and a front door translating
  // one to the other is the front door doing its own job.
  string provider = 2;

  // The `sub`, as the provider issued it and as `Identity` stored it.
  string subject = 3;
}

message VouchVerifyRequest {
  VouchWho who = 1;

  // Which secret -- "password", "totp". Empty means "password", since that is
  // the one every deployment has.
  string kind = 8;

  // The secret itself, as typed. Not a hash: hashing is this service's, because
  // parameters chosen by a caller are parameters this store cannot vouch for.
  bytes secret = 9;

  // Which one, when this person has two of a kind. Empty is the only one.
  //
  // # Why a first factor takes one at all
  //
  // The form beside this said a first factor is its kind's only one by
  // construction, and `Continue` was where a name was needed. That is true of
  // signing **in** -- a person is asked for a password, and there is one -- and
  // it is not true of confirming what they just enrolled.
  //
  // `Enrol` invites a name and writes the row unconfirmed, and an unconfirmed
  // factor is left out of `available` on purpose: it is a QR somebody may have
  // mis-scanned, so offering it is offering a form that cannot be filled. The
  // way it gets confirmed is verifying one code against it -- which is this
  // call, because a continuation is only minted when something is left to
  // prove, and what was just enrolled is not.
  //
  // So without this the first named factor a person adds is one no call can
  // reach, and the deployment that thinks it has a second factor has none.
  string name = 5;
}

// VouchFactor is one way somebody can prove themselves, and when.
//
// A message rather than a bare kind, for the reason `MeCredential` is one: a
// person may be locked out of their second factor with their password fine, and
// a page told only the kind draws a form that is already dead. Both fields are
// **facts**; a display name, an order or a "required" flag is where D21's
// warning about Kratos bites, and the shape is what makes that boundary
// visible rather than tempting.
message VouchFactor {
  // "password", "totp".
  string kind = 8;

  // What they call this one, when there is more than one of a kind. Empty is
  // the only one.
  string name = 5;

  // When they may try this one again, and unset for one that is open.
  google.protobuf.Timestamp locked_until = 4;
}

message VouchVerifyResponse {
  // Whether the secret was the one held for them.
  //
  // **Never set together with a continuation.** They are mutually exclusive,
  // and that is not tidiness: every caller in the tree reads `ok` as *signed
  // in* and mints a session on it, so a version of this that meant *this factor
  // was proved* would sign people in on one factor, silently, in the open
  // direction -- the one shape a sign-in path must not have. An app that has
  // not heard of second factors goes on gating on `ok` and fails **closed**.
  bool ok = 1;

  // Who it was, set only when `ok`. This is what the Login App puts in the
  // subject of whatever it goes on to issue.
  bytes holder = 2;
  bytes tenant = 3;

  // When they may try again, set only when too many failures have closed the
  // account for a while.
  //
  // It is distinguishable from an ordinary refusal, and that is a deliberate
  // trade rather than an oversight: it tells a caller that this person exists,
  // which every other refusal here is careful not to. The alternative is a
  // product where somebody locked out is told nothing and tries forever, and
  // being locked out is already something they can discover by succeeding.
  google.protobuf.Timestamp locked_until = 4;

  // What has been proved so far, and what else this person has.
  //
  // Set only on an answer that carries a continuation, which is D21's first
  // condition made structural rather than written as a rule: *available is
  // answered only once something is satisfied*, or anybody could ask which
  // factors a stranger has registered. A continuation exists only after a
  // factor has passed, so there is nowhere to ask it early.
  //
  // What is deliberately absent: how many are needed, which one to offer, and
  // what to call them. `len(satisfied)` and whether a continuation is set draw
  // "step two of two" without roster claiming a total it does not own.
  repeated string satisfied = 10;
  repeated VouchFactor available = 11;

  // The handle that carries all of it to the next call.
  //
  // Set when this person has more they could prove. Absent when they do not --
  // so a deployment with one factor gets byte for byte the answer it got
  // before, and pays no row for a continuation nobody would spend.
  string continuation = 12;
}

message VouchContinueRequest {
  // What the last call answered with.
  string continuation = 1;

  string kind = 8;
  bytes secret = 9;

  // Which one, when this person has two of a kind. Empty is the only one.
  string name = 5;
}

message VouchContinueResponse {
  // The same answer, one factor further on: `satisfied` grown, `available`
  // narrowed, and a fresh continuation -- the old one is spent.
  VouchVerifyResponse verified = 1;
}

message VouchDelegateRequest {
  // Whoever is signing in, and the secret they typed -- **or** a continuation
  // that has already proved them.
  //
  // Exactly one of the two ways, refused rather than resolved in some order
  // this comment would then have to define, which is the rule `VouchWho`
  // already applies to its own three.
  //
  // The continuation form is what makes a two-step sign-in end in a token
  // without a second argon2 comparison and without minting for somebody nobody
  // just proved -- the two things the note above refuses. It is safe here for
  // the reason it is not safe in general: a continuation is single-use, alive
  // for minutes, and belongs to the caller spending it.
  VouchWho who = 1;

  string kind = 8;
  bytes secret = 9;

  string continuation = 12;

  // Which one, when this person has two of a kind. Empty is the only one.
  //
  // Read either way. It used to say *only with a continuation, since a first
  // factor is its kind's only one by construction* -- which is true of signing
  // in and not of what `Enrol` writes: the first second-factor somebody adds
  // may be named, and confirming it is a first-factor call. See
  // `VouchVerifyRequest.name`.
  string name = 5;

  // What the delegation may be used for, in full:
  // "/roster.IdentityService/List".
  //
  // Refused when empty, the way `roster key add --allow` is: everything hands
  // out more than was asked for, and nothing mints a credential that silently
  // does not work.
  //
  // **No wider than the caller.** Each of these has to be covered by what the
  // calling key itself may do -- otherwise an app allowed only to check
  // passwords could mint a token that erases holders and use it through
  // somebody who may. The check bites exactly as hard as the caller's own
  // credential is narrow: under `auth.Plain` or mTLS a caller carries
  // `frame.Whole`, so it refuses nothing, because there is nothing there to be
  // wider than.
  //
  // It is checked **before the secret is compared**, which is not a detail. Run
  // after, a caller that over-asks would get one answer for a wrong password
  // and another for a right one -- D14's equal-cost refusal undone as a status
  // code, which is worse than a timing leak because it is exact.
  repeated string methods = 10;

  // When it stops working, and unset takes this deployment's default.
  //
  // A moment rather than a duration, because the caller is the one that knows:
  // a delegation is held for a session and the app is what decides when that
  // ends. roster has no opinion to impose -- it does not hold the truth of
  // anybody's session -- so there is no cap here, and the safety is elsewhere:
  // it is never wider than the person, and it is worth nothing without the key
  // it was minted for.
  //
  // A time in the past is refused rather than clamped.
  google.protobuf.Timestamp expires = 11;
}

message VouchAcceptRequest {
  // What the front door was handed, and checked.
  VouchClaim claim = 1;

  // What the delegation may be used for, bounded by what the caller may call.
  // Empty is refused, as everywhere else here: a delegation that allows nothing
  // opens no door.
  repeated string methods = 2;

  // When it stops working. Unset is `keys.DelegateFor`, which is minutes.
  google.protobuf.Timestamp expires = 3;
}

message VouchDelegateResponse {
  // The same answer `Verify` gives, because it is the same question asked
  // first: `ok`, who it was, and a lockout if there is one.
  //
  // Nested rather than copied so that the two cannot drift. An app that already
  // reads a `Verify` reads this with the code it has.
  VouchVerifyResponse verified = 1;

  // The delegation, and the only time it is ever readable. What is stored is a
  // hash, for the reason every password store has one.
  //
  // Set only when `verified.ok`. It does **not** go in `authorization`: it says
  // who a call is *about* while the caller goes on saying who they are, and it
  // travels in `roster-as` beside the key it was minted for. See
  // `keys.HeaderActing` for why that is what makes it bindable at all.
  string token = 10;

  // When it stops working, which is always set when a token is.
  google.protobuf.Timestamp expires = 11;
}

message VouchEnrolRequest {
  VouchWho who = 1;

  // Which kind: "totp" or "webauthn". A password is `Set` or `Reset`, and
  // neither of those is something a person's phone or key holds.
  //
  // The two arrive by opposite roads and that is why they are one method. For
  // `totp` roster **makes** the secret and answers with it once, because a seed
  // has to be read back and a browser generating one is a browser's `crypto`
  // deciding how good it is. For `webauthn` the authenticator makes it and
  // roster is handed the public half -- there is nothing to answer with, and
  // the response is empty.
  string kind = 8;

  // What they call it, when there is more than one to tell apart -- "the
  // phone", "the yubikey in the drawer". Empty is the only one of its kind.
  string name = 5;

  // What the authenticator app shows in its list, and it is the deployment's
  // name rather than the tenant's: a person with accounts at two operators
  // needs to tell the two entries apart, and both are this roster.
  string issuer = 9;

  // What the browser answered with, for `webauthn`, and nothing for `totp`.
  //
  // An envelope rather than the raw attestation: the response alone is not
  // checkable, because verifying it needs the relying-party id, the origin and
  // the challenge -- the three facts D20 named as the browser-facing half that
  // roster does not know. So it carries all four.
  //
  //     {"rp_id": "contoso.example",
  //      "origins": ["https://contoso.example"],
  //      "challenge": "…",
  //      "response": { … what navigator.credentials.create() gave … }}
  //
  // Refused for `totp`, which makes its own secret: a request carrying both has
  // not decided which ceremony it is doing.
  bytes attestation = 10;
}

message VouchEnrolResponse {
  // Both empty for `webauthn`: the authenticator kept the private half and
  // roster was handed the public one, so there is nothing here that was not
  // already in the browser.
  //
  // The seed, base32, uppercase and unpadded -- the only time it is readable.
  //
  // Padding is legal and some apps refuse it, which is the sort of thing only
  // discovered in front of a phone that will not scan.
  string seed = 1;

  // The same thing as a QR code's worth of URI.
  string uri = 2;
}

message VouchRevokeRequest {
  // The delegation to end, as it was handed over.
  string token = 1;
}

message VouchRevokeResponse {}

message VouchResetRequest {
  VouchWho who = 1;

  // Which secret, and empty means "password" as everywhere else. A kind that
  // is not a password is refused: there is nothing sensible to generate for a
  // TOTP seed that the person could then read out.
  string kind = 8;
}

message VouchResetResponse {
  // Shown once and not stored. What is stored is an argon2id hash, so this
  // deployment cannot tell anybody what theirs was any more than it can tell
  // them their key.
  string secret = 1;
}

message VouchLinkRequest {
  VouchWho who = 1;

  // When it stops working, and unset takes this deployment's default.
  //
  // A caller may ask for less and not for more: a link is delivered through a
  // channel roster knows nothing about, and how long that channel takes is the
  // caller's to know -- but how long a way into somebody's account may lie
  // around is not.
  google.protobuf.Timestamp expires = 11;
}

message VouchLinkResponse {
  // The link, and the only time it is readable.
  //
  // Answered for a stranger as well, resolving to nobody. See the note on the
  // method for why: the alternative is a form that answers *is this address
  // here* to anybody who types into it.
  string token = 1;

  google.protobuf.Timestamp expires = 11;
}

message VouchRedeemRequest {
  // The link, as it was delivered.
  string token = 1;

  // What the delegation may be used for, if the redemption finishes the
  // sign-in. The same rules [VouchService.Delegate] states: refused when empty,
  // and no wider than the caller.
  repeated string methods = 10;

  // When the delegation stops working. Unset takes the default.
  google.protobuf.Timestamp expires = 11;
}
