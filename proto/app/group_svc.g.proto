edition = "2023";
package roster;

import "app/group.proto";
import "app/site_svc.g.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/holder_svc.g.proto";
import "roster/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service GroupService {
  // Add creates a new Group
  rpc Add(GroupAddRequest) returns (Group);
  // Get retrieves a Group
  rpc Get(GroupGetRequest) returns (Group);
  // Patch updates an existing Group
  rpc Patch(GroupPatchRequest) returns (Group);
  // Apply applies a patch document to an existing Group
  rpc Apply(GroupApplyRequest) returns (Group);
  // Erase deletes a Group
  rpc Erase(GroupRef) returns (GroupEraseResponse);
  // List reads Groups a page at a time.
  rpc List(GroupListRequest) returns (GroupListResponse);
}

service GroupMembershipService {
  // Add creates a new GroupMembership
  rpc Add(GroupMembershipAddRequest) returns (GroupMembership);
  // Get retrieves a GroupMembership
  rpc Get(GroupMembershipGetRequest) returns (GroupMembership);
  // Patch updates an existing GroupMembership
  rpc Patch(GroupMembershipPatchRequest) returns (GroupMembership);
  // Apply applies a patch document to an existing GroupMembership
  rpc Apply(GroupMembershipApplyRequest) returns (GroupMembership);
  // Erase deletes a GroupMembership
  rpc Erase(GroupMembershipRef) returns (GroupMembershipEraseResponse);
  // List reads GroupMemberships a page at a time.
  rpc List(GroupMembershipListRequest) returns (GroupMembershipListResponse);
}

message GroupAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  SiteRef site = 3;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message GroupGetRequest {
  GroupRef ref = 1;
  GroupSelect select = 2;
}

message GroupRef {
  oneof key {
    bytes id = 1;
    GroupRefBySlug slug = 4;
  }
}

message GroupRefBySlug {
  string alias = 4;
  TenantRef tenant = 2;
}

message GroupSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  SiteSelect site = 3;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message GroupPatchRequest {
  GroupRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message GroupApplyRequest {
  GroupRef ref = 1;
  patch.Patch patch = 2;
}

message GroupEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message GroupListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated GroupFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message GroupListResponse {
  repeated Group items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message GroupFilter {
  GroupRef ref = 1;
  TenantRef tenant = 2;
  SiteRef site = 3;
}

message GroupMembershipAddRequest {
  bytes id = 1;
  HolderRef holder = 2;
  GroupRef group = 8;
  google.protobuf.Timestamp date_created = 15;
}

message GroupMembershipGetRequest {
  GroupMembershipRef ref = 1;
  GroupMembershipSelect select = 2;
}

message GroupMembershipRef {
  oneof key {
    bytes id = 1;
    GroupMembershipRefByMember member = 2;
  }
}

message GroupMembershipRefByMember {
  HolderRef holder = 2;
  GroupRef group = 8;
}

message GroupMembershipSelect {
  bool all = 1;
  HolderSelect holder = 2;
  GroupSelect group = 8;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message GroupMembershipPatchRequest {
  GroupMembershipRef ref = 1;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message GroupMembershipApplyRequest {
  GroupMembershipRef ref = 1;
  patch.Patch patch = 2;
}

message GroupMembershipEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message GroupMembershipListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated GroupMembershipFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message GroupMembershipListResponse {
  repeated GroupMembership items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message GroupMembershipFilter {
  GroupMembershipRef ref = 1;
  HolderRef holder = 2;
  GroupRef group = 3;
}
