edition = "2023";

package roster;

import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Credential is a secret somebody proves themselves with here, rather than at a
// provider.
//
// # Why it is roster's at all
//
// Most people arrive through an external identity provider and this row does not
// exist for them. It is for the local account: the deployment with no IdP in
// front of it, and the break-glass administrator who has to be able to sign in
// when everything else is down.
//
// It is here rather than in a credentials service because the alternative is two
// origins for one person -- which is the reason the design rejected running an
// identity store beside its own `users` table.
//
// # roster checks it and does not hand it out
//
// The Login App asks "is this the password for this person" and gets yes or no.
// A comparison done anywhere else is a hash that has left the store, and it puts
// timing-safe comparison, attempt counting and lockout in two places that will
// disagree.
//
// So nothing reads `secret` back. It is written and compared, and the RPC that
// compares it is roster's.
message Credential {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // What somebody calls this one, when there is more than one of a kind to tell
  // apart: "the phone", "the yubikey in the drawer".
  //
  // # Why it is here now and was not
  //
  // The index used to be `(holder, kind)` and the comment said *one of each per
  // person*, which is right for a password, defensible for a TOTP seed, and
  // wrong for the thing after it. Registering a **second** security key is the
  // standard advice for WebAuthn, and a passkey lands one per device -- so an
  // entity that permits exactly one row per kind forecloses the recovery story
  // of the factor most likely to be added next.
  //
  // Empty is the single-instance case, which is what a password and a TOTP seed
  // are, so nothing about them changes.
  //
  // # Why it is `name` and not `alias`
  //
  // Field 4 is the number the convention reserves for what a row is named by,
  // and it is the wrong one here: payday **makes an alias up** when a caller
  // gives none -- seven characters, so that every row has a slug -- and this
  // wants the opposite, an empty value meaning *the only one*. Found by adding
  // it: every existing lookup stopped matching, because the rows had aliases
  // nobody had asked for.
  //
  // `name` carries no such machinery and says the same thing to a person.
  string name = 5;

  // What kind of secret it is -- "password", "totp". One of each **name** per
  // person, which the index below is what enforces.
  //
  // A string, and unlike `Identity.provider` the set is **not** a deployment's
  // to extend: what may be written here is exactly what something in
  // `server/vouch` can later check, and `Vouch.Set` refuses anything else. A
  // row of a kind nothing checks is offered to every sign-in from then on,
  // refused when it is answered, and removable by no call on any plane.
  string kind = 8;

  // The verifier, never the secret: an argon2id encoded hash for a password, an
  // encrypted seed for TOTP. Bytes rather than a string because neither is
  // text this app should be tempted to print.
  //
  // Declared `secret`, which is what keeps it out of the **trail**. The layer
  // that clears it on the way out is only on the walled stack -- `vouch` reads
  // it through an unwalled one, deliberately, because comparing it is the whole
  // job -- and the recorder is behind every layer, so without this declaration
  // a verifier is copied into `Audit.value` on every write. Found by writing it.
  bytes secret = 9 [(payday.field) = {secret: true}];

  // How many times in a row somebody has failed, and until when they may not
  // try again. Both live here because the thing being protected is here --
  // counting attempts anywhere else is counting them per process.
  int32 failures = 10;

  google.protobuf.Timestamp date_locked = 11 [(orm.field) = {nullable: true}];

  // When it was last changed, for a policy that expires them and for showing
  // somebody why they are being asked.
  google.protobuf.Timestamp date_rotated = 12 [(orm.field) = {nullable: true}];

  // The last step this credential accepted, for the kinds that count.
  //
  // D20 says it in as many words: *a TOTP step that has been used must not work
  // twice, and the only place that can be recorded is the row.* A code watched
  // over a shoulder or captured by a page pretending to be the front door
  // otherwise works for the rest of its thirty seconds, which is most of what
  // an attacker with one needs.
  //
  // It is the same class of state as WebAuthn's signature counter, and D20 uses
  // that counter to argue verification is roster's at all -- so this is not an
  // extra column, it is the column that argument was about.
  //
  // Zero for a kind that does not count anything, which is every kind that
  // exists today except `totp` -- and for `totp` it is a fact rather than a
  // default: a seed that has never had a code verified against it is
  // **unconfirmed**, and `Vouch` leaves an unconfirmed factor out of what a
  // person is asked for, because a QR somebody may have mis-scanned is a form
  // that cannot be filled. One code moves it, which is what `Verify` taking a
  // name is for; `VouchVerifyRequest.name` in `vouch.proto` says why at length.
  int64 last_step = 16;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "kind"
        refs: [
          {name: "holder", number: 2},
          {name: "kind", number: 8},
          {name: "name", number: 5}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 13
    tenanted: {via: "holder.tenant"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      // And by holder, which is what "how can this person sign in" needs --
      // `server/core` refuses the removal of somebody's last way in, and
      // counting what is left is a read over one person's rows. It grants
      // nothing: this service is unregistered and closed, so the only thing
      // that can ask is this process.
      by: [
        {name: "ref"},
        {name: "holder"}
      ]
      size: 20
      max: 100
    }
    watch: {}
  };
}
