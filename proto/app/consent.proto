edition = "2023";

package roster;

import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Consent is one act of an account's consent to one of an app's documents:
// agreeing to it at a version, or withdrawing an agreement to one the account
// was free to decline.
//
// # A ledger, and the app keeps the documents
//
// What is in force -- which documents an app asks for, at which version, and
// which of them an account may decline -- is the app's configuration and stays
// there. What roster keeps is what each account did about them, and when, so
// that an app asks one question at a sign-in (`ConsentService.Settled`) and the
// record outlives the app's own storage. It is the same rows whichever app
// asks: Rove's terms and privacy policy are two documents of one app, and a
// workspace's own policy later is the same row with a scope.
//
// # Every act is a row, and none is changed
//
// An agreement, then a withdrawal, then an agreement again are three rows, in
// order ([Consent.seq]), and the one in force is the latest. Overwriting a row
// would lose when the first agreement and the withdrawal happened, and that
// would leave the trail as the only proof of them -- which keeps a write's
// values for as long as its own retention does, and blanks what is personal.
// Consent is kept as proof, so the proof is the rows: nothing here has a verb
// that changes one, and the generated writes are closed on the wire.
//
// # And an app reads its own
//
// [Consent.app] is the holder the call was made as -- an app's own, in the
// tenant its people are in -- stamped from the frame and never named by a
// request. Every read is narrowed to it, so one app neither sees nor answers
// for another's documents (`server/core/consent.go`).
//
// # Kept after the account leaves, and then not
//
// Erasing the account leaves its consents where they are: they are what shows
// afterwards that it agreed. `forget` leaves them too, since the holder stays
// as a blank pseudonym for them to point at, and `consent.keep` after the
// erase they are destroyed. Empty keeps them for good.
message Consent {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  // Whose consent: the account, as the holder it is in its directory.
  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // 3 is empty: there is no set smaller than a tenant a consent belongs to.
  // 4 to 7 are empty: a consent is not a row anybody names or describes.

  // The app whose document it is: the holder the call was made as.
  //
  // A column and not an edge, for `Email.entered_by`'s reason: the caller may
  // be one a deployment key is answered as, and what is wanted is an
  // identifier compared and never followed. **Stamped**: `server/core` writes
  // the frame's actor, and the generated gate refuses a request that asserts
  // one.
  bytes app = 8 [
    (orm.field) = {
      type: TYPE_UUID
      immutable: true
    },
    (payday.field) = {stamped: true}
  ];

  // Where it holds: empty for the whole deployment, or a string of the app's
  // own -- a Rove workspace, say -- so that a policy narrower than the
  // deployment is a scope and not a schema change.
  string scope = 9 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // What: the app's own key for the document -- `terms`, `privacy` -- and the
  // version agreed to or withdrawn from.
  string document = 10 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // The tenant `holder.tenant` reaches, kept here so that a page of a tenant's
  // consents is one index; `Email.tenant_id` says the rest.
  bytes tenant_id = 11 [(orm.field) = {
    type: TYPE_UUID
    immutable: true
  }];

  string version = 12 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // Which act. Stamped: it is the verb that was called, and not a word a
  // request may say.
  ConsentAct act = 16 [
    (orm.field) = {immutable: true},
    (payday.field) = {stamped: true}
  ];

  // Whether the account was free to decline the document. Only an optional
  // one may be withdrawn: leaving what is required is leaving the app.
  bool optional = 17 [(orm.field) = {immutable: true}];

  // What it was given through, in the app's words: `web`, `cli`.
  string client = 18 [
    (orm.field) = {immutable: true},
    (payday.field) = {personal: false}
  ];

  // Its place among the acts of one account on one document of one app in one
  // scope at one version: the first is 1, and the one in force is the highest.
  //
  // A sequence rather than the time, because two acts in one instant are not
  // ordered by it -- and because it is what the index below is unique over, so
  // that two callers acting at once cannot both be next. Stamped.
  int64 seq = 19 [
    (orm.field) = {immutable: true},
    (payday.field) = {stamped: true}
  ];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];

  // When the act was: a consent is never changed, so this is it.
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "tenant_id", number: 11},
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },

      // The ledger's order, and what makes it one.
      //
      // Unique over the sequence and not over the document: a document has
      // many acts and one position each, so this is what a unique index can
      // say of an append-only table -- and it is what keeps two callers from
      // both writing act `n + 1`, the second refused rather than a duplicate,
      // with no lock on anybody's row. It is also the read the question an app
      // asks at a sign-in is: an account's acts for one app in one scope are a
      // prefix of it, in order, so what is in force for each document is one
      // range scan (`ConsentService.Settled`).
      {
        name: "acts"
        refs: [
          {name: "holder", number: 2},
          {name: "app", number: 8},
          {name: "scope", number: 9},
          {name: "document", number: 10},
          {name: "version", number: 12},
          {name: "seq", number: 19}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 29
    tenanted: {via: "holder.tenant", stamp: "tenant_id"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      // `app` is what every read is narrowed by (`server/core`), and the
      // rest name one document's acts: with all of them said, the read is a
      // range of the index `acts` and nothing else.
      by: [
        {name: "ref"},
        {name: "holder"},
        {name: "app"},
        {name: "scope"},
        {name: "document"},
        {name: "version"}
      ]
      size: 20
      max: 100
    }
  };
}

// ConsentAct is what an act of consent did.
enum ConsentAct {
  CONSENT_ACT_UNSPECIFIED = 0;

  // Agreed to the document at the version.
  CONSENT_ACT_AGREE = 1;

  // Withdrew the agreement in force, to an optional document.
  CONSENT_ACT_WITHDRAW = 2;
}
