edition = "2023";
package roster;

import "app/host.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service HostService {
  // Add creates a new Host
  rpc Add(HostAddRequest) returns (Host);
  // Get retrieves a Host
  rpc Get(HostGetRequest) returns (Host);
  // Patch updates an existing Host
  rpc Patch(HostPatchRequest) returns (Host);
  // Apply applies a patch document to an existing Host
  rpc Apply(HostApplyRequest) returns (Host);
  // Erase deletes a Host
  rpc Erase(HostRef) returns (HostEraseResponse);
  // List reads Hosts a page at a time.
  rpc List(HostListRequest) returns (HostListResponse);
}

service MailDomainService {
  // Add creates a new MailDomain
  rpc Add(MailDomainAddRequest) returns (MailDomain);
  // Get retrieves a MailDomain
  rpc Get(MailDomainGetRequest) returns (MailDomain);
  // Patch updates an existing MailDomain
  rpc Patch(MailDomainPatchRequest) returns (MailDomain);
  // Apply applies a patch document to an existing MailDomain
  rpc Apply(MailDomainApplyRequest) returns (MailDomain);
  // Erase deletes a MailDomain
  rpc Erase(MailDomainRef) returns (MailDomainEraseResponse);
  // List reads MailDomains a page at a time.
  rpc List(MailDomainListRequest) returns (MailDomainListResponse);
}

message HostAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message HostGetRequest {
  HostRef ref = 1;
  HostSelect select = 2;
}

message HostRef {
  oneof key {
    bytes id = 1;
    string name = 5;
  }
}

message HostSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool name = 5;
  bool desc = 6;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message HostPatchRequest {
  HostRef ref = 1;
  string name = 10;
  string desc = 12;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message HostApplyRequest {
  HostRef ref = 1;
  patch.Patch patch = 2;
}

message HostEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message HostListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated HostFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message HostListResponse {
  repeated Host items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message HostFilter {
  HostRef ref = 1;
  TenantRef tenant = 2;
}

message MailDomainAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string provider = 9 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message MailDomainGetRequest {
  MailDomainRef ref = 1;
  MailDomainSelect select = 2;
}

message MailDomainRef {
  oneof key {
    bytes id = 1;
    MailDomainRefByAt at = 2;
  }
}

message MailDomainRefByAt {
  TenantRef tenant = 2;
  string name = 5;
}

message MailDomainSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool name = 5;
  bool provider = 9;
  bool desc = 6;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message MailDomainPatchRequest {
  MailDomainRef ref = 1;
  string name = 10;
  string provider = 18;
  string desc = 12;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message MailDomainApplyRequest {
  MailDomainRef ref = 1;
  patch.Patch patch = 2;
}

message MailDomainEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message MailDomainListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated MailDomainFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message MailDomainListResponse {
  repeated MailDomain items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message MailDomainFilter {
  MailDomainRef ref = 1;
  TenantRef tenant = 2;
}
