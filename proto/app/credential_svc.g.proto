edition = "2023";
package roster;

import "app/credential.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/holder_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service CredentialService {
  // Add creates a new Credential
  rpc Add(CredentialAddRequest) returns (Credential);
  // Get retrieves a Credential
  rpc Get(CredentialGetRequest) returns (Credential);
  // Patch updates an existing Credential
  rpc Patch(CredentialPatchRequest) returns (Credential);
  // Apply applies a patch document to an existing Credential
  rpc Apply(CredentialApplyRequest) returns (Credential);
  // Erase deletes a Credential
  rpc Erase(CredentialRef) returns (CredentialEraseResponse);
  // List reads Credentials a page at a time.
  rpc List(CredentialListRequest) returns (CredentialListResponse);
  // Watch the Credentials this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(CredentialWatchRequest) returns (stream CredentialWatchResponse);
  // ChangeMine changes the **caller's own** password, and only the caller's.
  //
  // No `holder`/`who` field, deliberately: the row is the frame's actor and no
  // field can redirect it, the same "a which with no whose" that makes
  // `MeService.IssueKey` safe to grant. So a role naming this method means
  // exactly *may change your own password*, where the smallest role over the
  // operator write (`Set`, which takes a subject) would mean *reset anybody no
  // wider than you*.
  //
  // # `current` is the reauth, and it is what makes this safe to hold
  //
  // The new secret is written only after the current one is verified. That is
  // what keeps a credential which merely *acts as* somebody -- a key pasted
  // into a build log -- from changing their password: it can act as them and
  // still not know the password it would be replacing. The guarantee does not
  // depend on **how** the caller authenticated, which is deliberate -- payday
  // keeps the auth method for the log and refuses to let a rule turn on it, so
  // the proof lives in the request rather than in a check on the credential's
  // kind.
  //
  // A first password (there is none to verify against) is not this: it is the
  // operator/recovery path, because a bearer setting a first password with
  // nothing to reauth against is the account takeover this closes.
  rpc ChangeMine(CredentialChangeMineRequest) returns (CredentialChangeMineResponse);
  // EnrolMine adds a second factor to the **caller's own** account, and only
  // the caller's. It is `Enrol` with no subject: the row is the frame's actor,
  // and no field can redirect it -- the same "a which with no whose" that makes
  // `ChangeMine` and `MeService.IssueKey` safe to grant. A role naming it means
  // *may add a factor to your own account*, where the smallest role over `Enrol`
  // (which takes a reference) would mean *enrol one on anybody no wider than
  // you*. It is what a self-service screen calls, the way `ChangeMine` is the
  // password half of the same page.
  rpc EnrolMine(CredentialEnrolMineRequest) returns (CredentialEnrolMineResponse);
  // Unlock opens an account too many wrong answers closed, without touching the
  // secret. Whose credential it is, by reference -- an operator naming somebody
  // they already know, so no sign-in form and no email lookup (that stays with
  // the recovery flow). Held to `mayReach`: you may unlock nobody whose
  // permissions are not a subset of your own, because a lockout you can clear
  // is a lockout you could also have caused.
  //
  // A name of its own rather than a `Patch` field: a role is a list of methods,
  // so "may open a locked account" is grantable only by being nameable, apart
  // from "may rewrite the row". The same argument `HolderService.Enable` makes.
  rpc Unlock(CredentialUnlockRequest) returns (CredentialUnlockResponse);
  // Set writes somebody's secret to the one given, hashing it. The operator
  // write `Vouch.Set` was, now on the entity, named by a reference rather than
  // a sign-in form -- the email/address addressing stays with the recovery
  // flow, which is where the Email lookup belongs.
  //
  // It hashes because it compares (D14): the caller sends plaintext, the layer
  // chooses the argon2 parameters. Refused for a secret in the leaked corpus,
  // and held to `mayReach` -- writing a secret is a way to become somebody, so
  // you may write nobody's whose permissions are not a subset of your own.
  //
  // A first password and a rotation are one call: absent, it is added; present,
  // it is replaced and the lockout cleared, because somebody who set it is not
  // who the lockout was protecting against.
  rpc Set(CredentialSetRequest) returns (CredentialSetResponse);
  // Enrol makes a second factor and answers with it once. The write `Vouch.Enrol`
  // was, on the entity: a `totp` seed roster generates, wraps and answers with
  // exactly once, or a `webauthn` public key an authenticator made and roster
  // was handed. Named by a reference, like every other write here -- a person
  // adding a factor to their own account, or an operator to somebody they may
  // reach.
  //
  // A password is not this: that is `Set` or `Reset`, and neither is a thing a
  // phone or a key holds. The kind check refuses one the same way `Set` refuses
  // a second factor, from opposite ends of the one line `vouch.Settable` draws.
  //
  // It does not count until it is proved: the row goes in with its step at zero,
  // and one `Verify` has to pass before the factor is offered at a sign-in. So a
  // mis-scanned QR is a thing somebody discovers now rather than when they are
  // already half in and cannot finish.
  rpc Enrol(CredentialEnrolRequest) returns (CredentialEnrolResponse);
}

message CredentialAddRequest {
  bytes id = 1;
  HolderRef holder = 2;
  string name = 5 [features.field_presence = IMPLICIT];
  string kind = 8 [features.field_presence = IMPLICIT];
  bytes secret = 9 [features.field_presence = IMPLICIT];
  int32 failures = 10 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_locked = 11;
  google.protobuf.Timestamp date_rotated = 12;
  int64 last_step = 16 [features.field_presence = IMPLICIT];
  google.protobuf.Timestamp date_created = 15;
}

message CredentialGetRequest {
  CredentialRef ref = 1;
  CredentialSelect select = 2;
}

message CredentialRef {
  oneof key {
    bytes id = 1;
    CredentialRefByKind kind = 2;
  }
}

message CredentialRefByKind {
  HolderRef holder = 2;
  string kind = 8;
  string name = 5;
}

message CredentialSelect {
  bool all = 1;
  HolderSelect holder = 2;
  bool name = 5;
  bool kind = 8;
  bool secret = 9;
  bool failures = 10;
  bool date_locked = 11;
  bool date_rotated = 12;
  bool last_step = 16;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
}

message CredentialPatchRequest {
  CredentialRef ref = 1;
  string name = 10;
  string kind = 16;
  bytes secret = 18;
  int32 failures = 20;
  google.protobuf.Timestamp date_locked = 22;
  // Clear date_locked instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_locked clears.
  bool date_locked_null = 23;
  google.protobuf.Timestamp date_rotated = 24;
  // Clear date_rotated instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_rotated clears.
  bool date_rotated_null = 25;
  int64 last_step = 32;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
}

message CredentialApplyRequest {
  CredentialRef ref = 1;
  patch.Patch patch = 2;
}

message CredentialEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message CredentialListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated CredentialFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message CredentialListResponse {
  repeated Credential items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message CredentialFilter {
  CredentialRef ref = 1;
  HolderRef holder = 2;
}

message CredentialWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated CredentialFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message CredentialWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated CredentialWatchItem items = 1;
}

message CredentialWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Credential value = 2;

  // The Rpc that changed it, by the name gRpc knows it by. It is what the
  // caller of *that* Rpc asked for and not the write it became, so an Rpc
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message CredentialChangeMineRequest {
  // The password they have now, verified before the new one is written.
  bytes current = 1;

  // The new one. Hashed by `server/core` -- the caller sends plaintext, the
  // layer chooses the argon2 parameters, because roster is the one that
  // compares (D14). Breach-checked the same way `Set` is.
  bytes secret = 2;
}

message CredentialChangeMineResponse {}

message CredentialEnrolMineRequest {
  // "totp" or "webauthn". No holder: the row is the frame's actor.
  string kind = 1 [features.field_presence = IMPLICIT];

  // What they call it, when there is more than one to tell apart.
  string name = 2 [features.field_presence = IMPLICIT];

  // What the authenticator app lists it under; empty is the deployment's name.
  string issuer = 3 [features.field_presence = IMPLICIT];

  // The browser's answer for `webauthn`, an envelope carrying the relying-party
  // id, the origins and the challenge. Nothing for `totp`.
  bytes attestation = 4;
}

message CredentialEnrolMineResponse {
  // The `totp` seed, base32, the only time it is readable. Empty for `webauthn`.
  string seed = 1 [features.field_presence = IMPLICIT];

  // The same seed as an `otpauth://` URI. Empty for `webauthn`.
  string uri = 2 [features.field_presence = IMPLICIT];
}

message CredentialUnlockRequest {
  // Whose credential, by reference -- an id or `@tenant/alias`. Not a sign-in
  // form: this is an operator naming somebody they know.
  HolderRef ref = 1;

  // Which credential; empty is the password.
  string kind = 2 [features.field_presence = IMPLICIT];
}

message CredentialUnlockResponse {
  // What it was locked until, or unset if it was not locked -- so an operator
  // can tell "I opened it" from "it was not closed".
  google.protobuf.Timestamp was_locked_until = 1;
}

message CredentialSetRequest {
  // Whose credential, by reference -- an id or `@tenant/alias`. Not a sign-in
  // form: an operator names somebody they already know.
  HolderRef ref = 1;

  // Which credential; empty is the password. A second factor is Enrol.
  string kind = 2 [features.field_presence = IMPLICIT];

  // The secret as typed. Hashed here, never stored as given.
  bytes secret = 3;
}

message CredentialSetResponse {}

message CredentialEnrolRequest {
  // Whose account the factor is for, by reference -- an id or `@tenant/alias`.
  HolderRef ref = 1;

  // "totp" or "webauthn". A password is `Set` or `Reset`; refused here.
  string kind = 2 [features.field_presence = IMPLICIT];

  // What they call it, when there is more than one to tell apart. Empty is the
  // only one of its kind.
  string name = 3 [features.field_presence = IMPLICIT];

  // What the authenticator app shows in its list -- the deployment's name, so a
  // person with accounts at two operators can tell the entries apart. `totp`
  // only.
  string issuer = 4 [features.field_presence = IMPLICIT];

  // The browser's answer for `webauthn`, an envelope carrying the relying-party
  // id, the origins and the challenge beside the response, since the response
  // alone is not checkable. Nothing for `totp`, which makes its own secret; a
  // request carrying both has not decided which ceremony it is doing.
  bytes attestation = 5;
}

message CredentialEnrolResponse {
  // The `totp` seed, base32, uppercase and unpadded -- the only time it is
  // readable. Empty for `webauthn`, whose private half never left the
  // authenticator.
  string seed = 1 [features.field_presence = IMPLICIT];

  // The same seed as an `otpauth://` URI, for a QR code. Empty for `webauthn`.
  string uri = 2 [features.field_presence = IMPLICIT];
}
