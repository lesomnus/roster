edition = "2023";

package roster;

import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Identity is one way a person signs in: a subject at a provider, pointing at
// the Holder it turned out to be.
//
// # Whose row it is written on is the other half of it
//
// This file says at length what makes a good **subject**, and for a long time
// said nothing about the **holder**. A row here is a way into the account it
// names: link an account you control to somebody's Holder and signing in at
// that provider serves you as them. So writing one is refused unless that
// person's permissions are a subset of yours -- the rule that guards a password,
// applied to the other half of a sign-in. `server/core/escalate.go`, PLAN.md
// D41.
//
// # Why it is a row and not a column
//
// One person, several. The same human arrives through the company's Entra
// tenant on Monday and through GitHub on Saturday, and both have to land on one
// Holder -- otherwise they are two people to everything downstream, with two
// histories and two sets of permissions.
//
// A column would be one-to-one and would make the second route a second person.
//
// # It reaches its tenant through the Holder
//
// There is no `tenant` edge here: an identity belongs to whoever it names, and
// whoever it names belongs to a tenant. `tenanted: {via: "holder.tenant"}` is
// that path written down, and the wall is generated from it.
message Identity {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // 4..7 are empty on purpose. An identity has no name a person writes: it is
  // named by the pair below, and both halves come from a provider rather than
  // from anybody here. The numbers stay reserved.

  // Which provider said so -- "entra", "github", "ldap", "local". A string
  // rather than an enum because adding one is a deployment's decision and a new
  // enumerator is this schema's.
  string provider = 8;

  // What that provider calls this person, and it must be the identifier the
  // provider treats as **immutable**: a numeric ID for GitHub, `objectGUID` or
  // `entryUUID` for LDAP, `oid` for Entra.
  //
  // Never a username and never an email address. Both get changed, and an email
  // gets reassigned to somebody else entirely -- which would silently hand one
  // person another person's account.
  string subject = 9;

  // The tenant `holder.tenant` reaches, kept here. payday stamps it.
  //
  // # Why it is worth a column
  //
  // Two things, and the second is the one that was actually in the way.
  //
  // The wall reaches this entity through the holder, so without a stamp every
  // read of an identity is `HasHolderWith(holder.TenantIDIn(...))` -- a
  // correlated subquery, on the table a sign-in reads.
  //
  // And a `list.by` filter reaches **one hop**, so "every identity in this
  // tenant" could not be asked for at all: `holder.tenant` is two, and the
  // generator refuses that by name. With the column it is a filter like any
  // other, which is what an operator console needs.
  //
  // # It is not a second answer to be kept in step
  //
  // `holder` is immutable and so is `Holder.tenant`, so the value is decided
  // when the row is written and no step of that path can move afterwards --
  // which is what `pd gen` refuses a stamp without. Nothing refreshes it
  // because nothing can put it out of date.
  //
  // And **immutable**, which is what says nothing may -- the word `Email.tenant_id`
  // carries and this one did not. Without it the column is a field of the patch
  // request like any other, so a write could move the row across the wall: the
  // stamp is the whole of what a read is narrowed by, and a row whose stamp
  // says another tenant is a row that tenant reads and this one does not. It is
  // closed at the transport today -- `/Patch` is a general write and roster
  // opens none -- which is a reason it went unnoticed and not a reason to leave
  // it, since a batch and the servers' own writes reach the column by another
  // road.
  bytes tenant_id = 10 [(orm.field) = {
    type: TYPE_UUID
    immutable: true
  }];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      // The identity, **within a tenant**. Unique, because two Holders of one
      // tenant claiming the same subject at the same provider is the
      // account-takeover shape: whoever logs in next becomes whichever row was
      // found first.
      //
      // The tenant is in the key and that is the decision. The same human can
      // sign up to two operators' services with the same Google account, and
      // those are two Holders with two histories and two sets of permissions --
      // which is what a tenant being the wall already means. Nothing here
      // relates them, and nothing should: a row that spanned tenants would have
      // no owner, no answer to who may erase it, and no tenant whose trail it
      // belongs to.
      //
      // Without the tenant in the key, one account at a provider could belong
      // to exactly one tenant across the whole deployment -- so the second
      // operator a person signs up to would be told the identity was taken, by
      // somebody they cannot see.
      {
        name: "subject"
        refs: [
          {name: "tenant_id", number: 10},
          {name: "provider", number: 8},
          {name: "subject", number: 9}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 8
    tenanted: {via: "holder.tenant", stamp: "tenant_id"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      // `holder` as well as `ref`, because "what does this person sign in
      // with" is the question anybody looking at a person asks, and the pair
      // that names one row is no use for it: a `ref` names one identity, and
      // what is wanted is every identity of somebody.
      //
      // It grants nothing. The wall reaches this entity through
      // `holder.tenant`, so the list is already narrowed to the tenants the
      // caller may see, and naming a holder outside that answers with nothing.
      // And `tenant_id`, which the stamp is what made possible: a filter
      // reaches one hop and `holder.tenant` is two, so before the column there
      // was nothing here for "every identity in this tenant" to name.
      by: [{name: "ref"}, {name: "holder"}, {name: "tenant_id"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}
