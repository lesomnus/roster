edition = "2023";

package roster;

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// IssueService is the deployment's control-plane bootstrap for a first password.
//
// It was two methods -- `IssueKey` and `IssuePassword` -- that shared a shape:
// a secret made on the server, stored as a verifier, answered once. The key
// half is `ApiKey.Mint` now, an overlay on the entity it writes (see
// `apikey_svc.ext.proto`), because minting a key is a verb on api-key rows. The
// password half stayed, and this is why.
//
// # Why it is not CredentialService
//
// `IssuePassword` generates a password for a new operator on the **control
// plane**, which has one tenant, so it names them by a bare alias. It is the
// deployment's own bootstrap -- the first way in for somebody a console just
// created -- and runs with no reach rule and no epoch, because there is nobody
// to escalate past and no session to end. A reach-guarded `Credential` overlay
// cannot be that: on the control plane a console key holds nothing, so `mayReach`
// would refuse the very act this exists for. `server/console` writes it inline
// through the generated `Credential` verbs, which `server/core` leaves unguarded
// for the deployment's own work; this is the RPC a console reaches to ask.
//
// Off the control plane it refuses: a bare alias there names one person per
// customer, and a customer's person is given a password the guarded way
// (`Credential.Set`, `Vouch.Reset`).

service IssueService {
  // IssuePassword sets somebody's password to a generated one and answers with
  // it once.
  //
  // For the operator a console has just created, who has no way in yet. What
  // they do with it is change it -- which is `VouchService.Set`, and needs the
  // old one, and is therefore not this.
  rpc IssuePassword(IssuePasswordRequest) returns (IssuePasswordResponse);
}

message IssuePasswordRequest {
  // Whose, by alias within this plane's one tenant.
  string alias = 1;
}

message IssuePasswordResponse {
  // Shown once and not stored. What is stored is an argon2id hash, so this
  // deployment cannot tell anybody what theirs was any more than it can tell
  // them their key.
  string password = 1;
}
