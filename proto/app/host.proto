edition = "2023";

package roster;

import "roster/payday/holder.proto";
import "roster/payday/tenant.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Host is a name a front door answers at, and the tenant it belongs to.
//
// # The question it exists to answer
//
// A multi-tenant app served at `contoso.example.com` has to turn that name into
// a tenant before it can look anybody up, and roster had no way to say. Every
// front door held its own map instead -- `examples/sso` still takes one as
// configuration -- which is a copy of a fact roster owns, in as many places as
// there are apps, going stale independently.
//
// It is the **host** and not the email domain, and login.md is explicit about
// why: *a tenant is the same service under a different tenant's own domain,
// so the name the browser arrived at is the operator whose service they are
// signing in to.* Where somebody **authenticates** is a different question,
// often at another organisation entirely -- one of contoso's people can
// perfectly well have a personal Google account. That question is
// [MailDomain]'s.
//
// # Why it is a row rather than a field on Tenant
//
// Because it has to be **looked up**. `holder.proto` already wrote the rule
// this follows -- *anything that has to be looked up goes flat beside it* --
// and it is the same reason `Identity` is an entity and `Profile` is not. A
// repeated field on `Tenant` is one value to the database: no index, and a
// front door resolving a name would read every tenant there is.
//
// # It is behind the wall, and the read that matters is not
//
// Tenanted like everything else, so that an operator writes their own names and
// sees nobody else's. But the read a front door makes happens **before anybody
// has been resolved to a tenant** -- that is the whole point of it -- so it
// goes through the unwalled server, exactly as `cmd.Resolver` and
// `vouch.Verify` do and for the same stated reason: working out who somebody is
// cannot require knowing who they are. `HostService` is what does that, and it
// answers with a tenant identifier and nothing else.
//
// # The name is unique across the deployment, and it can move
//
// Two tenants cannot both own `contoso.example.com`, so this is one of the few
// constraints here that crosses the wall. What it costs is a small oracle -- the
// second tenant to claim a name is told it is taken, by somebody they cannot see
// -- and a hostname is a public fact, so that is the cheaper side of the trade.
// `Email` deliberately went the other way, and D3 says why.
//
// It is not forever, and the mechanism is the unique index rather than a rule:
// it covers the rows that are **not erased**, so an erased row releases its
// name. A tenant that proves a name somebody else holds takes it -- the
// incumbent row is erased and a new one written, in one transaction -- because
// proving requires present control of DNS, and whoever has that has the name
// whatever a row here says. The incumbent is not asked, which is the right way
// round and is worth knowing: their people stop being able to sign in at that
// name, and the erase in the trail is where it is written down.
//
// # Proving the name is yours
//
// roster resolves DNS to check it. This section used to say it should not, on
// the grounds that roster runs in an air gap -- and that was answering the wrong
// question. An air-gapped deployment has no tenant registering its own
// hostnames either; what it has instead is a roster operator with a shell. So
// there are two roads to a row, and [Host.date_proved] is which one it was.
//
//	a tenant's own        claim the name ([HostProof]), publish what roster
//	                      asked for, and roster looks it up
//	a roster operator's   write the row. The person who routed the name is the
//	                      person writing it, so there is nothing to check
//
// What has **not** changed is what a row means either way. A name nothing routes
// here is inert whoever wrote it, because what decides that traffic reaches this
// deployment is DNS and the ingress in front of it, and both belong to whoever
// runs the deployment.
//
// What has changed is **claiming a name you do not own**. That was real -- the
// first writer took it and the rightful one was refused -- and the conclusion
// was a permission nothing could enforce:
//
//	Registering a hostname is the deployment's act, not a customer's.
//	Do not put `/roster.HostService/Add` on a role a tenant's own
//	administrators hold.
//
// It is a customer's act now, and that method is one their administrators may
// hold: on the walled plane a tenant writing its own name is held to a proof, so
// the name is theirs if they can show it is and nobody else's row survives their
// showing it. [MailDomain] still needs none of this, and the reason is the
// section below it: it claims nothing.
message Host {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // 4 and 7 are empty. `alias` is unique **within a tenant** and this is unique
  // across the deployment, so a slug here would be a name that lies about its
  // own scope. What the row is called is what it is, which is `name`.

  // The name a browser arrived at, lowercased and without a port:
  // "contoso.example.com".
  //
  // Stored as it is compared. A host is case-insensitive and a port is not part
  // of it, so whatever writes one normalises first -- `server/core` refuses one
  // that is not already normalised, because a row that differs from what a
  // front door will look up is a row that silently never matches.
  string name = 5 [(orm.field) = {unique: true}];

  string desc = 6;

  // Whatever the deployment keeps about this row that the schema does not name.
  //
  // Number seven because that is the one an entity spends on labels or leaves
  // empty, and this one has a use for it: a row a provisioner wrote carries
  // `roster.declared` (`cmd/resources.go`), which is what `server/core` reads
  // to refuse a console edit to something a file owns.
  //
  // Metadata about **where the row came from**, which is what a label is for
  // everywhere else that has them -- and not a setting roster acts on. A
  // setting goes in a field, so that what is configuration and what is a note
  // stay tellable apart.
  map<string, string> labels = 7;

  // The holder a **deployment key** borrows when a request says it arrived
  // here, and unset is nobody to borrow.
  //
  // # What it is for
  //
  // One Login App instance fronting many tenants. It holds one credential
  // (`docs/login.md`), and the roster-hosted shape is an `rk_` -- which
  // resolves to a frame with no tenant, so the policy hands it
  // `frame.Everything` and what keeps one tenant's rows out of another's is the
  // app's own code.
  //
  // This is what roster narrows it **to** instead. A request carrying
  // `roster-at: contoso.example.com` resolves through this row to a tenant and
  // to the holder that tenant put here, and the frame is that holder's: their
  // bindings, their tenant, and `grpcx.Limit` counting against them rather than
  // against nothing.
  //
  // # It grants nothing
  //
  // An `rk_` already sees every tenant. Borrowing a nominated holder's frame is
  // strictly **less** than what it had, which is why this needs no escalation
  // rule of its own and why either a tenant's own administrator or a roster
  // operator may write it. What it is, is a tenant choosing how narrow the app
  // in front of them is.
  //
  // # Whose holder
  //
  // One of this tenant's, and `server/core` refuses one from another: a row
  // that named somebody else's would hand a caller a frame in a tenant that
  // never agreed to it, which is the shape [core.agrees] exists for.
  Holder acts_as = 8 [(orm.edge) = {nullable: true}];

  // When roster looked up DNS and read back what it had asked for, and **unset
  // is a row nobody proved**.
  //
  // Which of the two roads above it was, and nothing more: an unproved row is
  // not inert and is not second class. `FrontService.WhoseHost`, `cmd.Hosted`
  // and `keys.At` resolve a name whichever road wrote it, because a roster
  // operator writing one is the person who routed it.
  //
  // What it is for is that a later decision is made on evidence rather than on
  // who happened to be at the keyboard. Set: a tenant claimed the name, put the
  // token in DNS, and roster read it. Unset: somebody wrote it who was trusted
  // to.
  //
  // # Why the trail is not enough
  //
  // The trail says **who wrote this row** and cannot say **whether roster
  // checked**, because the lookup is not a write by a caller -- there is nothing
  // for a recorder to record. `Email.date_verified` is the same field for the
  // same reason.
  //
  // `Email.vouched_by` is the half this one does not need. An address can be
  // vouched for by a third party and the row has to say which, because it is
  // only as good as that provider's check. Here there is no third party: either
  // roster's own lookup saw it, or nobody did.
  //
  // `stamped`, so a caller cannot write it. The one road to it is a server
  // writing it below the gate, which is `Email.Confirm`'s arrangement exactly.
  google.protobuf.Timestamp date_proved = 9 [
    (orm.field) = {nullable: true},
    (payday.field) = {stamped: true}
  ];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      }
    ]
  };
  option (payday.entity) = {
    domain: 20

    list: {
      order: [
        {
          field: {name: "date_created"}
        },
        {
          field: {name: "id"}
        }
      ]
      by: [
        {name: "ref"},
        {name: "tenant"}
      ]
      size: 20
      max: 100
    }
  };
}

// MailDomain is where the people at an address authenticate.
//
// "Addresses at `@contoso.com` go to Entra." Identifier-first sign-in is the
// thing every multi-tenant front door rewrites, and it is a fact about a
// tenant's domains rather than about anybody in particular.
//
// # It hangs off the domain and not off a person, deliberately
//
// Answered per person it is an account-enumeration oracle: type an address, and
// which provider comes back says whether that account is here. Answered per
// domain it says nothing about any individual -- the answer for
// `nobody@contoso.com` is the answer for everybody at contoso.
//
// # What it names, and what it does not
//
// A provider by the name `Identity.provider` already uses. Not a connection: a
// connection carries a client secret, and handing one back would make it the
// first secret roster returns rather than checks -- which argues with D13. A
// name needs no secret, so this half came first; when `Connection` arrived it
// kept the same rule from the other side, holding a **reference** to where the
// deployment keeps the secret and never the secret itself.
//
// # Within a tenant, and only within one
//
// Unlike [Host], which is a public name somebody owns, this is a routing hint
// one **tenant** holds about their own people. Two tenants may both say
// something about `@gmail.com` and they are two facts, so the key is
// `(tenant, name)` and nothing crosses -- which is also why this one needs no
// proof of ownership and a `Host` does.
message MailDomain {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // The domain, lowercased and without the `@`: "contoso.com". Normalised on
  // the way in for [Host.name]'s reason.
  string name = 5;

  // Which provider to send them to, by the name `Identity.provider` uses.
  //
  // Empty is a domain this deployment knows about and has nothing to say about,
  // which is a different fact from not having the row: a front door can hold a
  // list of domains it serves without routing any of them.
  string provider = 9;

  string desc = 6;

  // Whatever the deployment keeps about this row that the schema does not name.
  //
  // Number seven because that is the one an entity spends on labels or leaves
  // empty, and this one has a use for it: a row a provisioner wrote carries
  // `roster.declared` (`cmd/resources.go`), which is what `server/core` reads
  // to refuse a console edit to something a file owns.
  //
  // Metadata about **where the row came from**, which is what a label is for
  // everywhere else that has them -- and not a setting roster acts on. A
  // setting goes in a field, so that what is configuration and what is a note
  // stay tellable apart.
  map<string, string> labels = 7;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        name: "at"
        refs: [
          {
            name: "tenant"
            number: 2
          },
          {
            name: "name"
            number: 5
          }
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 21

    list: {
      order: [
        {
          field: {name: "date_created"}
        },
        {
          field: {name: "id"}
        }
      ]
      by: [
        {name: "ref"},
        {name: "tenant"}
      ]
      size: 20
      max: 100
    }
  };
}

// HostProof is a name a tenant is claiming, and what roster asked them to
// publish to show the name is theirs.
//
// # The exchange, which is one round trip and one DNS record
//
//  1. a tenant writes one of these, naming the host they want
//  2. roster answers with a `token`, and asks for it at
//     `_roster-challenge.<name>` as a TXT record
//  3. the tenant adds that record wherever they keep their DNS
//  4. the tenant writes the [Host]. roster looks the record up, and the row is
//     written or the call is refused
//
// After step 4 there is nothing to keep: the proof is spent by an erase, the way
// a [Continuation] is, and the record can come out of DNS. What was proved is a
// moment, and [Host.date_proved] is where that moment is written down.
//
// # Why it is a row and not a field on Host
//
// Two reasons, and the first is the one that decides it. **`Host.name` is unique
// among the rows that are not erased**, so a claim kept on a `Host` row could
// not be made for a name somebody already holds -- which is exactly the case
// that has to work, because a name can move. Two tenants may be claiming one
// name at once and each needs a token of their own; whoever's token is in DNS is
// who has it. So this is keyed `(tenant, name)` and claims nothing.
//
// The second is the trail. Every write to a `Host` is recorded, and a row that
// carried the state of a proof would put a record in the audit table each time
// anybody looked. A short-lived row beside the thing it is about is what this
// repository already does with a proof of anything -- [Continuation], `Link`,
// `Delegation` -- and it is swept for the same reason.
//
// # The token is not a secret, which every other token here is
//
// It goes in **public DNS**. There is nothing to protect: anybody who can put a
// record under a name owns the name already, which is the whole of what this
// measures. So it is a plain field, stored as it is compared, and readable as
// often as somebody needs to go and look at what they were asked to publish --
// unlike `ApiKey` or `Link`, where what is stored is a hash and the value is
// answered once.
//
// What it is random for is two things a fixed value could not do. A record left
// over from an earlier claim, or from another roster deployment, does not count.
// And when two tenants want one name, the token is what tells their claims apart
// -- which is the mechanism *the latest proof wins* actually runs on.
message HostProof {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Tenant tenant = 2 [(orm.edge) = {immutable: true}];

  // The name being claimed, normalised the way [Host.name] is and for the same
  // reason: this is compared against a `Host` and looked up in DNS, so a value
  // that differs from what those will use is a claim that can never succeed.
  string name = 5 [(orm.field) = {immutable: true}];

  // What to publish, and roster's to generate.
  //
  // `server/core` refuses a value in the request. A caller-chosen token would
  // let somebody claim a name whose TXT record already says something they can
  // predict -- which is a name they do not control, proved by a record they did
  // not write.
  string token = 9 [(orm.field) = {immutable: true}];

  // When this stops being spendable, and roster's to set for `token`'s reason.
  //
  // A claim is not a reservation -- it holds no name and blocks nobody -- so
  // what the window is for is that a token lying in DNS forever is a name
  // provable by whoever finds it. Abandoned claims are collected by
  // `prove.Sweep`; the expiry is what makes them refused before then.
  google.protobuf.Timestamp date_expires = 10 [(orm.field) = {nullable: true}];

  string desc = 6;

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {
            name: "date_created"
            number: 15
          },
          {
            name: "id"
            number: 1
          }
        ]
      },
      {
        // Unique on the pair and **not on the name**, which is the whole shape:
        // one claim per tenant per name, and as many tenants claiming one name
        // as want to try.
        name: "at"
        refs: [
          {
            name: "tenant"
            number: 2
          },
          {
            name: "name"
            number: 5
          }
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 26

    list: {
      order: [
        {
          field: {name: "date_created"}
        },
        {
          field: {name: "id"}
        }
      ]
      by: [
        {name: "ref"},
        {name: "tenant"}
      ]
      size: 20
      max: 100
    }
  };
}
