edition = "2023";

package roster;

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// AuthService is how an operator gets a credential, and gives it up.
//
// # Why it is a service and not an HTTP endpoint
//
// Because everything else this app offers is one, and a sign-in that is not is
// the single call every client implements by reading a document instead of
// generating from this file. One definition, and Go and TypeScript and whatever
// comes next get the same semantics without agreeing about them separately.
//
// payday leaves the seam here rather than filling it -- `auth` reads a
// credential and does not issue one -- and for a while that read as "issuing is
// HTTP". It is not: a cookie is a response header, `set-cookie` is response
// metadata, and `web.Transcode` hands one to the browser as the other.
// `authsession.Mint` is the half that does it. See payday's
// `docs/guide/signing-in.md`.
//
// # Why it is not SessionService, and why SignOut is MeService's clause
//
// CLAUDE.md asks this of every hand-written service and this file did not
// answer it for a long time -- the headings argued service-versus-HTTP, which
// is a different question. Written out, it turns out the two methods fall under
// two different clauses, which is worth knowing rather than averaging.
//
// **SignIn is the sign-in flow.** It reads a `Tenant`, reads a `Holder`, reads
// and writes a `Credential` through `Vouch.Verify` -- the lockout counter moves
// on a wrong answer -- and writes a `Session`. Four entities in one flow, with
// the deciding writes on rows other than the one a `Session.Mint` overlay would
// hang off. And what it hands back is not in the response at all: it is a
// `set-cookie` header, carried as response metadata, which no generated verb
// answers with.
//
// **SignOut is the other clause**: it reads the caller from the frame and holds
// what a role cannot be asked for. The request is empty and which session to
// end comes out of the cookie in the caller's own metadata, so it is
// subject-less in the strongest sense -- there is not a field it could be
// pointed with -- which is `MeService.SignOutEverywhere`'s property exactly,
// one scope down. `cmd.Policy` waives a binding for it on that ground, and the
// paragraph in `aboutYourself` says what it cost not to.
//
// It stays here rather than moving to `MeService` for one reason: `MeService`
// is served on both planes and knows nothing about the admin console's session store,
// while this is served where the sessions are. A `me.WithSessions` option would
// undo the sentence `me.proto` makes about roster not knowing the caller's
// session, to move a method whose neighbour is `SignIn`.
//
// # What it does not do
//
// Answer who you are. `MeService` does, it is already what a page asks first,
// and a second way to ask would be a second answer to keep in step. This
// service makes a credential and ends one; asking about it is somebody else's.
//
// # Where it is served
//
// **Both planes, each over its own rows.** A session names a holder of the
// database it was minted in, so one is resolved where that row is and nowhere
// else: a roster operator's on the control plane, a roster user's on the data
// plane. The two are separate databases with no query between them, which is
// why a cookie from one authenticates nothing on the other -- and is not a
// reason either plane cannot mint its own.
//
// The control plane's is the admin console's and is always served. The data
// plane's is `sign_in.enabled` and is **off unless a deployment says**, because
// this is the port a browser can reach.
//
// # Which tenant, and where that comes from
//
// This request has no tenant field, and the two planes answer that differently
// rather than one of them answering it in a field. A control plane has exactly
// one tenant, so asking which would be asking a question with a single answer.
// A data plane has many, and the answer is **the name the request arrived at**:
// `Host` rows say which tenant answers at which name, and `cmd.Hosted` reads
// them. A name nothing claims is a refusal that names it, because a sign-in
// that carried on with no tenant would look somebody up in whichever one the
// query happened to reach.
//
// A field would be worse than either: a caller naming the tenant it would like
// to be checked against is a caller choosing which passwords it is guessing at.
//
// And it is the one method here served without a credential, which it has to be
// -- that is what is being asked for. What that costs is the same thing an HTTP
// `/session` cost: anybody who reaches the port may guess passwords, and the
// rate limit counts per tenant off a frame a public call has none of. The
// answers are the lockout in `server/vouch`, the control listener being
// private, and the data plane's door being shut until a deployment opens it.
service AuthService {
  // SignIn checks a secret and sets the cookie.
  //
  // The cookie is the whole answer. It is `HttpOnly`, so the page that called
  // this cannot read it -- which is the point, since script that can read a
  // credential is script that can send it somewhere else.
  rpc SignIn(AuthSignInRequest) returns (AuthSignInResponse);

  // SignOut deletes the session and clears the cookie.
  //
  // Deleting the row is the part that matters: the key is dead in every browser
  // that had it, immediately, which is the thing a self-contained token cannot
  // do.
  rpc SignOut(AuthSignOutRequest) returns (AuthSignOutResponse);

  // Offers is what this name lets somebody in with, asked before the form is
  // drawn.
  //
  // # Why a page has to ask
  //
  // Because `TenantConfig.password` is a fact roster enforces, and `Verify`
  // refuses a password for a tenant that has it off **with the same answer as a
  // wrong one**. `server/vouch/vouch.go` argues that at length and ends the
  // paragraph with *the app that draws the form was told by `/flow` and has no
  // form to draw* -- which is true of the Login App, true of the account app
  // (`GET /providers` carries `password`), and was not true of the user console.
  // That page drew the form unconditionally, so for such a tenant it offered one
  // every answer to which was refused, and said only "no".
  //
  // So this is the third copy of a question two surfaces already ask, and the
  // first one that is on the wire rather than in an app's own HTTP.
  //
  // # Why it is a method here and not a route
  //
  // `cmd.serveHttp` deleted `POST /session` and wrote down why: *whatever a
  // listener serves over HTTP now is a service registered on its own `g`, and
  // there is nowhere for a second answer to hide.* A hand-written `/providers`
  // beside the page would be that again.
  //
  // And it cannot be a generated verb. `TenantService.Get` is the read this
  // wants, but the wall **refuses** a frameless call rather than narrowing it,
  // and a caller who has not signed in has no frame -- so the one method that
  // could answer is the one no anonymous caller may reach. `Public` is per
  // method and cannot say *this row, these fields*.
  //
  // # It answers about the tenant, never about a person
  //
  // Which is what makes it safe to leave open. The subject is the name the
  // request arrived at, exactly as `SignIn`'s is, and there is no field to point
  // it somewhere else. What comes back is the same fact `GET /providers` has
  // answered anonymously at a tenant's own host for as long as it existed.
  rpc Offers(AuthOffersRequest) returns (AuthOffersResponse);
}

message AuthSignInRequest {
  // Who, within the one tenant this plane has.
  //
  // No tenant field. A control plane has exactly one, so asking which to sign
  // in to would be asking a question with a single answer -- and a field with
  // one answer is one somebody eventually fills in wrongly.
  string alias = 1;

  // The secret, as typed. Not a hash: hashing is the store's, because
  // parameters chosen by a caller are parameters it cannot vouch for.
  string password = 2;
}

// AuthSignInResponse is empty, and that is the answer.
//
// What a page needs about the person is a request it should make, against the
// same server, behind the same rules -- `MeService`. An answer composed here
// would be a second place that has to change when the app's idea of a person
// does.
//
// And the credential is not in it. It is in the cookie, which this page never
// sees.
message AuthSignInResponse {}

message AuthSignOutRequest {}

message AuthSignOutResponse {}

// AuthOffersRequest is empty for the reason [AuthSignInRequest] has no tenant
// field: which tenant is the name the browser arrived at, and a field would be a
// caller asking to be told about one it did not arrive at.
message AuthOffersRequest {}

message AuthOffersResponse {
  // Whether a password is a way in here.
  //
  // `TenantConfig.password`, as roster enforces it, and not the page's guess.
  // False means every answer to a password form is refused, so the form is not
  // drawn -- which is the **consequence** of the switch rather than the feature,
  // the distinction `docs/login.md` § *A tenant with no passwords* draws.
  bool password = 1;
}
