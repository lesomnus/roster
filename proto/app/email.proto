edition = "2023";

package roster;

import "app/identity.proto";
import "roster/payday/holder.proto";
import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Email is an address a person uses, and whether anybody has checked that they
// do.
//
// # Why it is a row, and why it is not a key
//
// Three reasons that compound. A person has several. Whether an address has
// been **verified** has to live somewhere, and it decides whether the address
// may be trusted for anything at all. And an address is not an identifier: they
// are changed, and organisations reassign a leaver's address to a new joiner
// with the same name.
//
// So this is what to show somebody and where to write to them, and what
// resolves people is [Identity]. An address resolves one **within a tenant**,
// which is a later and narrower thing; see the index below and D27.
//
// # Unique twice, and neither of them across the deployment
//
// A consultant may legitimately be a person in two tenants under one address,
// and a global constraint makes the second one an error with no resolution. So
// it is unique **per holder** -- nobody lists the same address twice -- and
// **per tenant**, which is what closes F7 and makes `VouchWho.address` name
// somebody.
//
// # And stored as it is looked up
//
// Neither of those means anything unless the column holds what the lookup
// compares. `vouch.byAddress` lowers and trims what it is handed, and for a
// while the write did neither: `Someone@Contoso.example` and
// `someone@contoso.example` were two rows to the index and one address to
// everything that read it. What that cost was not a duplicate -- it was that
// the lowered spelling **wins**, so an address written as a provider sent it
// could not sign in at all, and anybody who could add an address could write
// the lowered form of somebody else's onto their own row and take it.
//
// `server/core` refuses a write that is not already normalised, naming the form
// it should have been, the way it refuses a `Host` that is not; `front.Address`
// is the one function both sides use.
message Email {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];

  Holder holder = 2 [(orm.edge) = {immutable: true}];

  // 4 is empty: an address is not an alias. An alias is unique within a tenant
  // and is what a slug names a row by, and neither is true here.

  string address = 8;

  // When somebody checked, and the zero time for never.
  //
  // A time rather than a flag because "when" is the question asked afterwards
  // -- a verification from three years ago is a different fact from one from
  // this morning, and a boolean cannot tell them apart.
  //
  // # It is what makes an address name somebody, which it was not
  //
  // F20 closed this as a **write** -- a caller could assert their own address
  // had been checked -- and its own note said *which nothing reads yet*. That
  // stayed true through two writers (`Email.Verify`/`Confirm`, then
  // `Email.Attest`) and it made the field a decoration on the one road it exists
  // for: `vouch.byAddress` resolved a person by an address without reading it, so
  // a row nobody had checked named somebody.
  //
  // What that cost is #48 and it is not a takeover -- a link goes to the mailbox
  // either way. It is that the index below made the address **somebody's**, so
  // the rightful holder was refused `Add`, could not reach `Verify`, and had no
  // road to their own address. A name the real holder cannot have, refused with
  // *somebody has it*, is `host.proto` § *Why a hostname is not checked* one
  // entity along.
  //
  // So `byAddress` reads it now, and `EmailVerifyRequest.holder` is what stops
  // that turning a squat into a permanent denial: a proof may take an address
  // **nobody proved**. Which is #42's sentence said about an address -- a name
  // that resolves somebody may only be taken by proof.
  //
  // **Nullable**, and it has to be said out loud. A message field has presence
  // in the generated API -- `HasDateVerified` exists -- but a NOT NULL column
  // cannot keep it: an address that was never verified reads back as verified
  // at the zero time. The API promises something the storage cannot hold.
  // **Stamped**, which is the whole of the rule about who writes it: the
  // generated gate refuses an `Add` that asserts one. An address is verified by
  // something checking it, and a request saying it was checked is the thing it
  // must not be possible to say.
  //
  // This was a layer of roster's -- `server/core`'s `notVouchedForByTheCaller`
  // -- because neither generator had a word for it. `orm.field` has `immutable`,
  // which takes a field out of the **patch** request and leaves it in `Add`, and
  // this wants the other way round. `payday.field.stamped` was added for exactly
  // this, and a declaration beats a layer for the reason that layer's own
  // comment gave: a line in a stack is invisible, so the next app writes the
  // same field and does not know to write the same refusal.
  //
  // It says nothing about who may write it **afterwards**. That is a permission
  // and permissions are roster's -- `Patch` is the road a real verification is
  // stamped by, and it is closed at the transport anyway.
  google.protobuf.Timestamp date_verified = 9 [
    (orm.field) = {nullable: true},
    (payday.field) = {stamped: true}
  ];

  // Which [Identity] vouched for it, if one did. An address that arrived in a
  // provider's claims is only as good as that provider's own check, and the
  // design is explicit that an unverified provider address must not be trusted
  // to link accounts.
  Identity vouched_by = 10 [(orm.edge) = {nullable: true}];

  // The tenant `holder.tenant` reaches, kept here. payday stamps it, and
  // `Identity` says at length why a column is worth it.
  //
  // Here it buys one more thing than it does there, and it is the one F7 was
  // open on: it is what a **unique index across a tenant** can be written over.
  // Without it there is nowhere to put the constraint -- the wall reaches this
  // entity through the holder, and an index cannot follow an edge.
  //
  // Immutable, which is not decoration. A stamp is written on `Add` and nothing
  // refreshes it, so a mutable one lands in the generated `Patch` and a caller
  // who may patch could move a row behind another tenant's wall. Nothing can
  // put it out of date -- `holder` is immutable and so is `Holder.tenant` --
  // and this is what says nothing may.
  bytes tenant_id = 11 [(orm.field) = {
    type: TYPE_UUID
    immutable: true
  }];

  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];

  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "page"
        refs: [
          {name: "date_created", number: 15},
          {name: "id", number: 1}
        ]
      },
      {
        name: "address"
        refs: [
          {name: "holder", number: 2},
          {name: "address", number: 8}
        ]
        unique: true
      },

      // One address, one person, **within a tenant** -- which is what closes
      // F7 and is the whole reason the stamp above exists.
      //
      // # What it gives up, and what it does not
      //
      // D3 refused a constraint across the deployment and the reason stands: a
      // consultant may legitimately be a person in two tenants under one
      // address, and a global constraint makes the second one an error nobody
      // can resolve. That case is *across* tenants and this constrains
      // *within* one, so it is untouched.
      //
      // What it buys is that an address names one person again. `VouchWho`
      // could not take an address before -- `email.proto` said outright that
      // *nothing here resolves anybody by address* -- because one might name
      // two people, and a sign-in that resolved by address would pick one of
      // them. With a tenant, which a front door now has from
      // `FrontService.WhoseHost`, there is exactly one row to find.
      //
      // It is **not** partial on [Email.date_verified], and that was looked at:
      // one row per address whether it is proved or not is what keeps the lookup
      // to one indexed read with one answer. What it costs is that a row nobody
      // proved still **holds** the address, so the road for the rightful holder
      // has to be a way to take it rather than a second row --
      // `EmailVerifyRequest.holder`, and #48. `orm.Index` has no predicate to
      // declare a partial one with anyway; only `includes_erased`, which is a
      // different question.
      //
      // # What it costs a deployment
      //
      // A migration. Two people in one tenant sharing an address is a shape
      // this schema used to permit, and the index cannot be taken while one
      // exists. That is the real price of this phase.
      {
        name: "at"
        refs: [
          {name: "tenant_id", number: 11},
          {name: "address", number: 8}
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    domain: 9
    tenanted: {via: "holder.tenant", stamp: "tenant_id"}
    list: {
      order: [
        {field: {name: "date_created", number: 15}},
        {field: {name: "id", number: 1}}
      ]
      by: [{name: "ref"}, {name: "holder"}]
      size: 20
      max: 100
    }
    watch: {}
  };
}
