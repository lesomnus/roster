edition = "2023";
package roster;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";
import "payday/tenant.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Holder is who a request is from.
//
// It is the row `server/auth` reads to turn a credential into somebody, and the
// row the trail names on every line it writes. Like [Tenant] it is payday's
// because everything that decides anything reads it.
//
// **Fields 1..7 and 13..15 are payday's**; an app adds its own in 8..12 and
// from 16, in a `holder.ext.proto` beside this. Adding an email or the subject
// an external identity provider knows them by is exactly what that is for.
message Holder {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  // The tenant this holder is inside, which is immutable: moving somebody
  // between tenants is not a field write, since their whole trail was stamped
  // with where they were.
  Tenant tenant = 2 [(orm.edge) = {immutable: true}];
  // Alias is what a person writes this holder as, within its tenant:
  // `@acme/admin`. It is unique inside a tenant and not across the deployment.
  string alias = 4;
  string name = 5;
  string desc = 6;
  map<string, string> labels = 7;
  // See [Tenant.date_updated].
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {version: {}}];
  // When this holder was erased, and null for as long as it is here.
  //
  // A holder is erased **softly** and a tenant is not, and the difference is
  // the trail. Every row of it names the holder that did something, and a
  // holder that was deleted leaves an identifier nothing answers to -- the
  // trail goes on saying who while nobody can find out who. Stamping instead
  // means the answer outlives the person leaving, which is most of what a trail
  // is kept for.
  //
  // What follows is what soft erasure always follows with: an erased holder
  // cannot be read, cannot be changed, and **cannot authenticate**, because
  // every read is narrowed by this column and `auth` reads one to work out who
  // is calling. The index below covers only the rows that are still here, so
  // the alias comes free again.
  google.protobuf.Timestamp date_erased = 14 [(orm.field) = {erased: {}}];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [
      {
        name: "slug"
        refs: [
          {
            name: "alias"
            number: 4
          },
          {
            name: "tenant"
            number: 2
          }
        ]
        unique: true
      }
    ]
  };
  option (payday.entity) = {
    // payday's own, so that generation finds it whatever an app called the
    // proto package. An app never writes this; see `Own` in entity.proto.
    own: OWN_HOLDER

    domain: 2

    // Nothing about tenancy, which **is** the declaration: behind the wall, by
    // the edge called `tenant`. Getting that wrong hides every row, which is
    // noticed; getting it wrong the other way shows every row to everybody,
    // which is not -- so the assumption is the loud one, and the quiet one
    // (`global: {}`) is the thing that has to be written.
  };
  // The subject an identity provider knows this holder by, for whenever this
  // app grows past `Plain` auth.
  //
  // **Nullable**, and that is the part worth reading. Two holders cannot be one
  // person to whatever issued the credential, so it wants to be unique -- but
  // most holders have none, and a unique column that is usually the empty
  // string admits exactly one such row. Nullable is what makes "unset" not
  // collide with "unset": a unique index permits many NULLs and one of each
  // value.
  //
  // **Deprecated by [Identity].** It is one-to-one and this deployment needs
  // one-to-many -- the same person arrives through Entra and through GitHub.
  // Kept only so that removing it is a migration somebody decides to run.
  string idp_subject = 8 [(orm.field) = {
    unique: true
    nullable: true
  }];
  // What this person is called, as one thing.
  //
  // roster is the profile service, which the design puts **outside** the
  // identity provider deliberately: a customer IdP's `/userinfo` has only what
  // that customer put in it, the metadata is ours, and the schema has to be
  // ours to change. So it lives here, beside the person it describes.
  //
  // Product apps do not copy it. They hold the identifier and ask for this when
  // they have a screen to draw, cached for a minute or two -- which is the same
  // reason it is not in the token: a profile changes and a token does not.
  Profile profile = 9;
}

// Profile is what a person is called, and it is replaced whole.
//
// An object rather than four fields on the Holder because it is one fact from
// one moment: whatever last told us. Its cost is that it is one value to the
// database -- no filter, no index -- so anything that has to be **looked up**
// goes flat beside it. That is what [Identity] is.
//
// Stored as the canonical protobuf JSON, so these **names** are the storage.
// Renaming one does not break the build and does not break the wire; it stops
// finding the old value. Renaming a field here is a migration.
message Profile {
  string display_name = 1;
  string picture = 2;

  // Not the address. Addresses are [Email] rows, because a person has several
  // and because whether one has been verified has to live somewhere.
  string department = 3;
  string employee_no = 4;
  string locale = 5;
}
