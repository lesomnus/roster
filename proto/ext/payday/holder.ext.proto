edition = "2023";

package payday;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

// What this app adds to payday's Holder.
//
// An overlay may only **add**, and only in the numbers payday left free: 8..12
// and from 16. Generation refuses one that redeclares a number payday owns,
// because the merge would take the overlay's word and `alias` would quietly
// become whatever it said.
//
// Delete this file if there is nothing to add. The same works for `tenant` and
// `audit`, named the same way.
message Holder {
  // What this person is called, as one thing.
  //
  // roster is the profile service, which the design puts **outside** the
  // identity provider deliberately: a customer IdP's `/userinfo` has only what
  // that customer put in it, the metadata is ours, and the schema has to be
  // ours to change. So it lives here, beside the person it describes.
  //
  // Product apps do not copy it. They hold the identifier and ask for this when
  // they have a screen to draw, cached for a minute or two -- which is the same
  // reason it is not in the token: a profile changes and a token does not.
  Profile profile = 9;

  // Whatever the app that put it here keeps about this holder, and roster does
  // not read it.
  //
  // # Why it is opaque and `Profile` is not
  //
  // They answer different questions. `Profile` is what a **person** is called,
  // in this app's vocabulary, readable by everything that draws a screen and
  // mappable onto OIDC's standard claims -- which is the whole reason it is
  // here rather than in an identity provider: *the metadata is ours, and the
  // schema has to be ours to change*.
  //
  // This is not that. A robot arrives with a serial number, a `Holder` is
  // whoever a request is from, and there is no reason roster should have an
  // opinion about what a robot is. It carries its own type, so whoever reads it
  // knows what they got; whoever cannot resolve the type reads nothing, which
  // is a graceful thing for a field roster was never going to interpret.
  //
  // # What it costs, and it is the same cost `Profile` pays
  //
  // One value to the database -- no filter, no index. Anything that has to be
  // **looked up** goes flat beside it, which is the rule `Profile` already
  // states and the reason [Identity] exists.
  //
  // How two apps writing here avoid each other is not roster's question. It is
  // one slot on a row, and who writes to it is a decision a deployment makes
  // the way it decides who may call anything else.
  google.protobuf.Any data = 10;

  // Everything issued before this moment is void.
  //
  // "Sign out everywhere" as a **fact** rather than as a list. The alternative
  // is a registry of every app's live sessions, which is a copy of state whose
  // truth is somewhere else: it grows ghosts when an app dies, disagrees with
  // that app's own store, and puts other people's browser metadata in roster.
  // One timestamp does the whole job, and the two halves stay where each is
  // true -- roster answers *invalid since when*, an app answers *what is still
  // alive*.
  //
  // **A timestamp and not a flag**, and the reason is the whole correctness
  // argument. The value travels, and it is monotonic: a duplicate is a no-op, a
  // stale one cannot un-revoke, and a message that never arrives costs latency
  // rather than correctness. A flag that flips has none of that, and cannot
  // answer the question an app actually asks, which is whether the session in
  // front of it predates the write.
  //
  // What it voids **here** is a `Delegation`, which is a sign-in in miniature.
  // It deliberately does not void an `ApiKey`: a key is named, listed and
  // revoked one at a time, and killing somebody's scripts silently under
  // "sign out everywhere" is an outage with nothing anywhere saying why. That
  // is a second act and it has a second name.
  //
  // Never cleared, and nothing takes it as an argument -- the server stamps it.
  // A caller who could write an older value could un-revoke, and a caller who
  // could write a future one could lock somebody out of a deployment that has
  // no way to say so.
  google.protobuf.Timestamp date_invalidated = 11 [(orm.field) = {nullable: true}];

  // This person is not to sign in, and their rows stay.
  //
  // Neither of the two things that already existed. A lockout is temporary and
  // automatic and belongs to `Credential`; `date_erased` is deletion, and comes
  // with soft erasure's whole story about the trail. Somebody who left, somebody
  // suspended, somebody being investigated -- that is this, and it was missing.
  //
  // It has to reach further than a sign-in, which is the part that is easy to
  // get wrong: a session or a token already issued outlives the row that
  // stopped being allowed to have one. So it is read where a caller is
  // resolved, not only where one is authenticated -- and it travels on the same
  // stream `date_invalidated` does, which is the argument `holder.proto` uses
  // to justify `watch:` in the first place.
  //
  // A timestamp for the reason above, and because *since when* is a question an
  // operator asks.
  google.protobuf.Timestamp date_disabled = 12 [(orm.field) = {nullable: true}];

  // A picture of this person, kept here: one square image at the sizes a
  // screen draws one, inline.
  //
  // # Why roster keeps the image and not only where it is
  //
  // `profile.picture` says where a picture is, which is enough when that is
  // somewhere a browser can fetch -- and a directory's often is not. Entra
  // hands its photo only to a caller holding a token for Microsoft Graph, so
  // the one moment anybody here can have it is a sign-in, and after that it
  // is whatever was kept then. Kept here, a deployment with nowhere else to
  // put an image still has a picture of everybody, and who may see it is who
  // may read this row: the wall decides, rather than whoever learns a URL.
  //
  // # Why it is not in `Profile`
  //
  // `Profile` is replaced whole, and roster's own pages write it from a form
  // -- the admin console and the user console from a row they read in a
  // **list**. A list carries one size of this and not all of them
  // (`server/core/portrait.go` says why), so a portrait inside the profile
  // would be cut down by the next person to fix a typo in a department. Here a profile write cannot reach it: `Portray`
  // and `Fill` write it, and both take an image and make the sizes themselves.
  //
  // # What it costs
  //
  // A few kilobytes on the row -- six or so for a photograph, at every size --
  // in every `Get` that selects it and in the trail's copy of the row at each
  // write to this holder. Bounded by what roster renders rather than by what
  // a caller sends, which is why nothing writes it but roster.
  Portrait portrait = 16;
}

// Profile is what a person is called, and it is replaced whole.
//
// An object rather than four fields on the Holder because it is one fact from
// one moment: whatever last told us. Its cost is that it is one value to the
// database -- no filter, no index -- so anything that has to be **looked up**
// goes flat beside it. That is what [Identity] is.
//
// Stored as the canonical protobuf JSON, so these **names** are the storage.
// Renaming one does not break the build and does not break the wire; it stops
// finding the old value. Renaming a field here is a migration.
message Profile {
  string display_name = 1;
  string picture = 2;

  // Not the address. Addresses are [Email] rows, because a person has several
  // and because whether one has been verified has to live somewhere.
  string department = 3;
  string employee_no = 4;
  string locale = 5;
}

// Portrait is one picture of somebody, at the sizes roster keeps it.
//
// Made by roster and never written by a caller: `Portray` and `Fill` take an
// image and render it, so every portrait has the same sizes in the same format
// however the image arrived.
//
// # JPEG, and these sizes
//
// JPEG because Go's standard library writes it and does not write WebP -- an
// encoder for that is libwebp, which is cgo, which this binary does not link --
// and at these sizes WebP would save a kilobyte or two. 32, 64 and 128 pixels
// because a screen draws a person at 16 to 64 CSS pixels, at up to two device
// pixels to one of those; anything larger is for somewhere that is not a row.
// An image smaller than 128 pixels is not enlarged: its own size is the
// largest one.
//
// One with no renditions is no picture, and is what a picture taken away is
// written as, rather than as nothing: a page's store reads a field that is
// absent from an answer as one that was not selected, and would go on drawing
// the picture it had.
//
// Stored as the canonical protobuf JSON, so these **names** are the storage,
// as `Profile`'s are.
message Portrait {
  // Smallest first, each the same image, square.
  repeated Rendition renditions = 1;
}

// Rendition is a portrait at one size.
message Rendition {
  // Width and height, in pixels.
  uint32 size = 1;

  // `data:image/jpeg;base64,...`: a URI, so a page puts it in `src` as it is,
  // and one that says what it holds, so nothing has to be told the format.
  string uri = 2;
}
