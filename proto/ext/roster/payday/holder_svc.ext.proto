edition = "2023";

package roster;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "app/me.proto";
import "roster/payday/holder.proto";


// What this app adds to the generated contract for `Holder`.
//
// An overlay may only **add**, and that is a rule this file keeps rather than
// one anything enforces. It used to say generation refuses an overlay that
// redeclares something payday generated; it does not. `protobuf-merge` matches
// rpcs by name and emits the **overlay's** request, response and body, payday
// invokes it without `Strict`, and the conflict kinds it can report cover
// fields and editions and not rpcs at all -- so redeclaring `Get` here would
// replace it, silently, and nothing anywhere would say so.
//
// It is written down rather than worked around because the fix belongs
// upstream. See PLAN.md.
service HolderService {
  // Update is the narrow write, and the one a caller is given.
  //
  // `Patch` and `Apply` write anything the schema holds, which is why they are
  // closed at the transport unless a deployment says otherwise -- *what a
  // caller may change, and under what conditions, is not something a general
  // write can be told*.
  //
  // This can be told. Two fields, both of them things a holder carries about
  // itself and neither of them anything the wall, the trail or a permission
  // reads: what a person is called, and whatever the app that put it there
  // keeps. Nothing here can move somebody between tenants, rename them into
  // somebody else's alias, or change what they may do.
  //
  // It is on `HolderService` rather than in a service of its own because it is
  // a write on a holder, and a second service would be one more name for the
  // same rows. The overlay mechanism exists for exactly this and nothing had
  // used it.
  rpc Update(HolderUpdateRequest) returns (Holder);

  // Disable stops somebody signing in, and leaves their rows where they are.
  //
  // Its own method rather than a field on `Update`, because it is not a thing
  // a holder carries about itself -- it is somebody else's decision about them,
  // and roles are lists of methods, so a separate name is the only way a
  // deployment can grant one without granting the other.
  rpc Disable(HolderDisableRequest) returns (Holder);

  // Enable is the other direction, and is a second method for the same reason
  // the first is one: what a role may do is what it names.
  rpc Enable(HolderEnableRequest) returns (Holder);

  // Invalidate voids everything issued before now.
  //
  // No time is taken and none can be. A caller who could write an older value
  // could un-revoke; one who could write a future value could shut somebody out
  // of a deployment with no way to say so. The server stamps it, which is also
  // what makes it monotonic, which is what makes a duplicate a no-op and a
  // missed message a matter of latency rather than correctness.
  //
  // There is no undo, by construction. That is the point rather than an
  // omission: this is what a password reset and a "sign me out everywhere"
  // button both do, and a credential that can be brought back is not revoked.
  rpc Invalidate(HolderInvalidateRequest) returns (Holder);

  // SignsIn answers how somebody signs in, without the verifier.
  //
  // # Why it cannot be read any other way
  //
  // `CredentialService` is not registered at all, because its generated `Get`
  // answers with the verifier (D13). And `IdentityService` narrows by the
  // **tenant**, so an operator's list of one person's identities is that whole
  // tenant's, filtered in the app -- which is the leak D17 named and D23 exists
  // to remove.
  //
  // # Why it is not MeService
  //
  // `MeService` takes nothing, which is the property that makes it safe to read
  // unwalled and the reason `cmd.Policy` waives a binding for it. This takes a
  // subject, so it is the ordinary question with the ordinary answer: behind
  // the wall, and needing a role that names it.
  //
  // It is on `HolderService` and not a service of its own for `Update`'s
  // reason: it is a read of a holder, and a second service would be a second
  // name for the same rows.
  rpc SignsIn(HolderSignsInRequest) returns (HolderSignsInResponse);

  // RevokeKey ends one key of one person's.
  //
  // Beside `SignsIn` for the same reason it is: `ApiKeyService` is unregistered
  // everywhere, so there is no served road to a key row at all -- and a screen
  // that lists somebody's keys and cannot end one is a screen that sends an
  // operator to a shell, which is what `roster key revoke` is and which reaches
  // only the **deployment's** own `rk_` keys.
  //
  // A *which* within a *whose*: the reference says the person, the identifier
  // says the key, and one that is not theirs is `NotFound`. So this cannot be
  // used to ask whether a key exists, and cannot be pointed past the wall the
  // reference is narrowed by.
  //
  // Its own method rather than a field on `Update`, for the reason `Disable`
  // and `Enable` are two: a role is a list of methods, so a deployment can only
  // hand out what it can name -- and *may see how somebody signs in* is a
  // different grant from *may take a way in away*.
  rpc RevokeKey(HolderRevokeKeyRequest) returns (HolderRevokeKeyResponse);
}

message HolderRevokeKeyRequest {
  // Whose.
  HolderRef ref = 1;

  // Which, by the identifier `SignsIn` answers with.
  bytes id = 2;
}

message HolderRevokeKeyResponse {}

message HolderSignsInRequest {
  HolderRef ref = 1;
}

message HolderSignsInResponse {
  // The same shapes `MeService` answers with, deliberately. Two of them saying
  // one thing would be two that drift, and the drift would be between what a
  // person sees about themselves and what an operator sees about them.
  repeated SignInIdentity identities = 13;
  repeated SignInCredential credentials = 14;

  // And the keys that act as them, which `MeService` does not answer with.
  //
  // That asymmetry is deliberate rather than an omission. A person reading
  // their own record is looking at what **they** sign in with; a key is
  // something a machine of theirs holds, and the screen that lists one is the
  // screen that revokes it -- which is an operator's, on the port with no wall.
  // If a self-service version is wanted later it is a different decision with a
  // different reason, and `me.proto` is where it would be argued.
  repeated SignInKey keys = 15;
}

message HolderDisableRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Update` takes it.
  google.protobuf.Timestamp date_updated = 13;
}

message HolderEnableRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderInvalidateRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderUpdateRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read. A
  // write against a row that has moved is refused rather than applied to
  // whatever it became.
  google.protobuf.Timestamp date_updated = 13;

  // Replaced **whole**, both of them, which is the shape each was chosen for:
  // one fact from one moment, whatever last told us. Sending neither changes
  // neither.
  Profile profile = 9;
  google.protobuf.Any data = 10;
}
