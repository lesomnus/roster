edition = "2023";

package roster;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "app/me.proto";
import "roster/payday/holder.proto";


// What this app adds to the generated contract for `Holder`.
//
// An overlay may only **add**, and generation refuses one that does not --
// since `lesomnus/payday@15a0e47`, which compares each rpc against the
// contract as merged so far. It matters because the failure it closes is
// silent in the worst way: `protobuf-merge` matches rpcs by name and emits the
// **overlay's** request, response and body, so redeclaring `Get` here would
// have *replaced* it -- the file compiles, the tests that call it pass, and
// what is gone is the wall, the trail and the narrowing that stood behind the
// name. An overlay whose name matches no contract is reported too
// (`@a06360f`); it used to merge nothing and generate cleanly.
service HolderService {
  // Update is the narrow write, and the one a caller is given.
  //
  // `Patch` and `Apply` write anything the schema holds, which is why they are
  // closed at the transport unless a deployment says otherwise -- *what a
  // caller may change, and under what conditions, is not something a general
  // write can be told*.
  //
  // This can be told. Two fields, both of them things a holder carries about
  // itself and neither of them anything the wall, the trail or a permission
  // reads: what a person is called, and whatever the app that put it there
  // keeps. Nothing here can move somebody between tenants, rename them into
  // somebody else's alias, or change what they may do.
  //
  // It is on `HolderService` rather than in a service of its own because it is
  // a write on a holder, and a second service would be one more name for the
  // same rows. The overlay mechanism exists for exactly this and nothing had
  // used it.
  //
  // # A picture somewhere else takes the portrait away
  //
  // `profile.picture` and `portrait` are one picture in two forms: where it
  // is, and roster's copy. A profile naming a **different** picture leaves the
  // copy depicting the old one, and a screen that prefers the copy -- because
  // it needs no fetch -- would go on drawing the picture somebody just
  // replaced. So a write that changes `profile.picture` clears `portrait`, and
  // the URL is checked when it changes: https, which a page fetches as it is
  // and which no page can run. A value written before that rule is left alone
  // until somebody changes it.
  rpc Update(HolderUpdateRequest) returns (Holder);

  // Realias changes what a person is written as: `@contoso/alice` becomes
  // `@contoso/alice-kim`.
  //
  // # Why it is not a field on Update
  //
  // `Disable`'s reason, one row over. Roles are lists of methods, so a separate
  // name is the only way a deployment can grant one without granting the other
  // -- and these two are not the same permission at all. `Update` writes what a
  // holder carries about itself and nothing the wall, the trail or a permission
  // reads. This writes the **index**: `(alias, tenant)` is what every reference
  // resolves through, so a caller who may change it can make a script, a
  // bookmark and somebody else's runbook stop finding a person.
  //
  // # Why not Rename
  //
  // Because a `Holder` has three things that look like a name -- `alias`, which
  // is this; `name`, which is set on `Add` and which nothing may change; and
  // `profile.display_name`, which is what `Update` writes and what a console
  // draws. An operator reading `Rename` in a role's method list would grant it
  // meaning the last of those, and get the first. The ugly name is the point.
  //
  // # The old alias is not held
  //
  // It comes free the moment this returns, and somebody else may take it. That
  // is deliberate and it is the same answer soft erasure already gives: the
  // index covers the rows that are still here, so an erased holder's alias is
  // free too.
  //
  // What follows is that `@contoso/alice` may later be a **different person**,
  // and nothing about the first one changes -- their `Holder.id` is what a
  // token carries and what the trail names, and it did not move. An alias is a
  // convenience for people typing; the reference is the identifier. Holding the
  // old one instead would mean a name can never be reused, which is a second
  // trap rather than a fix for the first.
  rpc Realias(HolderRealiasRequest) returns (Holder);

  // Disable stops somebody signing in, and leaves their rows where they are.
  //
  // Its own method rather than a field on `Update`, because it is not a thing
  // a holder carries about itself -- it is somebody else's decision about them,
  // and roles are lists of methods, so a separate name is the only way a
  // deployment can grant one without granting the other.
  rpc Disable(HolderDisableRequest) returns (Holder);

  // Enable is the other direction, and is a second method for the same reason
  // the first is one: what a role may do is what it names.
  rpc Enable(HolderEnableRequest) returns (Holder);

  // Invalidate voids everything issued before now.
  //
  // No time is taken and none can be. A caller who could write an older value
  // could un-revoke; one who could write a future value could shut somebody out
  // of a deployment with no way to say so. The server stamps it, which is also
  // what makes it monotonic, which is what makes a duplicate a no-op and a
  // missed message a matter of latency rather than correctness.
  //
  // There is no undo, by construction. That is the point rather than an
  // omission: this is what a password reset and a "sign me out everywhere"
  // button both do, and a credential that can be brought back is not revoked.
  rpc Invalidate(HolderInvalidateRequest) returns (Holder);

  // SignsIn answers how somebody signs in, without the verifier.
  //
  // # Why it cannot be read any other way
  //
  // `CredentialService`'s generated reads are shut a method at a time, because
  // its `Get` answers with the verifier (D13). And `IdentityService` narrows by
  // the **tenant**, so an operator's list of one person's identities is that
  // whole tenant's, filtered in the app -- which is the leak D17 named and D23
  // exists to remove.
  //
  // # Why it is not MeService
  //
  // `MeService` takes nothing, which is the property that makes it safe to read
  // unwalled and the reason `cmd.Policy` waives a binding for it. This takes a
  // subject, so it is the ordinary question with the ordinary answer: behind
  // the wall, and needing a role that names it.
  //
  // It is on `HolderService` and not a service of its own for `Update`'s
  // reason: it is a read of a holder, and a second service would be a second
  // name for the same rows.
  rpc SignsIn(HolderSignsInRequest) returns (HolderSignsInResponse);

  // Reaches is what somebody may call, as the gate would decide it -- the same
  // answer `MeService.Get` gives about the caller, about somebody else.
  //
  // # Why it is the policy's function and not a read of the parts
  //
  // Every part is readable: their bindings, the groups carrying bindings, the
  // roles held in teams. What is not readable is the **union**, and a console
  // that added the parts up would be a second implementation of `gate.Policy`,
  // drifting from the one that enforces it -- `cmd/policy.go` records three
  // readers of one set disagreeing. So this asks the function the gate asks,
  // handed to the layer as `core.Rules.Held`, and answers with **patterns**
  // rather than an expansion, for `MeService.Get`'s reason: an expansion is the
  // methods that exist in whichever replica answered.
  //
  // # What it is not guarded by, and why
  //
  // The wall, and nothing else. A role naming this reads anybody's reach in the
  // tenant, which is RBAC as it is (CLAUDE.md, *no self-only twin of a verb*)
  // -- and it reveals nothing `BindingService.List`, `GroupMembershipService.
  // List` and `TeamMembershipService.List` do not already answer to the same
  // caller, only added up. A rule that narrowed it by the caller's own reach
  // would be an object rule over a read, which is a shape roster has not taken
  // and does not need here.
  //
  // # A suspended holder reaches nothing
  //
  // Their bindings stay, and so would an answer read off them -- but the gate
  // refuses every credential of theirs before it asks what they hold, so what
  // it would decide is nothing, and that is what this says. An app checking a
  // token roster never sees (an SSO ID token, good for its hour) has only this
  // to learn the person was suspended from.
  rpc Reaches(HolderReachesRequest) returns (HolderReachesResponse);

  // Search finds people by what is known about them -- a fragment of a name
  // or an alias, a department, an employee number -- which is the question a
  // directory answers and `List` cannot: a list filters by **where** somebody
  // is (a tenant, a site, a team) and never by who they are.
  //
  // Walled and paged like `List`, and built on it: the rows a caller may see
  // are the rows searched, so a customer's key finds nobody in another
  // customer, and the cursor is `List`'s own, naming the last row answered.
  // What it reads is the row -- alias, name, the profile -- and not an
  // address: an address is looked up exactly, through `Email.Get`, because
  // "who has this mailbox" has one answer and a fragment of one is a way to
  // enumerate them.
  rpc Search(HolderSearchRequest) returns (HolderSearchResponse);

  // Fill writes what a provider said about somebody into what their profile
  // does not have yet, and nothing else: a display name where there is none,
  // and a picture for somebody who has none.
  //
  // # Why it is not Update
  //
  // `Disable`'s reason, and here it is the whole point. The front door that
  // signs somebody in through a directory is the one part of a deployment
  // holding what that directory says about them, and `Update` would let it
  // replace anybody's profile with whatever a directory claims. This is the
  // grant that cannot. It writes nothing over a value somebody chose, so a
  // name a person corrected stays corrected and a picture they picked stays
  // theirs -- and taking a value away is how somebody asks for the
  // directory's again, at their next sign-in.
  //
  // # Why it answers so little
  //
  // Which blanks are left, and not the row: a grant that filled blanks and
  // answered with what it filled would be `Get` under another name,
  // tenant-wide. Two bits are what a front door needs to decide whether to
  // ask anybody at all -- a directory for a photograph, a workspace for a
  // name -- which is a request it should not make at every sign-in for an
  // answer nobody will keep.
  rpc Fill(HolderFillRequest) returns (HolderFillResponse);

  // Portray keeps an image as somebody's picture, or takes their picture
  // away.
  //
  // # Why it is not a field on Update
  //
  // It is not handed a value to store. It is handed an image, and roster
  // makes the sizes it keeps -- so what is written is roster's work, which
  // nothing `Update` writes ever is, and its size is roster's to bound rather
  // than the caller's.
  //
  // # It clears `profile.picture`
  //
  // `Update`'s rule, from the other side: the picture is one thing, and once
  // it is this image a URL saying where some other picture is describes
  // somebody else's. So this writes the profile's `picture` empty, and takes
  // the version it was read under, as `Update` does.
  rpc Portray(HolderPortrayRequest) returns (Holder);

  // Provision makes somebody a directory says exists: the person, their
  // identity at the connection that directory provisions through, and their
  // address -- in one write, or none of it.
  //
  // # Why it is not `Add`, `Identity.Add` and `Email.Add`
  //
  // Those three are each a grant somebody holds on its own, and two of them
  // are ways into an account. A key holding `Identity.Add` may link a provider
  // account to **anybody** who holds no more than its holder does -- and
  // `Core.mayReach` answers yes for everybody who holds nothing, which is
  // most people. A directory's key, reachable from the internet so the
  // directory can call it, would be a way into all of them.
  //
  // This writes ways in only into the person it makes in the same breath, who
  // holds nothing and has no other way in. So a key that holds this and none
  // of those three can make people, and cannot reach anybody who already
  // exists -- which is the whole of what a directory provisioning people
  // needs, and nothing it does not.
  //
  // # What it is held to
  //
  // The connection must be the one the tenant provisions through
  // (`Connection.provisions`), the subject is held to that connection's claim
  // as `Identity.Add` holds it, and the address is written **unverified**: a
  // verified address is where a recovery link goes, and `Email.Attest` with a
  // stamp takes an address somebody else holds unproved. A taken address, or a
  // taken subject, refuses the whole of it.
  rpc Provision(HolderProvisionRequest) returns (Holder);

  // Deactivate suspends somebody on their directory's word: `inactive`, or
  // `deleted`, which the directory will not ask about again.
  //
  // # Why it is not `Disable`
  //
  // Because the directory may lift what it put there and nothing else
  // (`Holder.directory`), and one verb for both could not say whose a
  // suspension is. A suspension already an operator's stays theirs.
  //
  // Held to people the directory speaks for: somebody with an identity at the
  // connection the tenant provisions through.
  rpc Deactivate(HolderDeactivateRequest) returns (Holder);

  // Activate lifts a suspension the directory made, and only that one.
  //
  // An operator's suspension is refused, and so is somebody the directory
  // deleted: it said they are gone, and bringing them back is an operator's.
  rpc Activate(HolderActivateRequest) returns (Holder);
}

message HolderProvisionRequest {
  TenantRef tenant = 1;

  // What roster calls them. Taken already, a suffix is added, as a sign-in
  // that enrols somebody adds one.
  string alias = 2 [features.field_presence = IMPLICIT];
  string name = 3 [features.field_presence = IMPLICIT];
  Profile profile = 4;

  // Which connection, by name, and what it calls them: the identity a
  // sign-in through it will find. It must be the connection the tenant
  // provisions through.
  string provider = 5 [features.field_presence = IMPLICIT];
  string subject = 6 [features.field_presence = IMPLICIT];

  // Their address, lowercased and trimmed, written unverified. Empty is none.
  string address = 7 [features.field_presence = IMPLICIT];
}

message HolderDeactivateRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Disable` takes it.
  google.protobuf.Timestamp date_updated = 13;

  // The directory deleted them, rather than said they are inactive.
  bool deleted = 2 [features.field_presence = IMPLICIT];
}

message HolderActivateRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderFillRequest {
  HolderRef ref = 1;

  // What the provider calls them, for a profile with no display name.
  string display_name = 8 [features.field_presence = IMPLICIT];

  // Where the provider keeps their picture, when that is somewhere a browser
  // fetches as it is: an https URL. Written beside the portrait `image` makes,
  // or alone when there is no image roster would keep -- and only for somebody
  // with no picture, as the image is.
  string picture = 9 [features.field_presence = IMPLICIT];

  // The picture itself, as the provider handed it over: JPEG, PNG, GIF or
  // WebP, rendered as `Portray` renders one.
  bytes image = 10 [features.field_presence = IMPLICIT];
}

message HolderFillResponse {
  // They have no picture after this call -- no `profile.picture` and no
  // `portrait` -- so an image handed over now would be kept.
  bool pictureless = 1 [features.field_presence = IMPLICIT];

  // They have no display name after this call, so a name handed over now
  // would be kept.
  bool nameless = 2 [features.field_presence = IMPLICIT];
}

message HolderPortrayRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Update` takes it: this replaces their picture and
  // clears the profile's URL, so it is a write against what the caller read.
  google.protobuf.Timestamp date_updated = 13;

  // JPEG, PNG, GIF or WebP, at most 2 MiB and 4096 pixels a side. Empty takes
  // their picture away.
  bytes image = 8 [features.field_presence = IMPLICIT];
}

message HolderSearchRequest {
  // Where to look, the way `List` is told: none is everywhere the caller may
  // see, and a site or a team narrows to who is in it.
  repeated HolderFilter filters = 1;

  // A fragment, matched without regard to case against the alias, the name
  // and the profile's display name. At least one of the three below must be
  // given: a search for nothing is a `List`.
  string q = 8;

  // Exact, when given.
  string department = 9;
  string employee_no = 10;

  // As `List` takes them: how many, and where to carry on from.
  int32 size = 2 [features.field_presence = IMPLICIT];
  string after = 3 [features.field_presence = IMPLICIT];
}

message HolderSearchResponse {
  repeated Holder items = 1;

  // What to ask for next, and empty when this was the last of them.
  string next = 2 [features.field_presence = IMPLICIT];
}

message HolderReachesRequest {
  HolderRef ref = 1;
}

message HolderReachesResponse {
  // The patterns, as the roles wrote them, in the shape `frame.Covers` reads
  // and `covers()` reads in the browser. Not expanded.
  repeated string methods = 10;

  // The sites their bindings and teams name; empty with `every_site` false is
  // somebody narrowed to nothing.
  repeated bytes sites = 11;

  // A binding with no site is the tenant's whole width.
  bool every_site = 12;

  // The patterns held **across the whole tenant**: through a binding with no
  // site, and not a role held in a team. What an app with no sites of its own
  // grants on.
  //
  // `methods` is the union the gate asks -- *may they ever call this* -- and the
  // wall then narrows the rows a site-bound or team-bound grant reaches. An app
  // that has no such wall (kamino, khala: their tenants are customers, not a
  // site of this one) cannot narrow, and reading `methods` it handed somebody
  // bound at one site everything, everywhere. This is the part that needs no
  // narrowing.
  repeated string everywhere = 13;
}

message HolderSignsInRequest {
  HolderRef ref = 1;
}

message HolderSignsInResponse {
  // The same shapes `MeService` answers with, deliberately. Two of them saying
  // one thing would be two that drift, and the drift would be between what a
  // person sees about themselves and what an operator sees about them.
  repeated SignInIdentity identities = 13;
  repeated SignInCredential credentials = 14;

  // And the keys that act as them, which `MeService` does not answer with.
  //
  // That asymmetry is deliberate rather than an omission. A person reading
  // their own record is looking at what **they** sign in with; a key is
  // something a machine of theirs holds, and the screen that lists one is the
  // screen that revokes it -- which is an operator's, on the port with no wall.
  // If a self-service version is wanted later it is a different decision with a
  // different reason, and `me.proto` is where it would be argued.
  repeated SignInKey keys = 15;
}

message HolderDisableRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Update` takes it.
  google.protobuf.Timestamp date_updated = 13;
}

message HolderEnableRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderInvalidateRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderRealiasRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read.
  google.protobuf.Timestamp date_updated = 13;

  // The new one, on the field number it lands in. Refused if it is not an
  // alias, and refused if somebody in this tenant already has it -- both by
  // rules that were there before this method was, which is most of why this is
  // a narrow write rather than a special case.
  string alias = 4;
}

message HolderUpdateRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read. A
  // write against a row that has moved is refused rather than applied to
  // whatever it became.
  google.protobuf.Timestamp date_updated = 13;

  // Replaced **whole**, both of them, which is the shape each was chosen for:
  // one fact from one moment, whatever last told us. Sending neither changes
  // neither.
  Profile profile = 9;
  google.protobuf.Any data = 10;
}
