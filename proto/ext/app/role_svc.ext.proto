edition = "2023";

package roster;

import "app/role.proto";

// What this app adds to the generated contract for `Role`.
//
// # Why a Widen and a Narrow, and not the Patch
//
// `Patch` writes anything the schema holds and is closed at the transport for
// it (`grpcx.GeneralWrite`), so a role written over the wire could be made and
// never changed: an app that wrote its default roles into a tenant had no way
// to give them a method it added in its next release, and a tenant's
// administrator no way to take one out of a role, short of a shell on roster's
// box (`roster role patch`).
//
// Opening `Patch` would have opened every column of the row with it -- the
// alias other rows are found by, the labels a declared row is told apart by --
// and one rule for two acts that are not alike. Adding a method hands it to
// everybody the role reaches, and is a grant; taking one out hands out nothing
// and stops people doing what they did, which is a denial of service and not
// an escalation (`escalate.go`). So each is a verb of its own with the rules
// it needs: what an app does to a role it shipped, unattended, is **add**, and
// never take away -- a tenant that narrowed a role it was given has decided
// something -- and what a tenant does in its console is either, one method at
// a time.
//
// They are the entity's own verbs and not a service beside it (CLAUDE.md,
// *Overlay before service*): each reads and writes one `Role` row.
service RoleService {
  // Widen adds methods to a role and takes none away.
  //
  // A method already in the role, or covered by a pattern already in it
  // (`frame.Covers`), is not added: it would grant nothing more, and taking
  // the wider pattern out later should take it too. Nothing new is no write,
  // and answers the role as it is -- so an app may send what it wants a role
  // to hold at every upgrade, and the role changes only when there was
  // something to add.
  //
  // Held to the rules `Patch` is held to, because it is one (`server/core`):
  // the role's whole list, as it would be, must be the caller's to grant where
  // the role may be bound (`escalate.go`), and a role a deployment declared is
  // nobody's to widen (`declared.go`). So an app that widens the roles it
  // ships holds every method it puts in them -- its own package's pattern, in
  // the role it was installed with (`docs/apps.md`).
  rpc Widen(RoleWidenRequest) returns (Role);

  // Narrow takes methods out of a role and adds none.
  //
  // An entry of the role is taken out when one of `methods` covers it -- the
  // same spelling, or a pattern over it -- so narrowing by
  // `/loft.AssetService/*` takes every method of that service the role names.
  // A method named that an entry left in the role still covers is refused, and
  // nothing is written: narrowing a role holding `/loft.*/*` by
  // `/loft.AssetService/Get` would leave it reaching what was named, which is
  // the one answer a caller asking to take something away must not be given
  // as a success. Nothing to take out is no write, and answers the role as it
  // is.
  //
  // Three rules (`server/core/narrow.go`). Nobody takes away what they could
  // not have given: every entry taken out must be the caller's to grant where
  // the role may be bound, so somebody who holds less than a role cannot strip
  // it below them -- and then reset the password of whoever it was bound to,
  // since they would no longer hold more. A role a deployment declared is
  // nobody's to narrow. And a tenant is not left without somebody
  // administering it: a narrowing that takes `/roster.*/*` from the last
  // person holding it across the tenant is refused.
  rpc Narrow(RoleNarrowRequest) returns (Role);

  // HandsOver says which of a list of methods hand over more than they read
  // as, where they would be held: what a page says beside a role before it is
  // bound, widened, or put on a key.
  //
  // A role is a list of method names, and most of them mean what they say.
  // `docs/usage/wide-grants.md` is the ones that do not -- *may send recovery
  // links* is every account of the tenant -- and this is that page asked of
  // one list, in its words. Nothing in a role's row says which of its methods
  // are these, and a page that wanted to say so had the list to copy: a second
  // one, in every product's own administration, a release behind the first.
  //
  // # Why it is `RoleService`'s, and reads no row
  //
  // What it is asked about is what `Role.methods` holds, written as `Widen`
  // and `Narrow` take it. It takes the list and not a `RoleRef` because the
  // moment worth saying it at is before the write: a role being drafted has no
  // row, a role about to be widened is not yet what it would be, and a key's
  // list is no role's at all. Whoever asks holds the row they are asking about
  // or is about to write it, so they send its methods.
  //
  // # What it answers by
  //
  // The methods, where they would be held (`held`), and which plane was asked:
  // a role of this deployment's own is exercised in every tenant, at
  // `admin.addr` and by a deployment's key, and is told so. Never by who is
  // asking -- it reads nothing of anybody, and answers every caller alike.
  //
  // It says and does not refuse. Each of these is a grant somebody has a
  // reason to make; a write that would not go through until it was said to be
  // meant is another decision (#310).
  //
  // # What it does not answer
  //
  // Three entries of that page are not about a method, and whoever is making
  // one of them knows it without asking: a role bound to a **group** is its
  // manager's to give out whatever it names, and a deployment's key and a
  // directory's are kinds of key.
  rpc HandsOver(RoleHandsOverRequest) returns (RoleHandsOverResponse);
}

message RoleWidenRequest {
  RoleRef ref = 1;

  // What to add: whole method names or patterns, as `Role.methods` takes
  // them. At least one.
  repeated string methods = 8;
}

message RoleNarrowRequest {
  RoleRef ref = 1;

  // What to take out: whole method names or patterns, each taking out every
  // entry it covers. At least one.
  repeated string methods = 8;
}

// RoleHeld is where a role's methods are held, which is what decides who a
// grant reaches (`docs/usage/rules.md`, *Where a grant reaches*).
enum RoleHeld {
  // Not said, and read as across the tenant: the widest, so that what was not
  // said is never under-told.
  ROLE_HELD_UNSPECIFIED = 0;

  // A binding that names no site.
  ROLE_HELD_ACROSS_THE_TENANT = 1;

  // A binding that names a site, or a role held in a team, which reaches the
  // people of the team's site.
  ROLE_HELD_IN_A_SITE = 2;

  // The tenant's `self-service` role: bound to nobody, and held by everybody
  // over what is their own.
  ROLE_HELD_NOWHERE = 3;
}

message RoleHandsOverRequest {
  // The methods, whole names or patterns, as `Role.methods` takes them: a
  // role's as it is or as it would be, or a key's. At least one.
  repeated string methods = 8;

  // Where they would be held.
  RoleHeld held = 9 [features.field_presence = IMPLICIT];
}

message RoleHandsOverResponse {
  // One for each grant the methods reach, in the order of the page, or one
  // alone where a method is all of roster. Empty is a list that means what it
  // says.
  repeated RoleHandedOver grants = 8;
}

// RoleHandedOver is one grant that hands over more than it reads as.
message RoleHandedOver {
  // Which one: the anchor of its heading in `docs/usage/wide-grants.md`, which
  // does not change when its sentences do. What a page links to, and what it
  // keys a sentence of its own by.
  string grant = 4 [features.field_presence = IMPLICIT];

  // Its own methods that those asked about cover, by their whole names: a
  // pattern is not what the grant reads as, so `/roster.CredentialService/*`
  // is answered `CredentialService/Issue`, `/Enrol` and `/Unlock` here. For
  // the grant that is a pattern (`a-pattern`), the patterns asked about, as
  // they were written. A method that covers every grant of the page --
  // `/roster.*/*` -- is answered that one grant alone, which says how many
  // others it holds.
  repeated string methods = 8;

  // What it reads as: *may send recovery links*.
  string reads_as = 9 [features.field_presence = IMPLICIT];

  // What it is, where it would be held: *every account of the tenant*.
  string hands_over = 10 [features.field_presence = IMPLICIT];
}
