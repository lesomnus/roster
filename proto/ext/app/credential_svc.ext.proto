edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";
import "roster/payday/holder_svc.g.proto";

// What this app adds to the generated contract for `Credential`.
//
// # Why a Credential grows methods instead of a VouchService growing them
//
// `Vouch.Set` was `Credential.Add` with a hash, and `Vouch.Unlock` was
// `Credential.Patch` clearing two columns -- a verbose second name for rows
// that already had a service. The rule now (CLAUDE.md, *Overlay before
// service, layer before overlay*): a new verb on one entity's rows is an
// overlay here, and hashing a secret on the way in is a layer in `server/core`.
// What stays a service of its own is the sign-in **flow** -- Verify, Delegate,
// Continue, Accept -- which mints and spends tokens across several entities and
// runs before anybody is resolved.
//
// # The service is served, but its verifier never travels
//
// D13's reason `CredentialService` was closed is its generated `Get`, which
// answers with the `secret` column. Reopening it does not undo that: `cmd/serve`
// registers the service but closes `Get`/`List`/`Watch`/`Add` by method, so
// only these overlays reach the wire, and none of them answers with a stored
// verifier. A cleared field is a column an answer omits; a method that is not
// served cannot answer at all -- both hold here.
//
// # There is no self-only verb here, on purpose
//
// A person changing their own password or adding their own factor calls `Set`
// and `Enrol` with their own reference -- the same verbs an operator calls
// about somebody else. RBAC stays what it is: a role grants a method, and the
// rule about *whose* row is a layer (`mayReach` in `server/core`: yourself
// always, anybody no wider than you, nobody wider). A `ChangeMine`/`EnrolMine`
// pair existed for one increment and was folded back: a self-only twin of a
// verb is a second name for the same rows, which is the thing this file's
// first paragraph is against, and the app that serves a person is the layer
// that passes only their reference. What the pair had that was worth keeping
// -- proving the current password before your own is replaced -- is `Set`'s
// rule for your own row now; see `current`.
service CredentialService {
  // Unlock opens an account too many wrong answers closed, without touching the
  // secret. Whose credential it is, by reference -- an operator naming somebody
  // they already know, so no sign-in form and no email lookup (that stays with
  // the recovery flow). Held to `mayReach`: you may unlock nobody whose
  // permissions are not a subset of your own, because a lockout you can clear
  // is a lockout you could also have caused.
  //
  // A name of its own rather than a `Patch` field: a role is a list of methods,
  // so "may open a locked account" is grantable only by being nameable, apart
  // from "may rewrite the row". The same argument `HolderService.Enable` makes.
  rpc Unlock(CredentialUnlockRequest) returns (CredentialUnlockResponse);

  // Set writes somebody's secret to the one given, hashing it. The operator
  // write `Vouch.Set` was, now on the entity, named by a reference rather than
  // a sign-in form -- the email/address addressing stays with the recovery
  // flow, which is where the Email lookup belongs.
  //
  // It hashes because it compares (D14): the caller sends plaintext, the layer
  // chooses the argon2 parameters. Refused for a secret in the leaked corpus,
  // and held to `mayReach` -- writing a secret is a way to become somebody, so
  // you may write nobody's whose permissions are not a subset of your own.
  //
  // A first password and a rotation are one call: absent, it is added; present,
  // it is replaced and the lockout cleared, because somebody who set it is not
  // who the lockout was protecting against.
  //
  // # Your own row asks for `current`
  //
  // When `ref` is the caller, the password held now must come with the new one
  // and is verified first. That is what keeps a credential which merely *acts
  // as* somebody -- a key pasted into a build log, a delegation lifted from an
  // app -- from changing their password: it can act as them and still not know
  // the one it would be replacing. The guarantee does not depend on **how** the
  // caller authenticated, which is deliberate: payday keeps the auth method
  // for the log and refuses to let a rule turn on it, so the proof lives in the
  // request. A wrong `current` counts as a failed sign-in, with the same
  // lockout, so it cannot be guessed at any faster than a password can.
  //
  // A first password of your own (nothing to verify against) is refused: it is
  // set *for* somebody by an operator or the recovery flow, because a bearer
  // setting a first password with nothing to prove is the takeover this
  // closes. Naming somebody else with `current` set is refused too -- an
  // operator does not know it and must not be asked for it.
  rpc Set(CredentialSetRequest) returns (CredentialSetResponse);

  // Enrol makes a second factor and answers with it once. The write `Vouch.Enrol`
  // was, on the entity: a `totp` seed roster generates, wraps and answers with
  // exactly once, or a `webauthn` public key an authenticator made and roster
  // was handed. Named by a reference, like every other write here -- a person
  // adding a factor to their own account, or an operator to somebody they may
  // reach.
  //
  // A password is not this: that is `Set` or `Reset`, and neither is a thing a
  // phone or a key holds. The kind check refuses one the same way `Set` refuses
  // a second factor, from opposite ends of the one line `vouch.Settable` draws.
  //
  // It does not count until it is proved: the row goes in with its step at zero,
  // and one `Verify` has to pass before the factor is offered at a sign-in. So a
  // mis-scanned QR is a thing somebody discovers now rather than when they are
  // already half in and cannot finish.
  rpc Enrol(CredentialEnrolRequest) returns (CredentialEnrolResponse);
}

message CredentialUnlockRequest {
  // Whose credential, by reference -- an id or `@tenant/alias`. Not a sign-in
  // form: this is an operator naming somebody they know.
  HolderRef ref = 1;

  // Which credential; empty is the password.
  string kind = 2 [features.field_presence = IMPLICIT];
}

message CredentialUnlockResponse {
  // What it was locked until, or unset if it was not locked -- so an operator
  // can tell "I opened it" from "it was not closed".
  google.protobuf.Timestamp was_locked_until = 1;
}

message CredentialSetRequest {
  // Whose credential, by reference -- an id or `@tenant/alias`. Not a sign-in
  // form: an operator names somebody they already know.
  HolderRef ref = 1;

  // Which credential; empty is the password. A second factor is Enrol.
  string kind = 2 [features.field_presence = IMPLICIT];

  // The secret as typed. Hashed here, never stored as given.
  bytes secret = 3;

  // The password held now -- **required when `ref` is yourself**, verified
  // before `secret` is written, and refused when `ref` is somebody else. See
  // the method.
  bytes current = 4;
}

message CredentialSetResponse {}

message CredentialEnrolRequest {
  // Whose account the factor is for, by reference -- an id or `@tenant/alias`.
  HolderRef ref = 1;

  // "totp" or "webauthn". A password is `Set` or `Reset`; refused here.
  string kind = 2 [features.field_presence = IMPLICIT];

  // What they call it, when there is more than one to tell apart. Empty is the
  // only one of its kind.
  string name = 3 [features.field_presence = IMPLICIT];

  // What the authenticator app shows in its list -- the deployment's name, so a
  // person with accounts at two operators can tell the entries apart. `totp`
  // only.
  string issuer = 4 [features.field_presence = IMPLICIT];

  // The browser's answer for `webauthn`, an envelope carrying the relying-party
  // id, the origins and the challenge beside the response, since the response
  // alone is not checkable. Nothing for `totp`, which makes its own secret; a
  // request carrying both has not decided which ceremony it is doing.
  bytes attestation = 5;
}

message CredentialEnrolResponse {
  // The `totp` seed, base32, uppercase and unpadded -- the only time it is
  // readable. Empty for `webauthn`, whose private half never left the
  // authenticator.
  string seed = 1 [features.field_presence = IMPLICIT];

  // The same seed as an `otpauth://` URI, for a QR code. Empty for `webauthn`.
  string uri = 2 [features.field_presence = IMPLICIT];
}

