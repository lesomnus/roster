edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";
import "app/connection.proto";

// What this app adds to the generated contract for `Connection`.
//
// # Why an Update and not the Patch
//
// `Patch` writes anything the schema holds and is closed at the transport for
// it (`grpcx.GeneralWrite`). What an operator changes about a provider is its
// configuration -- the issuer, the client id, the scopes, where the secret is
// -- and never its `name`, which `Identity.provider` and `MailDomain.provider`
// use to say *this* provider: a connection erased and added under a new name
// would make every person who arrives through it a stranger, silently. So the
// name is not here, and the rest can be told the way `Tenant.Update` is told.
service ConnectionService {
  // Update replaces a provider's configuration, under the version read.
  rpc Update(ConnectionUpdateRequest) returns (Connection);
}

message ConnectionUpdateRequest {
  ConnectionRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read.
  google.protobuf.Timestamp date_updated = 13;

  // Each replaced whole when present, and left as it is when absent. Scopes
  // have no presence: given, they replace; empty, they are left as they are,
  // the way `Tenant.Update` takes labels.
  string issuer = 8;
  string client_id = 9;
  repeated string scopes = 10;
  string secret_ref = 11;
  string desc = 6;
}
