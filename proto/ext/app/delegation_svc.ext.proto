edition = "2023";

package roster;

import "app/delegation.proto";
import "google/protobuf/timestamp.proto";
import "roster/payday/holder_svc.g.proto";

// What this app adds to the generated contract for `Delegation`.
//
// # Why a Delegation grows a verb instead of a VouchService keeping one
//
// `Vouch.Revoke` was `Delegation.Erase` said about a token rather than a row --
// a verb on delegation rows wearing the sign-in flow's clothes, and the sign-in
// flow is what mints one, not what ends it. The rule (CLAUDE.md, *Overlay
// before service, layer before overlay*): a new verb on one entity's rows is an
// overlay here. So it is `Revoke`, on the entity, and `VouchService` is left
// with the flow that proves somebody and mints for them.
//
// # The service is served, and its token never travels
//
// `DelegationService` was closed whole, for `CredentialService`'s reason one
// entity over: its generated `Get` answers with the `secret` column, and a
// delegation's secret is the token itself. What is served now is `Revoke` --
// a caller proves it holds a token by naming it, and is not handed one back
// -- and `Get`, `List` and `Erase`, because a person seeing where they are
// signed in and ending one is a read and a delete of these rows, and a curated
// copy on `MeService.Get` would have been a second name for them. The column
// stays in the store: the sink strips `(payday.field).secret` on the way out,
// on the direct road and through a batch, and `server/core` holds the rows to
// `mayReach`. `Add`, `Patch` and `Apply` stay shut by method -- a token nobody
// minted is not one.
service DelegationService {
  // Revoke ends a delegation before its expiry -- the delete D23 said a sign-out
  // has to be able to make.
  //
  // Everything answers the same: a token that was never here, one that has
  // expired, one somebody else was issued -- each succeeds and removes nothing,
  // which is `Erase`'s rule (*erasing what is not there succeeds*) and what
  // keeps the answer from telling whoever holds a found string whether it is
  // real, whose it is, or still alive. What a caller may rely on is that a
  // delegation **it** was issued is gone afterwards. A person ends one they
  // handed an app (`Issue`) by reference, with `Erase`.
  rpc Revoke(DelegationRevokeRequest) returns (DelegationRevokeResponse);

  // Exchange is a short-lived token naming the caller, for one other app in the
  // same tenant to check -- how one roster-hosted app proves who it is to
  // another (#74, `docs/apps.md`).
  //
  // # A delegation, issued to the receiver
  //
  // A delegation already says *who* (`holder`) and *who may present it*
  // (`issued_to`), and `TokenService/Introspect` already answers only the caller
  // it was issued to. So this mints one about the **caller** and issues it to
  // the **app** it names: Loft, narrowed to acme, asks for a token for
  // `@acme/levyan`; levyan, narrowed to acme too, introspects it and is told
  // `@acme/loft`. Nobody else is told anything -- Loft included -- and the
  // token is as good as a stranger's string to every caller but levyan.
  //
  // # Checked by roster, which is why roster may make it
  //
  // roster issues nothing a third party verifies without asking (CLAUDE.md,
  // *the other rule*). This is opaque, and the receiver asks: the same kind of
  // thing an `rt_` is.
  //
  // # Who may ask
  //
  // A holder: a person's credential, or a deployment key narrowed with
  // `roster-at` to the holder a tenant nominated for it. A deployment key as
  // itself is nobody in any tenant and is refused, and so is a caller acting
  // through a delegation (`roster-as`) -- minting from one would renew it. The
  // app is one of the caller's own tenant's holders, and not the caller:
  // a call across tenants is not something this can say, and a token for
  // yourself proves nothing to anybody.
  rpc Exchange(DelegationExchangeRequest) returns (DelegationExchangeResponse);

  // Issue is somebody handing an app a delegation of their own, and answers
  // the token once -- the verb `ApiKeyService/Issue` and
  // `CredentialService/Issue` are for their rows.
  //
  // # What it is for
  //
  // An app writes for a person through a delegation that person approved at
  // roster: it presents its own key in `authorization` and this token in
  // `roster-as`, and is answered **as the person**, within `methods`. So an
  // app's page that puts somebody into the app's group because its
  // administrator pressed the button is answered as that administrator, held
  // to what they hold, and the trail names them. What an app does for itself
  // it still does as itself.
  //
  // # The rules
  //
  // - **Whose**: one's own, and for anybody else the rule every write of a
  //   way in meets -- nobody writes a way into an account wider than their
  //   own. It is the person's own act, so the tenant's `self-service` role
  //   names it.
  // - **The app**: a holder of the same tenant, not erased, and not the
  //   person themselves. It is what the token is issued to (`issued_to`), so
  //   only that app's key presents it, and `TokenService/Introspect` answers
  //   it to that app alone.
  // - **The methods**: roster's, each one the person may call at all. The
  //   delegation narrows what they hold and adds nothing, since a call through
  //   it is answered as them; a method they hold nowhere is refused, naming
  //   it.
  // - **How long**: no later than `delegation.life` from now, a day unless the
  //   deployment says; none is that bound, and later is refused, saying it.
  //
  // It may be called through a delegation, as `ApiKeyService/Issue` is: that
  // is the road a person has to it from a browser; the app such a call came
  // through is not handed one by it. Its end, the app ending it (`Revoke`,
  // with the token), the person ending it (`Erase`, by reference), signing
  // out everywhere, a suspension and an erasure end it, as they end every
  // delegation of theirs.
  rpc Issue(DelegationIssueRequest) returns (DelegationIssueResponse);
}

message DelegationRevokeRequest {
  // The delegation to end, as it was handed over.
  string token = 1 [features.field_presence = IMPLICIT];
}

message DelegationRevokeResponse {}

message DelegationExchangeRequest {
  // Who the token is for: the holder the receiving app is in this tenant -- the
  // one its own key is narrowed to when it introspects. `app`, as a role, a
  // group and a key say the app they are of.
  HolderRef app = 1;

  // What the token is for, at the receiver: usually its own methods. The
  // receiver narrows by them as it would by a key's; what the caller may
  // actually do there is still the receiver's to decide, with
  // `HolderService/Reaches`. Required, for `Delegate`'s reason: a token that
  // allows nothing opens no door.
  //
  // Held to what the caller's own credential allows, as `Vouch.Delegate`
  // holds its tokens: the receiver may present this beside its key in
  // `roster-as`, and roster answers that as the caller within these methods,
  // whatever they name. A key attenuated to a few methods hands on no more.
  repeated string methods = 2;
}

message DelegationIssueRequest {
  // Whose it is: one's own, or somebody whose account the caller may write a
  // way into. None is refused.
  HolderRef holder = 1;

  // The app it is issued to, as the holder that app is answered as in the
  // tenant of whose it is: the one whose own key presents it. Required.
  HolderRef app = 2;

  // What it may call: roster's methods, each one the person may call at all.
  // Required, for `Exchange`'s reason: a delegation that allows nothing opens
  // no door.
  repeated string methods = 3;

  // When it stops working: no later than `delegation.life` from now. Unset is
  // that bound.
  google.protobuf.Timestamp date_expired = 4;
}

message DelegationIssueResponse {
  // The token, and the only time it is ever readable. What is stored is a
  // hash.
  string token = 1 [features.field_presence = IMPLICIT];

  // The row, so a page can list it beside the others without asking again.
  // Its `secret` is cleared like any other answer.
  Delegation delegation = 2;
}

message DelegationExchangeResponse {
  // The token, shown once.
  string token = 1 [features.field_presence = IMPLICIT];

  // When it stops working.
  google.protobuf.Timestamp date_expired = 2;
}
