edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";

// What this app adds to the generated contract for `Email`.
//
// # Why verifying an address is `Email`'s verb and not `Vouch.Link`'s
//
// Recovery stayed on `VouchService` for one reason: it is addressed to an
// **address**, with no row to reference, and the flow has to answer the same
// for an address that is here and one that is not. Verification has the row --
// the `Email` somebody just added -- so the same criterion puts it on the
// resource (CLAUDE.md, *Overlay before service*): a verb on `Email` rows,
// gated by `mayReach` on the row's holder like every other write about a way
// in, with the person passing their own reference.
//
// # A verify link is worth strictly less than a recovery link
//
// `Vouch.Redeem` mints a delegation: whoever holds the link is signed in.
// `Email.Confirm` stamps `date_verified` and nothing else. Were it otherwise,
// adding an address to your account would mint you a sign-in link, and a
// mailbox an attacker reads once would be an account they hold. The two links
// share the `Link` table and its sweep; a verification names its `email` and a
// recovery names none, and **both** doors read that -- `Confirm` refuses a link
// naming none, `Vouch.Redeem` refuses one naming an address.
//
// For a while only the first was written, and a discriminator read on one side
// is not one: a token mailed to prove an address was spendable at the door that
// mints, so the paragraph above was false of the code under it. Whichever door
// is added next reads the edge too, or this is untrue again.
service EmailService {
  // Verify mints a link that proves this address, and answers with it once.
  //
  // roster does not deliver it -- that is the point, as it is for `Vouch.Link`:
  // a store that mailed would be a store that knows how to reach people, which
  // is the front door's business. The app that asked puts it in a message to
  // **that** address; a link that arrives anywhere else proves nothing, which
  // is why only the address on the row is ever a place it goes.
  //
  // # It also mints a link for an address that is somebody else's
  //
  // Which is [EmailVerifyRequest.holder], and it exists because the shape
  // without it left an address **squattable**. `Email` is unique on
  // `(tenant, address)` and `vouch.byAddress` resolves a person by one, so a row
  // nobody proved still named somebody -- and `Add` answering `AlreadyExists`
  // meant the rightful holder could not write the row, could not reach this
  // verb, and had no road to the address at all. What that cost is not a
  // takeover: a link goes to the mailbox either way. It is a name the real
  // holder is refused, with a refusal that says only that somebody has it,
  // which is `host.proto` § *Why a hostname is not checked* one medium along.
  //
  // So this is #42's answer said about an address: a **claim** is minted by
  // whoever wants the address, the proof is a round trip to the mailbox, and
  // [EmailService.Confirm] is where the address moves. What is deliberately not
  // here is a proved address moving; see `Confirm`.
  rpc Verify(EmailVerifyRequest) returns (EmailVerifyResponse);

  // Confirm spends a link and stamps the row it was minted for.
  //
  // Everything wrong answers the same `NotFound`: a token never minted, one
  // spent, one expired, one minted by somebody else, one that is a recovery
  // link. What a caller may rely on is that after `OK` the address is
  // `date_verified` at this moment, and that nothing was signed in.
  //
  // # And it is where an address changes hands
  //
  // A link minted with [EmailVerifyRequest.holder] is a claim by somebody who
  // does not hold the address. Spending one **moves** it: the row that held it
  // unproved is erased and the address is written on the claimant, stamped, in
  // one transaction. `host.proto`'s `proved()` is the same three writes for the
  // same reason.
  //
  // What may be taken is an address **nobody has proved**, and that bound is the
  // whole of why this is safe: there is nothing on such a row to protect, since
  // under this change it resolves nobody either (`vouch.byAddress`). An address
  // that somebody has proved does not move, which is where this and #42 differ
  // on purpose -- a DNS name's incumbent cannot be relied on to let go, because a
  // domain changes hands and the old holder is gone, while an address lives
  // inside one tenant whose operator can erase a row. Letting a proved address
  // move would make one compromised mailbox into an account somebody else holds.
  rpc Confirm(EmailConfirmRequest) returns (EmailConfirmResponse);

  // Attest writes an address a **provider** vouched for, and stamps it when
  // that provider said it had checked.
  //
  // # Why a link cannot answer this
  //
  // `Verify` and `Confirm` are for an address nobody has vouched for: somebody
  // typed it, and the way to find out whether they hold that mailbox is to send
  // a nonce there and see it come back. An address that arrived inside a token
  // a directory signed is not that. The check has been done, by whoever the
  // person authenticates at, and sending a link asks them to prove again what
  // an authority already asserted -- in a deployment with no mail, asks them to
  // prove it by a route that does not exist.
  //
  // So this is the second road to `date_verified`, and the first was written
  // knowing there would be one: `Email.vouched_by` is *which identity vouched
  // for it, if one did*, and it says an address in a provider's claims is *only
  // as good as that provider's own check*. Nothing had ever written it.
  //
  // # What it does not do
  //
  // Believe the caller about the checking. `verified` is what the **provider**
  // said -- `email_verified` in an OIDC token -- and a caller that sets it
  // falsely is a caller that could instead have linked an identity and been
  // that person outright. What it may not do is escape the rules every other
  // way in meets: `vouched_by` is required, so a row written here always says
  // whose word it was, and a later decision is made on evidence rather than on
  // a flag somebody set.
  //
  // Refused, like `Email.Add`, for a holder wider than the caller.
  rpc Attest(EmailAttestRequest) returns (Email);
}

message EmailVerifyRequest {
  // Which address, by reference.
  EmailRef ref = 1;

  // Whose claim this is, when it is not the row's own holder's.
  //
  // Empty is the ordinary case and is unchanged: a person proving an address
  // already on their row, held to `mayReach` on that row's holder.
  //
  // Set, it is somebody claiming an address **another row holds unproved** --
  // the case `Email.Add` cannot reach, because the address is taken and the
  // index says so. Two rules on it and neither is the one it replaces:
  //
  //   - the row must be **unproved**. A proved address does not move; see
  //     [EmailService.Confirm].
  //   - the claimant is held to `mayWriteAWayIn`, so nobody claims an address
  //     onto an account wider than their own. That is the rule `Email.Add`
  //     already meets, arriving at the other road to the same row.
  //
  // `mayReach` on the **row's** holder is not asked, and that is the point
  // rather than an omission: it guards a row somebody proved, and this one is
  // one nobody did.
  HolderRef holder = 3;

  // When the link stops working; unset, or later than the default, is the
  // default (`vouch.LinkFor`).
  google.protobuf.Timestamp expires = 2;
}

message EmailVerifyResponse {
  // The link, and the only time it is readable. What is stored is a hash.
  string token = 1 [features.field_presence = IMPLICIT];

  google.protobuf.Timestamp expires = 2;
}

message EmailAttestRequest {
  // Whose address it is.
  HolderRef holder = 1;

  // The address, as the provider spelled it. Normalised here the way every
  // other write is, so that a lookup and a write agree.
  string address = 8;

  // Which identity vouched, and it is **required**: an attestation with no
  // voucher is an address somebody typed, and that has `Add` and a link.
  IdentityRef vouched_by = 10;

  // Whether that provider said it had checked the address -- `email_verified`
  // in a token. False writes the row and stamps nothing, which is the right
  // answer for a directory that does not say: the address is kept, the evidence
  // is kept, and nothing claims a check that did not happen.
  bool verified = 9;
}

message EmailConfirmRequest {
  string token = 1 [features.field_presence = IMPLICIT];
}

message EmailConfirmResponse {
  // The row, stamped.
  Email email = 1;
}
