edition = "2023";

package roster;

import "app/apikey.proto";
import "roster/payday/holder_svc.g.proto";
import "google/protobuf/timestamp.proto";

// What this app adds to the generated contract for `ApiKey`.
//
// # Why an ApiKey grows a verb instead of an IssueService keeping one
//
// `Issue.IssueKey` was `ApiKey.Add` with the secret made on the server and
// answered once -- a verb on api-key rows wearing a service's clothes. It is
// `Mint` now, on the entity, for the rule (CLAUDE.md, *Overlay before service,
// layer before overlay*): a new verb on one entity's rows is an overlay. The
// exception `Issue` existed to be -- the one moment `secret` may leave, because
// it was just made -- is exactly what an overlay is for.
//
// `IssuePassword` did not come with it: that generates a **password** for a new
// operator, control-plane only and the deployment's own bootstrap, which no
// reach-guarded overlay can be. It stays on `IssueService`, which is now that
// one method and says why beside it.
//
// # The prefix is not in the request, and cannot be
//
// A key belongs to a plane -- `rk_` for the deployment's own services, `rt_`
// for somebody inside a tenant -- and which one is a fact about the server that
// answered, not a field. A caller that could name it could ask the customer
// port for a key of the deployment's kind. So the layer is told which by
// `core.WithPrefix`, one per stack, and `Mint` reads it there. See `server/keys`.
//
// # The service is served for this, and its verifier never travels
//
// `ApiKey.secret` is `(payday.field).secret`, so the sink clears it on the way
// out -- including out of `Add`'s own answer, which is why a mint needs its own
// door. `cmd/serve` registers the service for `Issue` and shuts the reads and
// the raw `Add`/`Erase` by method, so nothing on the wire answers with a stored
// hash and nobody sends one: the prefix is not theirs to choose and neither is
// the secret.
service ApiKeyService {
  // Issue makes a key for somebody and answers with it once.
  //
  // Whose it is names one of two ways, the same pair `Issue.IssueKey` took: a
  // `holder` reference on a plane with many tenants, where a name alone answers
  // to more than one person and the wall narrows a reference to the ones this
  // caller sees; or a `service` alias on the control plane's one tenant, which
  // is created if it is not there, because a service is not something set up on
  // purpose before it is needed. Giving both is refused.
  rpc Issue(ApiKeyIssueRequest) returns (ApiKeyIssueResponse);
}

message ApiKeyIssueRequest {
  // The holder it is for, by alias within this plane's one tenant, created if
  // it is not there. **Control plane only.** Giving both this and `holder` is
  // refused.
  string service = 1 [features.field_presence = IMPLICIT];

  // What somebody calls this key when deciding whether to revoke it.
  string alias = 2 [features.field_presence = IMPLICIT];

  // What it may be used for, in full. Empty is refused rather than defaulted:
  // everything hands out more than was asked for, and nothing mints a key that
  // silently does not work.
  repeated string methods = 3;

  // When it stops working, unset for one that does not.
  google.protobuf.Timestamp expires = 4;

  // Whose it is, in full. **Data plane only**, and a reference rather than an
  // alias because the wall has many tenants and a name alone is a question with
  // more than one answer. Naming one that is not there is a refusal, not a
  // creation: a customer's people are the customer's.
  HolderRef holder = 5;
}

message ApiKeyIssueResponse {
  // The key, and the only time it is ever readable. What is stored is a hash.
  string token = 1 [features.field_presence = IMPLICIT];

  // The row, so a console can list it beside the others without asking again.
  // Its `secret` is cleared like any other answer.
  ApiKey key = 2;
}
