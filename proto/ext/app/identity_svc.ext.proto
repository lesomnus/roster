edition = "2023";

package roster;

import "google/protobuf/timestamp.proto";
import "app/identity.proto";

// What this app adds to the generated contract for `Identity`.
//
// # Why Resubject and not the Patch
//
// `Patch` writes anything the schema holds and is closed at the transport for
// it (`grpcx.GeneralWrite`). An identity's subject is the half of a sign-in a
// provider decides, and changing it is changing which account at that
// provider is this person -- a way in, written. The one change that has a
// reason is the provider's identifier for the same person becoming a
// different claim (`Connection.subject_claim`), and that change has a shape a
// layer can hold it to: the same row, the claim's shape, once.
//
// # Why it is not `Add` and an erase
//
// `Add` refuses a second identity at one provider (`oneAccountPerProvider`)
// and `Erase` refuses a person's last way in, so the pair would have to be
// written in an order one of them refuses. And it would be two writes where
// the meaning is one: the person keeps their row, their trail and their place
// in every list; only what the provider calls them moves.
service IdentityService {
  // Resubject moves an identity to the subject its connection now names: the
  // same row and the same person, and the identifier their provider gives them
  // under that connection's `subject_claim`.
  //
  // Refused unless the connection names a claim other than `sub`, the subject
  // held is not already of that claim's shape and the new one is -- one way,
  // and once -- and the caller may write a way into this person
  // (`server/core/escalate.go`).
  rpc Resubject(IdentityResubjectRequest) returns (Identity);

  // Attest writes an account at a provider onto the caller's own row, on the
  // word of a front door that saw the provider say it is theirs.
  //
  // # Why it is not `Add`
  //
  // `Add` takes no proof: whoever may call it writes an account under any
  // provider's name and any subject, and the row is live at once -- a way in
  // for whoever holds that account and, at a connection a directory
  // provisions through, who the directory finds its user by. So `Add` is for
  // whoever holds it across the tenant: an administrator, and a front door
  // linking somebody at their first sign-in. What a person connects
  // themselves is proved by the round trip to the provider, which roster
  // cannot see and the front door that made it can. This is the verb it
  // vouches with, as `EmailService/Attest` is beside `EmailService/Add`.
  //
  // # Who it is taken from
  //
  // It is in what everybody holds over what is their own (`self-service`), so
  // a tenant switches its people's *connect* off by taking it out of that
  // role. It is taken for the caller's own row only, and only through a
  // delegation whose app holds `IdentityService/Attest` across the tenant --
  // a binding with no site -- which is the front door vouching. A key of
  // one's own, or a session, is refused `PermissionDenied`, and so is a
  // delegation whose app does not hold it. Somebody else's row is answered as
  // any method of `self-service` answers one: there is nobody there.
  //
  // It writes what `Add` writes, held to every rule `Add` asks of the row.
  rpc Attest(IdentityAttestRequest) returns (Identity);
}

message IdentityAttestRequest {
  // Whose account it is: the caller's own.
  HolderRef holder = 2;

  // The provider, by the name of the tenant's connection to it.
  string provider = 8 [features.field_presence = IMPLICIT];

  // Who that provider says they are.
  string subject = 9 [features.field_presence = IMPLICIT];
}

message IdentityResubjectRequest {
  IdentityRef ref = 1;

  // The version this caller read, or nothing. Left out, the move does not wait
  // on one and the row is taken as whatever it is now -- the rules above are
  // what it is held to, and none of them depends on a value somebody else could
  // have changed in between. One given that has moved since is answered
  // `Aborted`, and the caller reads again.
  google.protobuf.Timestamp date_updated = 13;

  // What the provider calls this person under the connection's claim.
  string subject = 9 [features.field_presence = IMPLICIT];
}
