edition = "2023";
package roster;

import "app/me.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/holder.proto";
import "roster/payday/tenant_svc.g.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service HolderService {
  // Add creates a new Holder
  rpc Add(HolderAddRequest) returns (Holder);
  // Get retrieves a Holder
  rpc Get(HolderGetRequest) returns (Holder);
  // Patch updates an existing Holder
  rpc Patch(HolderPatchRequest) returns (Holder);
  // Apply applies a patch document to an existing Holder
  rpc Apply(HolderApplyRequest) returns (Holder);
  // Erase deletes a Holder
  rpc Erase(HolderRef) returns (HolderEraseResponse);
  // List reads Holders a page at a time.
  rpc List(HolderListRequest) returns (HolderListResponse);
  // Watch the Holders this caller may see, as they are now and as they change.
  //
  // What arrives is **state and never a delta**, so a client converges rather
  // than replays: it keeps what it was last told about a row and replaces it.
  // An event it did not receive is one it does not need, since the next one
  // about that row carries the whole of it.
  //
  // The first message is everything that matches right now, so a client does
  // not have to List first and race the subscription. A row may arrive twice --
  // once in that first message and once as a change that happened while it was
  // being read -- and that is harmless for the same reason.
  rpc Watch(HolderWatchRequest) returns (stream HolderWatchResponse);
  // Update is the narrow write, and the one a caller is given.
  //
  // `Patch` and `Apply` write anything the schema holds, which is why they are
  // closed at the transport unless a deployment says otherwise -- *what a
  // caller may change, and under what conditions, is not something a general
  // write can be told*.
  //
  // This can be told. Two fields, both of them things a holder carries about
  // itself and neither of them anything the wall, the trail or a permission
  // reads: what a person is called, and whatever the app that put it there
  // keeps. Nothing here can move somebody between tenants, rename them into
  // somebody else's alias, or change what they may do.
  //
  // It is on `HolderService` rather than in a service of its own because it is
  // a write on a holder, and a second service would be one more name for the
  // same rows. The overlay mechanism exists for exactly this and nothing had
  // used it.
  rpc Update(HolderUpdateRequest) returns (Holder);
  // Disable stops somebody signing in, and leaves their rows where they are.
  //
  // Its own method rather than a field on `Update`, because it is not a thing
  // a holder carries about itself -- it is somebody else's decision about them,
  // and roles are lists of methods, so a separate name is the only way a
  // deployment can grant one without granting the other.
  rpc Disable(HolderDisableRequest) returns (Holder);
  // Enable is the other direction, and is a second method for the same reason
  // the first is one: what a role may do is what it names.
  rpc Enable(HolderEnableRequest) returns (Holder);
  // Invalidate voids everything issued before now.
  //
  // No time is taken and none can be. A caller who could write an older value
  // could un-revoke; one who could write a future value could shut somebody out
  // of a deployment with no way to say so. The server stamps it, which is also
  // what makes it monotonic, which is what makes a duplicate a no-op and a
  // missed message a matter of latency rather than correctness.
  //
  // There is no undo, by construction. That is the point rather than an
  // omission: this is what a password reset and a "sign me out everywhere"
  // button both do, and a credential that can be brought back is not revoked.
  rpc Invalidate(HolderInvalidateRequest) returns (Holder);
  // SignsIn answers how somebody signs in, without the verifier.
  //
  // # Why it cannot be read any other way
  //
  // `CredentialService` is not registered at all, because its generated `Get`
  // answers with the verifier (D13). And `IdentityService` narrows by the
  // **tenant**, so an operator's list of one person's identities is that whole
  // tenant's, filtered in the app -- which is the leak D17 named and D23 exists
  // to remove.
  //
  // # Why it is not MeService
  //
  // `MeService` takes nothing, which is the property that makes it safe to read
  // unwalled and the reason `cmd.Policy` waives a binding for it. This takes a
  // subject, so it is the ordinary question with the ordinary answer: behind
  // the wall, and needing a role that names it.
  //
  // It is on `HolderService` and not a service of its own for `Update`'s
  // reason: it is a read of a holder, and a second service would be a second
  // name for the same rows.
  rpc SignsIn(HolderSignsInRequest) returns (HolderSignsInResponse);
  // RevokeKey ends one key of one person's.
  //
  // Beside `SignsIn` for the same reason it is: `ApiKeyService` is unregistered
  // everywhere, so there is no served road to a key row at all -- and a screen
  // that lists somebody's keys and cannot end one is a screen that sends an
  // operator to a shell, which is what `roster key revoke` is and which reaches
  // only the **deployment's** own `rk_` keys.
  //
  // A *which* within a *whose*: the reference says the person, the identifier
  // says the key, and one that is not theirs is `NotFound`. So this cannot be
  // used to ask whether a key exists, and cannot be pointed past the wall the
  // reference is narrowed by.
  //
  // Its own method rather than a field on `Update`, for the reason `Disable`
  // and `Enable` are two: a role is a list of methods, so a deployment can only
  // hand out what it can name -- and *may see how somebody signs in* is a
  // different grant from *may take a way in away*.
  rpc RevokeKey(HolderRevokeKeyRequest) returns (HolderRevokeKeyResponse);
}

message HolderAddRequest {
  bytes id = 1;
  TenantRef tenant = 2;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  google.protobuf.Timestamp date_created = 15;
  string idp_subject = 8;
  Profile profile = 9;
  google.protobuf.Any data = 10;
  google.protobuf.Timestamp date_invalidated = 11;
  google.protobuf.Timestamp date_disabled = 12;
}

message HolderGetRequest {
  HolderRef ref = 1;
  HolderSelect select = 2;
}

message HolderRef {
  oneof key {
    bytes id = 1;
    HolderRefBySlug slug = 4;
    string idp_subject = 8;
  }
}

message HolderRefBySlug {
  string alias = 4;
  TenantRef tenant = 2;
}

message HolderSelect {
  bool all = 1;
  TenantSelect tenant = 2;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  bool date_updated = 13;
  bool date_erased = 14;
  bool date_created = 15;
  bool idp_subject = 8;
  bool profile = 9;
  bool data = 10;
  bool date_invalidated = 11;
  bool date_disabled = 12;
}

message HolderPatchRequest {
  HolderRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  string idp_subject = 16;
  // Clear idp_subject instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and idp_subject clears.
  bool idp_subject_null = 17;
  Profile profile = 18;
  // Clear profile instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and profile clears.
  bool profile_null = 19;
  google.protobuf.Any data = 20;
  // Clear data instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and data clears.
  bool data_null = 21;
  google.protobuf.Timestamp date_invalidated = 22;
  // Clear date_invalidated instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_invalidated clears.
  bool date_invalidated_null = 23;
  google.protobuf.Timestamp date_disabled = 24;
  // Clear date_disabled instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_disabled clears.
  bool date_disabled_null = 25;
}

message HolderApplyRequest {
  HolderRef ref = 1;
  patch.Patch patch = 2;
}

message HolderEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message HolderListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated HolderFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message HolderListResponse {
  repeated Holder items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message HolderFilter {
  HolderRef ref = 1;
  TenantRef tenant = 2;
}

message HolderWatchRequest {
  // Which rows to watch, in the same words List takes them: what is watched is
  // what that list would answer with, now and afterwards.
  //
  // Required, and bounded the way a List is -- for a heavier reason. A list
  // runs its filters once; a watch runs them again for every write that touches
  // the entity, for as long as the stream is open. A watch with no filters is
  // the whole table, forever, which is the one shape that has no cap at all.
  repeated HolderFilter filters = 1;

  // Skip what is there now and send only what changes from here.
  //
  // Off by default, and the default is the safe one: a client that does not
  // know the current state and did not ask for it holds something wrong until
  // the next write happens to correct it.
  bool skip_snapshot = 2 [features.field_presence = IMPLICIT];
}

message HolderWatchResponse {
  // What changed, or -- in the first message -- everything that matches.
  repeated HolderWatchItem items = 1;
}

message HolderWatchItem {
  // Which row. Always said, since one that is gone still has to be named.
  bytes id = 1;

  // The row as it is now, and **absent when it is no longer one this caller may
  // see**: erased, or moved out of the filters this stream named.
  //
  // Absence is the whole of how a removal is said. There is no flag for it, and
  // there is deliberately no way to tell those two apart -- a stream that
  // distinguished "erased" from "no longer yours" would be telling a caller
  // about rows that stopped being theirs, which is the thing the wall is for.
  //
  // It is only ever said about a row this stream has already carried. One that
  // never matched is not news.
  Holder value = 2;

  // The Rpc that changed it, by the name gRpc knows it by. It is what the
  // caller of *that* Rpc asked for and not the write it became, so an Rpc
  // written by hand is here under its own name.
  //
  // Empty in the first message, which is not something anybody asked for -- it
  // is what is already there.
  string action = 3 [features.field_presence = IMPLICIT];
}

message HolderUpdateRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read. A
  // write against a row that has moved is refused rather than applied to
  // whatever it became.
  google.protobuf.Timestamp date_updated = 13;

  // Replaced **whole**, both of them, which is the shape each was chosen for:
  // one fact from one moment, whatever last told us. Sending neither changes
  // neither.
  Profile profile = 9;
  google.protobuf.Any data = 10;
}

message HolderDisableRequest {
  HolderRef ref = 1;

  // Optimistic locking, as `Update` takes it.
  google.protobuf.Timestamp date_updated = 13;
}

message HolderEnableRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderInvalidateRequest {
  HolderRef ref = 1;

  google.protobuf.Timestamp date_updated = 13;
}

message HolderSignsInRequest {
  HolderRef ref = 1;
}

message HolderSignsInResponse {
  // The same shapes `MeService` answers with, deliberately. Two of them saying
  // one thing would be two that drift, and the drift would be between what a
  // person sees about themselves and what an operator sees about them.
  repeated SignInIdentity identities = 13;
  repeated SignInCredential credentials = 14;

  // And the keys that act as them, which `MeService` does not answer with.
  //
  // That asymmetry is deliberate rather than an omission. A person reading
  // their own record is looking at what **they** sign in with; a key is
  // something a machine of theirs holds, and the screen that lists one is the
  // screen that revokes it -- which is an operator's, on the port with no wall.
  // If a self-service version is wanted later it is a different decision with a
  // different reason, and `me.proto` is where it would be argued.
  repeated SignInKey keys = 15;
}

message HolderRevokeKeyRequest {
  // Whose.
  HolderRef ref = 1;

  // Which, by the identifier `SignsIn` answers with.
  bytes id = 2;
}

message HolderRevokeKeyResponse {}
