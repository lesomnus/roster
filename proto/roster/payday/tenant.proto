edition = "2023";
package roster;

import "google/protobuf/timestamp.proto";
import "orm.proto";
import "payday.proto";

option features.field_presence = IMPLICIT;
option go_package = "github.com/lesomnus/roster/rstr";

// Tenant is the wall an app is divided by.
//
// It is payday's rather than each app's because everything that reads a request
// reads it: the wall narrows every query by it, the trail stamps it, a rate
// limit counts against it. An app that declared its own would be an app in
// which none of those could be written once.
//
// **Fields 1, 2, 4..7 and 13..15 are payday's, and 3 is not**: it is left for
// the app's set edge, and payday will not spend it. An app adds its own in
// 8..12 and from 16, in a `tenant.ext.proto` beside this; `pd gen` refuses an
// overlay that touches a number here, since the merge would take it silently
// and `alias` would quietly become whatever the overlay said.
message Tenant {
  bytes id = 1 [(orm.field) = {
    type: TYPE_UUID
    key: true
    default: ""
  }];
  // Alias is what a person writes this tenant as, and it is unique across the
  // deployment: `@acme/arm-01` says which tenant before it says which row.
  string alias = 4 [(orm.field) = {unique: true}];
  string name = 5;
  string desc = 6;
  map<string, string> labels = 7;
  // DateUpdated is stamped by the server on every write and refused to a patch
  // document, so it is a version and not a field.
  //
  // What needs it is a client holding a copy: a `Watch` sends state rather than
  // deltas, so two answers about one row have to be orderable or a late one
  // overwrites an early one that was newer. It is here rather than added when
  // that is built because adding it later is every app's migration.
  google.protobuf.Timestamp date_updated = 13 [(orm.field) = {
    version: {}
  }];
  google.protobuf.Timestamp date_created = 15 [(orm.field) = {
    immutable: true
    default: ""
  }];
  // A tenant is **not** erased softly, and a Holder is. The difference is the
  // trail: every row of it names the Holder that acted, so a deleted Holder
  // would leave the trail saying who while nobody could find out who. Nothing
  // names a tenant that way, so there is nothing for its row to outlive.
  option (orm.message) = {
    rpc: {crud: true}
  };
  option (payday.entity) = {
    // payday's own, so that generation finds it whatever an app called the
    // proto package. An app never writes this; see `Own` in entity.proto.
    own: OWN_TENANT

    domain: 1

    tenant: {}

    // A tenant is not erased softly, for the reason above -- and in practice
    // it is barely erased at all: every tenanted row holds a foreign key to
    // one, so a tenant with anything in it cannot go, and the gate does not
    // serve the RPC.
    erase: {
      hard: {}
    }

    // A tenant can be listed, and the wall is what makes that safe rather than
    // alarming.
    //
    // `Tenant` **is** the wall, so a list of them is narrowed to the tenants
    // the caller's scope already covers: an ordinary person sees the one they
    // are in, and a caller whose grant covers everything -- a deployment
    // administering its customers from a port with no wall -- sees them all.
    // Neither is a new right; both are the scope that was already there,
    // enumerated.
    //
    // It was absent rather than declined. Nothing wrote down a reason, `Holder`
    // has had one all along, and the asymmetry showed up the first time
    // somebody built a console: an operator could open a tenant they already
    // knew the name of and could not find out which ones there were.
    list: {
      order: [
        {
          field: {name: "date_created"}
        },
        {
          field: {name: "id"}
        }
      ]
      by: [
        {name: "ref"}
      ]
      size: 20
      max: 100
    }
  };
  // What this tenant has decided about itself, as against what it *is*.
  //
  // # Why a message and not a field per setting
  //
  // `Profile` on [Holder] makes the same trade and states its cost: one value
  // to the database -- no filter, no index -- so anything that has to be
  // **looked up** goes flat beside it. Nothing here is looked up; it is read by
  // somebody already holding the tenant, on a path that was reading it anyway.
  //
  // What it buys is that the next setting is a field number in here rather than
  // one of the nine an app gets on `Tenant` itself.
  TenantConfig config = 8;
}

// TenantConfig is the settings, and each one is a **fact roster enforces**
// rather than an instruction to a screen.
//
// D22 refuses the field that describes what to render, however small it looks,
// and the first draft of `password` was exactly that -- a boolean the sign-in
// page read to decide whether to draw a form, with `Vouch.Verify` going on
// answering `ok` underneath it. That is a lock somebody sets and does not get:
// the form disappears and the door stays open. D43 is the same mistake already
// made once, where a TOTP seed was a whole sign-in because `Verify` counted it.
//
// So a setting only goes here if roster **acts on it**. A page reading one is
// drawing what is true, not being told what to draw.
message TenantConfig {
  // Whether a password is a way into this tenant.
  //
  // **Unset is yes**, which is the whole reason this field has presence where
  // everything around it does not (`option features.field_presence = IMPLICIT`
  // on the merged file). A tenant written before this existed reads `false` for
  // an implicit bool, and every one of them would have been locked out of the
  // one credential roster holds itself.
  //
  // What it turns off is **signing in**, on every path that ends in
  // `Vouch.Verify` -- the Login App's form, the account page's, an LDAP bind,
  // and the recovery link, which hands over a password and would otherwise mail
  // somebody a way in that does not work. What it does **not** touch is
  // `Credential.Set`: a tenant that turns this back on should find its people's
  // passwords where they left them, and a write refused here would be a
  // password screen that breaks with nothing saying why.
  //
  // For an operator whose people all arrive through a directory, which is the
  // case it was asked for: a form nobody uses is a form that says somebody here
  // has a password.
  bool password = 1 [features.field_presence = EXPLICIT];

  // Where this tenant's people sign in through a directory: the origin of
  // the front door in front of it, `https://account.contoso.example`. Empty is
  // no front door, which is what a tenant whose people all have passwords is.
  //
  // # What roster does with it
  //
  // Two things, and the second is the one that makes this a fact rather than an
  // address a page is handed. The user console asks `AuthService.Offers` what
  // this name lets somebody in with, and this is where it sends them for a
  // provider -- the page cannot know, because which of a tenant's `Host` rows
  // is the front door is not written on the row, and in a development
  // deployment the two are one name on two ports. And `Vouch.Accept` **refuses
  // to hand anybody into this tenant's console** while this is empty: a front
  // door minting a link for a browser to spend at the user console is the
  // tenant's decision, taken here, and not something a key that may `Accept`
  // may do to a tenant that never said so.
  //
  // An origin and nothing more -- scheme and host, a port if the deployment
  // needs one -- because the front door's own routes are the front door's
  // (`/login`, `/callback`) and a path written here would be a second copy of
  // one of them. `server/core` refuses anything else on the way in.
  string front_door = 2;

  // How a sign-in fills what this tenant's people's profiles lack, and from
  // where.
  //
  // # Why it is the tenant's
  //
  // Because tenants differ on both halves. One wants nothing copied out of its
  // directory; one keeps its people's pictures in Entra, where Teams puts
  // them; one keeps them in Slack, whatever its directory has. A setting of
  // the front door would be one answer for every tenant it fronts.
  //
  // It is a fact roster acts on, which is what this message is for: the front
  // doors read it at every sign-in through a provider, and `HolderService.Fill`
  // is what they write with.
  TenantProfile profile = 3;
}

// TenantProfile is how a tenant's profiles are filled at a sign-in.
//
// Blanks only, once, by `HolderService.Fill`'s rule: what a person or an
// administrator wrote stays, and emptying a field is how somebody asks for the
// source's again at their next sign-in. Nothing watches a source afterwards.
message TenantProfile {
  // Whether a sign-in through a provider fills the blanks at all. Unset is no:
  // copying what a directory holds about people into another store is a
  // decision, and one a tenant written before this existed never took.
  bool fill = 1;

  // A Slack workspace to fill from instead of the directory the person signed
  // in through: where the deployment keeps a bot token holding `users:read`
  // and `users:read.email`, in `Connection.secret_ref`'s words -- `env:NAME`.
  // Empty is the directory: its token's claims, and its userinfo.
  //
  // # Written by the deployment and by nobody else
  //
  // A reference names one of the **deployment's** secrets, and the front door
  // sends what it names to Slack as a bearer token. A tenant's administrator
  // who could write it could point it at any secret the front door holds --
  // another tenant's, the front door's own key. So `server/core` refuses a
  // new one from anybody narrower than the deployment: the file a deployment
  // declares its tenants in, and an operator. A tenant's administrator may
  // keep it or take it away, which hands nothing to anybody.
  string slack_secret_ref = 2;
}
