edition = "2023";
package roster;

import "google/protobuf/timestamp.proto";
import "patch/patch.proto";
import "roster/payday/tenant.proto";

option go_package = "github.com/lesomnus/roster/rstr";

service TenantService {
  // Add creates a new Tenant
  rpc Add(TenantAddRequest) returns (Tenant);
  // Get retrieves a Tenant
  rpc Get(TenantGetRequest) returns (Tenant);
  // Patch updates an existing Tenant
  rpc Patch(TenantPatchRequest) returns (Tenant);
  // Apply applies a patch document to an existing Tenant
  rpc Apply(TenantApplyRequest) returns (Tenant);
  // Erase deletes a Tenant
  rpc Erase(TenantRef) returns (TenantEraseResponse);
  // List reads Tenants a page at a time.
  rpc List(TenantListRequest) returns (TenantListResponse);
  // Update replaces what a tenant says about itself, under the version read.
  rpc Update(TenantUpdateRequest) returns (Tenant);
  // Close shuts everybody of a tenant out, and destroys nothing.
  //
  // `Holder.Disable` one level up, and its own method for that one's reason:
  // roles are lists of methods, so a separate name is the only way to grant
  // one without the other. What it reaches is `Tenant.date_closed`'s.
  //
  // The first step of a tenant leaving, of four -- close, restore while the
  // grace lasts, destroy, and the alias held after it (`docs/usage/customers.md`
  // § *A customer leaving*). Refused on a tenant a file declared, and on the
  // control plane, whose one tenant is the deployment itself.
  rpc Close(TenantCloseRequest) returns (Tenant);
  // Restore undoes a close, while there is still one to undo: before
  // `tenant.restore_within` has run out, and never after the tenant was
  // destroyed. The tenant comes back exactly as it was, alias and all.
  //
  // The same verb as a person's (`roster restore`), for the same reason: a
  // grace with no undo is only a delay.
  rpc Restore(TenantRestoreRequest) returns (Tenant);
}

message TenantAddRequest {
  bytes id = 1;
  string alias = 4 [features.field_presence = IMPLICIT];
  string name = 5 [features.field_presence = IMPLICIT];
  string desc = 6 [features.field_presence = IMPLICIT];
  map<string, string> labels = 7;
  google.protobuf.Timestamp date_created = 15;
  TenantConfig config = 8;
  google.protobuf.Timestamp date_closed = 9;
  google.protobuf.Timestamp date_destroyed = 10;
  google.protobuf.Timestamp date_held = 11;
  string hold = 12;
}

message TenantGetRequest {
  TenantRef ref = 1;
  TenantSelect select = 2;
}

message TenantRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
  }
}

message TenantSelect {
  bool all = 1;
  bool alias = 4;
  bool name = 5;
  bool desc = 6;
  bool labels = 7;
  bool date_updated = 13;
  bool date_created = 15;
  bool config = 8;
  bool date_closed = 9;
  bool date_destroyed = 10;
  bool date_held = 11;
  bool hold = 12;
}

message TenantPatchRequest {
  TenantRef ref = 1;
  string alias = 8;
  string name = 10;
  string desc = 12;
  map<string, string> labels = 14;
  // The version this update requires the stored date_updated to be.
  // It is a precondition, not a write: the update applies only if the row
  // still holds this value, and the server stamps the new version itself.
  // Setting it together with date_updated_force is an error --
  // the version is the token every client's compare-and-swap is measured
  // against, so it is not the caller's to choose.
  google.protobuf.Timestamp date_updated = 26;
  // Update whatever the stored date_updated is, with no precondition.
  // The server still stamps a new version, so other clients' tokens are
  // invalidated as usual; this declines the check for THIS update only.
  // One of date_updated or this must be set. An omitted version is
  // refused rather than assumed, because an unset field cannot be told
  // apart from a caller who never considered locking at all.
  bool date_updated_force = 27;
  TenantConfig config = 16;
  // Clear config instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and config clears.
  bool config_null = 17;
  google.protobuf.Timestamp date_closed = 18;
  // Clear date_closed instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_closed clears.
  bool date_closed_null = 19;
  google.protobuf.Timestamp date_destroyed = 20;
  // Clear date_destroyed instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_destroyed clears.
  bool date_destroyed_null = 21;
  google.protobuf.Timestamp date_held = 22;
  // Clear date_held instead of writing it.
  // It takes a field of its own because an unset value already means
  // "leave it alone", so no value could have meant NULL. It wins
  // outright: setting both this and date_held clears.
  bool date_held_null = 23;
  string hold = 24;
}

message TenantApplyRequest {
  TenantRef ref = 1;
  patch.Patch patch = 2;
}

message TenantEraseResponse {
  // Erased is whether this call is the one that erased the row.
  //
  // False for a row that was already gone, was never there, or is out
  // of this caller's reach -- which are one answer on purpose, and the
  // reason the RPC does not fail instead.
  bool erased = 1;
}

message TenantListRequest {
  // Bounded because the work is: each filter is a predicate in the same query,
  // so this is what says how much of the database one request may read.
  repeated TenantFilter filters = 1;

  // How many to answer with. Nothing said is what the schema declared, and more
  // than the cap is the cap -- a caller asking for more than there is meant no
  // harm, so it is not an error and it is not the whole table either.
  int32 size = 2 [features.field_presence = IMPLICIT];

  // Where to carry on from: the "next" of the answer before. It names the last
  // row of that page rather than counting rows from the start, so a row added
  // ahead of the page does not shift it and a caller reading through never sees
  // one twice or misses one.
  string after = 3 [features.field_presence = IMPLICIT];
}

message TenantListResponse {
  repeated Tenant items = 1;

  // What to ask for next, and empty when this was the last of them.
  //
  // Empty means there is no more *for now*: a list is read as it is, and one
  // that has grown since answers a fresh call. It is not empty merely because
  // the page came back short -- a page is short when the last row of it was the
  // last row there was, which is a thing the server can only know by having
  // looked.
  string next = 2 [features.field_presence = IMPLICIT];
}

message TenantFilter {
  TenantRef ref = 1;
}

message TenantUpdateRequest {
  TenantRef ref = 1;

  // Optimistic locking, as `Patch` takes it: the version this caller read.
  google.protobuf.Timestamp date_updated = 13;

  // Each replaced whole when present, and left as it is when absent.
  string name = 5;
  string desc = 6;
  map<string, string> labels = 7;

  // The settings, replaced whole. Absent leaves them as they are, which is why
  // a console that draws one checkbox has to send back the whole message.
  TenantConfig config = 8;
}

message TenantCloseRequest {
  TenantRef ref = 1;

  // The version this caller read, or nothing: a close is a decision about a
  // tenant rather than an edit of it, so it does not fail because somebody
  // edited a label -- `Holder.Disable`'s reasoning, in `server/core`.
  google.protobuf.Timestamp date_updated = 13;
}

message TenantRestoreRequest {
  TenantRef ref = 1;
  google.protobuf.Timestamp date_updated = 13;
}
