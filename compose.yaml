# roster, locally, in one command -- see docs/operating.md, "Locally, in one
# command". Not production: default passwords, a key written into this file,
# cookies without Secure. It is what somebody working on the pages runs.
#
#     docker compose up --build
#     http://localhost:8082/            admin / admin
#     http://localhost:8090/           erin / correct horse battery staple
#
# `PUBLIC_HOST` is the name a browser reaches this by, `localhost` unless
# said otherwise: the account app resolves the customer by that name, and the
# console is told where the admin listener is by it. The console itself is
# `localhost` only: its cookie is `__Host-` and `Secure`, which a browser takes
# over plain http from that name and from nowhere else.
name: roster

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
      POSTGRES_DB: roster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data

  # The control plane's database, beside the data plane's. Two databases
  # because a key must not live in the tables it protects: with them separate
  # there is no query from the data plane to the keys at all, so a fault in the
  # wall cannot reach one (docs/position.md, "Two planes, one schema"). One
  # server holds both here, which is a development convenience and not a
  # weakening of that: nothing in roster opens a connection that could join
  # across them.
  planes:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: roster
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U roster -d roster -tAc "SELECT 1 FROM pg_database WHERE datname = 'control'" | grep -q 1
        || psql -h postgres -U roster -d roster -c "CREATE DATABASE control OWNER roster";
        psql -h postgres -U roster -d roster -tAc "SELECT 1 FROM pg_database WHERE datname = 'hydra'" | grep -q 1
        || psql -h postgres -U roster -d roster -c "CREATE DATABASE hydra OWNER roster"

  roster:
    # `dev` and not the default stage. The image has two: `app` is what a
    # deployment runs -- distroless, nonroot, no shell -- and `dev` is this one,
    # which adds a shell and the scripts in `docker/` so that `up` leaves a
    # deployment with a customer in it. See the head of `Dockerfile`.
    build:
      context: .
      target: dev
    depends_on:
      planes:
        condition: service_completed_successfully
    environment:
      ROSTER_ROOT_USER: ${ROSTER_ROOT_USER:-admin}
      ROSTER_ROOT_PASSWORD: ${ROSTER_ROOT_PASSWORD:-admin}
      # Five, because the default above is: a development stack says so
      # rather than making the password longer than the name. Unset it (eight)
      # the moment a real password goes in.
      ROSTER_VOUCH_PASSWORD_MIN_LENGTH: ${ROSTER_VOUCH_PASSWORD_MIN_LENGTH:-5}

      # `pgx` and not `postgres`: the driver is named by what registers it
      # (`config/dbpgx`), and a name nothing registered is refused at startup
      # rather than falling back. This once said `postgres`, and the control
      # plane never came up.
      ROSTER_DB_DRIVER: pgx
      ROSTER_DB_DSN: postgres://roster:roster@postgres:5432/roster?sslmode=disable
      ROSTER_DB_MIGRATE: "true"
      ROSTER_CONTROL_DB_DRIVER: pgx
      ROSTER_CONTROL_DB_DSN: postgres://roster:roster@postgres:5432/control?sslmode=disable
      ROSTER_CONTROL_DB_MIGRATE: "true"

      # Both planes, because they are two brokers and were two decisions.
      # `postgres` rather than `memory`, and it costs nothing here: this file
      # already runs one, and `LISTEN`/`NOTIFY` needs no storage and no
      # address. `memory` publishes inside the process, which is right for one
      # replica and silently wrong for two. Each plane listens on its own
      # database, which is what keeps a key being issued from looking like a
      # person changing.
      ROSTER_WATCH_BROKER: postgres
      ROSTER_CONTROL_WATCH_BROKER: postgres

      # The data plane: gRPC, and the same server over HTTP for the account
      # app's calls and anything with an HTTP client.
      ROSTER_SERVER_ADDR: ":50051"
      ROSTER_SERVER_HTTP_ADDR: ":8080"
      ROSTER_SERVER_HTTP_ALLOW_WEB: "true"

      # The control plane, with the console mounted on it; the page is told
      # where the admin listener is, since it has no way to guess.
      ROSTER_CONTROL_ADDR: ":50052"
      ROSTER_CONTROL_HTTP_ADDR: ":8082"
      ROSTER_CONTROL_HTTP_ALLOW_WEB: "true"
      ROSTER_CONTROL_CONSOLE_DIR: /usr/share/roster/console
      ROSTER_CONTROL_CONSOLE_ADMIN: http://${PUBLIC_HOST:-localhost}:8081
      # A console on a dev server (`npm run dev`, :5173) is another origin and
      # is refused without this, with nothing useful said about why.
      ROSTER_CONTROL_HTTP_ORIGINS: '["http://localhost:5173"]'

      # The admin listener: another origin from the page's, so it is named --
      # the served console's, and the dev server's.
      ROSTER_ADMIN_ADDR: ":50053"
      ROSTER_ADMIN_HTTP_ADDR: ":8081"
      ROSTER_ADMIN_HTTP_ALLOW_WEB: "true"
      ROSTER_ADMIN_HTTP_ORIGINS: '["http://${PUBLIC_HOST:-localhost}:8082", "http://localhost:5173"]'

      # Wraps authenticator-app seeds at rest. A key in a compose file is a
      # development key; a deployment writes its own, see `vouch.keys`.
      ROSTER_VOUCH_KEYS: '["dev:XfYoVszmos0DoMNUOSy1vJfaOLVOrq7x6QiNlqRr0G8="]'
    # Every port, including the two only a console should reach; each is a
    # line that would have to change for a deployment, and none is hidden.
    ports:
      - "50051:50051" # product apps
      - "8080:8080"   # the same over HTTP: the account app's calls, curl
      - "50052:50052" # operators
      - "8082:8082"   # the console
      - "50053:50053" # customers
      - "8081:8081"   # the same over HTTP: the console's customers screen
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/config.json >/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - state:/var/lib/roster

  # The first customer, once: a tenant, a person with a password, the host the
  # account app answers on, and the app's key. Reads the databases directly, as
  # a shell on the box would, so it carries the same connection settings.
  customer:
    build:
      context: .
      target: dev
    depends_on:
      roster:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/customer.sh"]
    environment:
      ROSTER_DB_DRIVER: pgx
      ROSTER_DB_DSN: postgres://roster:roster@postgres:5432/roster?sslmode=disable
      ROSTER_WATCH_BROKER: memory
      ROSTER_CONTROL_DB_DRIVER: pgx
      ROSTER_CONTROL_DB_DSN: postgres://roster:roster@postgres:5432/control?sslmode=disable
      ROSTER_CONTROL_WATCH_BROKER: memory
      ROSTER_VOUCH_KEYS: '["dev:XfYoVszmos0DoMNUOSy1vJfaOLVOrq7x6QiNlqRr0G8="]'
      SEED_CUSTOMER: ${SEED_CUSTOMER:-contoso}
      SEED_USER: ${SEED_USER:-erin}
      SEED_PASSWORD: ${SEED_PASSWORD:-correct horse battery staple}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    volumes:
      - account:/var/lib/roster-account

  # The account app: its own process, fronting roster over the wire with the
  # key above, the way it is deployed.
  account:
    build:
      context: .
      target: dev
    depends_on:
      customer:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/account.sh"]
    environment:
      SEED_CUSTOMER: ${SEED_CUSTOMER:-contoso}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports:
      - "8090:8090"
    volumes:
      - account:/var/lib/roster-account:ro

  # The directory: roster over LDAP, its own process with its own key, for
  # anything on the network that speaks nothing else. Bind with an app
  # password minted on the account page (`LDAP_BIND=either` lets a password
  # in too, for somebody with no second factor):
  #
  #     ldapsearch -H ldap://localhost:1389 -x   #       -D uid=erin,ou=people,o=contoso -w rt_… -b o=contoso '(objectClass=inetOrgPerson)'
  ldap:
    build:
      context: .
      target: dev
    depends_on:
      customer:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/ldap.sh"]
    environment:
      SEED_CUSTOMER: ${SEED_CUSTOMER:-contoso}
      LDAP_BIND: ${LDAP_BIND:-key}
    ports:
      - "1389:1389"
    volumes:
      - account:/var/lib/roster-account:ro

  # Hydra, for the shape a deployment with several products has: one sign-in,
  # tokens each of them verifies. It has **no user database** -- that is the
  # whole reason the next two services exist -- and it never sees a password.
  #
  #     http://localhost:8091/  is where it sends a browser to be signed in
  #
  # A development configuration: `dev` mode serves the public port over plain
  # http, and the secrets below are in this file, which is what makes them
  # development secrets.
  hydra-migrate:
    image: oryd/hydra:v2.2.0
    depends_on:
      planes:
        condition: service_completed_successfully
    environment:
      DSN: postgres://roster:roster@postgres:5432/hydra?sslmode=disable
    command: ["migrate", "sql", "-e", "--yes"]

  hydra:
    image: oryd/hydra:v2.2.0
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://roster:roster@postgres:5432/hydra?sslmode=disable
      SECRETS_SYSTEM: youReallyNeedToChangeThis
      URLS_SELF_ISSUER: http://${PUBLIC_HOST:-localhost}:4444
      URLS_LOGIN: http://${PUBLIC_HOST:-localhost}:8091/login
      URLS_CONSENT: http://${PUBLIC_HOST:-localhost}:8091/consent
      # And where it asks whether somebody meant to sign out.
      #
      # Missing, Hydra ends the session on its own and redirects to its own
      # fallback -- so the app is never asked and a deployment finds out the day
      # somebody clicks the button. `flow.sh` walks it, and refuses to pass
      # without this line.
      URLS_LOGOUT: http://${PUBLIC_HOST:-localhost}:8091/logout
      # And where a browser lands when the sign-out asked to come back
      # **nowhere**, which is every sign-out that arrived with no
      # `id_token_hint`: Hydra refuses a `post_logout_redirect_uri` without one,
      # so an app that cannot send the token has no say in the last page.
      #
      # Left unset, that page is Hydra's own fallback, and what it says is
      # addressed to an administrator: *the Default Post Logout URL is not set
      # which is why you are seeing this fallback page*. It is the true end of a
      # successful sign-out and it reads like a broken deployment. A person who
      # clicked *sign out* is told to contact somebody.
      URLS_POST_LOGOUT_REDIRECT: http://${PUBLIC_HOST:-localhost}:8091/signed-out
      # The Login App answers consent itself, so nothing here draws a screen.
      # A deployment that wants one points `URLS_CONSENT` at its own.
      LOG_LEVEL: warn
    command: ["serve", "all", "--dev"]
    ports:
      - "4444:4444" # the public endpoints a product app uses
      - "4445:4445" # admin: private, and this line is what a deployment removes

  # The OAuth client the demo signs in for, once. One client per operator is
  # what makes a challenge say which tenant it belongs to -- see `login/`.
  #
  # `import` rather than `create`, because `create` generates the id and this
  # one has to be a name two other things already know: the Login App's
  # `--client contoso=demo`, and whatever performs the flow.
  hydra-client:
    image: oryd/hydra:v2.2.0
    depends_on:
      hydra:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until hydra list clients --endpoint http://hydra:4445 >/dev/null 2>&1; do sleep 1; done
        hydra get client demo --endpoint http://hydra:4445 >/dev/null 2>&1 && exit 0
        cat >/tmp/demo.json <<'EOF'
        [{
          "client_id": "demo",
          "client_secret": "demo-secret",
          "client_name": "the demo product",
          "grant_types": ["authorization_code", "refresh_token"],
          "response_types": ["code"],
          "scope": "openid offline profile email",
          "redirect_uris": ["http://127.0.0.1:5555/callback"],
          "post_logout_redirect_uris": ["http://127.0.0.1:5555/callback"],
          "token_endpoint_auth_method": "client_secret_post"
        }]
        EOF
        hydra import client --endpoint http://hydra:4445 /tmp/demo.json
        cat >/tmp/behind.json <<'EOF'
        [{
          "client_id": "behind",
          "client_secret": "behind-secret",
          "client_name": "the demo behind a proxy",
          "grant_types": ["authorization_code", "refresh_token"],
          "response_types": ["code"],
          "scope": "openid offline profile email",
          "redirect_uris": ["http://behind:4180/oauth2/callback"],
          "token_endpoint_auth_method": "client_secret_post"
        }]
        EOF
        hydra import client --endpoint http://hydra:4445 /tmp/behind.json

  # The Login App: what Hydra hands a `login_challenge` to, and what answers
  # `acceptLoginRequest{subject}` with a `Holder.id`. Its own process with its
  # own key, like the other two consumers.
  #
  #     docker run --rm -it --network host oryd/hydra:v2.2.0 perform \
  #       authorization-code --client-id demo --client-secret demo-secret \
  #       --endpoint http://localhost:4444 --port 5555 \
  #       --scope openid,offline,profile,email
  login:
    build:
      context: .
      target: dev
    depends_on:
      customer:
        condition: service_completed_successfully
      hydra-client:
        condition: service_completed_successfully
    entrypoint: ["/usr/local/bin/login.sh"]
    environment:
      SEED_CUSTOMER: ${SEED_CUSTOMER:-contoso}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      OAUTH_CLIENT: demo
      # `skip` grants what the client asked for and draws nothing, which is
      # right for a client this deployment registered itself; `ask` draws a
      # screen. `scripts/hydra.sh` walks both.
      LOGIN_CONSENT: ${LOGIN_CONSENT:-skip}
    ports:
      - "8091:8091"
    volumes:
      - account:/var/lib/roster-account:ro

  # A relying party that is **not ours**, which is the whole of what it is for.
  #
  # `examples/product` is our code trusting our issuer, so it is lenient about
  # our tokens in ways we cannot see. `oauth2-proxy` is a standard third party
  # and the shape half the internal apps are already deployed in -- a page that
  # knows nothing about authentication with a proxy in front of it -- and it is
  # what the deployment's `behind.login-demo.hday.dev` is.
  #
  # It is here because that deployment produced two defects nothing local was
  # able to see: a sign-out that ended on Hydra's administrator-facing fallback
  # page, and a session the page could read nothing out of. Both are this
  # shape's and neither is `examples/product`'s.
  #
  # `skip_oidc_discovery`, because the issuer a token says (`URLS_SELF_ISSUER`,
  # the host machine's name) is not a name anything inside this network can
  # reach. So the `iss` it checks stays what Hydra writes and the three URLs it
  # fetches are the ones that resolve here. A deployment discovers, and
  # `docs/operating.md` has that config.
  behind:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
    depends_on:
      hydra-client:
        condition: service_completed_successfully
      login:
        condition: service_started
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_CLIENT_ID: behind
      OAUTH2_PROXY_CLIENT_SECRET: behind-secret
      OAUTH2_PROXY_COOKIE_SECRET: sixteen-bytes-ok
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: http://behind:4180/oauth2/callback

      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://${PUBLIC_HOST:-localhost}:4444
      OAUTH2_PROXY_LOGIN_URL: http://hydra:4444/oauth2/auth
      OAUTH2_PROXY_REDEEM_URL: http://hydra:4444/oauth2/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://hydra:4444/.well-known/jwks.json

      # The identity is `sub` and not an address. oauth2-proxy keys a session on
      # an email by default and refuses a token with none -- and roster puts
      # `email` in a token only when the address is **verified**, so somebody
      # with no address at all would be refused for a reason that is not about
      # them. This is the line every relying party of roster will want, and it
      # is in the deployment's config with the same paragraph.
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: sub
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SCOPE: openid profile email

      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_UPSTREAMS: static://200
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      # With the port, and that is not a detail: a bare `hydra` does not match
      # `http://hydra:4444/...`, and what oauth2-proxy does with an `rd` it will
      # not follow is send the browser to `/` -- so the sign-out silently
      # becomes the proxy forgetting its own session and nothing else, which is
      # the exact lie the second hop exists to prevent.
      OAUTH2_PROXY_WHITELIST_DOMAINS: "hydra:4444,login:8091"
    ports:
      - "4180:4180"

volumes:
  postgres:
  state:
  account:
