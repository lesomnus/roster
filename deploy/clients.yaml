# The OAuth clients, declared.
#
# They were not, and that is how signing out of `itself.login-demo` came to end
# on an error page: each client was registered by hand with `hydra import
# client`, copied from the template in this repository's README, and that
# template listed only `redirect_uris`. `examples/product` asks to come back to
# its **origin** after a logout, so Hydra answered
#
#   Logout failed because query parameter post_logout_redirect_uri is not a
#   whitelisted as a post_logout_redirect_uri for the client.
#
# A registration nobody reviews is a registration nobody notices a missing field
# in. So the clients are files here, and this Job applies them on every sync.
#
# # Why the admin API and not the CLI
#
# `hydra import client` takes the id you chose and **refuses an id that
# exists**; `hydra update client` replaces a client but takes flags rather than
# a document. Using both would mean writing each client twice, in two
# vocabularies, which is the same shape of mistake this is meant to end. The
# admin API takes the same JSON for either -- `PUT` replaces, and answers 404
# when there is nothing to replace, which is when this posts instead.
#
# # What is not here
#
# Anything an overlay adds. A deployment puts its own `clients/*.json` beside
# these with the Secret each one names, and inherits the two Jobs -- which is
# the point of them being here: what a client needs is decided once, upstream,
# rather than restated per deployment. That restating is where two of this
# week's four defects were.
#
# # What this does not do, on purpose
#
# **It does not prune.** A client whose file is deleted stays registered in
# Hydra. That is `resources.yaml`'s rule for the same reason: what a deletion
# from a file would destroy is not the file's to destroy -- every browser
# holding a token from that client stops working the moment the row goes, and a
# rename, a bad merge or a `git revert` should not be able to do that. Removing
# a client is a person's act, with `hydra delete client <id>`, after the file.
#
# **It does not reconcile.** It runs on a sync, so a client somebody changes by
# hand stays changed until the next one. Continuous reconciliation is what ORY's
# `OAuth2Client` CRD is for, and that is an operator to run and keep -- more
# than three clients are worth. What this buys instead is that the clients are
# **written down**, which is the whole of what was missing.
#
# The admin port is reachable in-cluster and routed nowhere, which `hydra.yaml`
# says is the whole of what protects it. This Job is in-cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: roster-hydra-clients
  annotations:
    # Every sync, after the resources it needs are up. It is idempotent -- a
    # replace of what is already there -- so running it when nothing changed
    # costs one pod and says so.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Before the check below, which reads what this wrote.
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roster
        app.kubernetes.io/component: hydra-clients
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: curlimages/curl
          env:
            - { name: ADMIN, value: "http://roster-hydra:4445" }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # Hydra answers a readiness probe on the admin port, and a sync
              # that runs while it is still migrating would fail for a reason
              # that is not about the clients.
              i=0
              until curl -sS -o /dev/null "${ADMIN}/health/ready"; do
                i=$((i + 1))
                [ "${i}" -lt 60 ] || { echo "hydra never became ready"; exit 1; }
                sleep 2
              done

              for f in /clients/*.json; do
                id=${f##*/}
                id=${id%.json}

                s="/secrets/${id}/client-secret"
                [ -f "${s}" ] || { echo "${id}: no secret mounted for it"; exit 1; }

                # The secret is **not** in the ConfigMap: those files are
                # readable by anybody who can read the namespace, and a client
                # secret is a credential. It arrives as a mounted Secret and is
                # put in here.
                #
                # Not by substituting it in, which is where the first cut of
                # this was wrong. A secret is arbitrary bytes, and every tool
                # that replaces text reads the replacement for something -- `&`
                # means "what matched" to both `sed` and `awk` -- so getting
                # the layers right through YAML, a shell and an `awk` string is
                # a thing to be quietly wrong about. It was: a secret with a
                # `"` in it produced a body Hydra answered with *invalid
                # character 'q' after object key:value pair*.
                #
                # So the template is **split** rather than substituted. Shell
                # parameter expansion has no replacement semantics at all, and
                # what is left is the escaping JSON actually needs, which is a
                # backslash and a quote. A byte JSON cannot carry raw is a
                # Secret written wrong, and says so rather than being mangled.
                raw=$(cat "${s}")
                case "${raw}" in
                *[!\ -~]*)
                  echo "${id}: its secret has a byte JSON cannot carry raw"
                  exit 1
                  ;;
                esac
                esc=$(printf '%s' "${raw}" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
                tpl=$(cat "${f}")
                body="${tpl%%@SECRET@*}${esc}${tpl#*@SECRET@}"

                code=$(printf '%s' "${body}" | curl -sS -o /tmp/out -w '%{http_code}' \
                  -X PUT -H 'content-type: application/json' --data-binary @- \
                  "${ADMIN}/admin/clients/${id}")

                # Nothing to replace: this is the first sync that has seen it.
                if [ "${code}" = "404" ]; then
                  code=$(printf '%s' "${body}" | curl -sS -o /tmp/out -w '%{http_code}' \
                    -X POST -H 'content-type: application/json' --data-binary @- \
                    "${ADMIN}/admin/clients")
                fi

                case "${code}" in
                200 | 201)
                  echo "${id}: ${code}"
                  ;;
                *)
                  echo "${id}: ${code}"
                  cat /tmp/out
                  echo
                  exit 1
                  ;;
                esac
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: clients, mountPath: /clients, readOnly: true }
            - { name: product, mountPath: /secrets/product, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: clients
          configMap: { name: roster-hydra-clients }
        - name: product
          secret: { secretName: roster-product, items: [{ key: client-secret, path: client-secret }] }
        - name: tmp
          emptyDir: {}
---
# And then: are they registered in a way this stack works with?
#
# The Job above writes what `clients/*.json` says. This asks roster whether
# what Hydra now holds is something its apps can actually sign somebody in
# with -- which is a different question, and the one that was answered four
# times this week by a person clicking something in a browser:
#
#   - a client with no `post_logout_redirect_uris`, so signing out of it ended
#     on the issuer's error page
#   - a client registered for `client_secret_post` while every relying party
#     here sends the secret in the header, so **every sign-in answered 400**
#   - a client at Hydra that `login.clients` did not name, so a flow for it
#     reached a page saying the login is not working
#
# It exits non-zero on any of those, so this sync goes red rather than the
# deployment going quiet. Things that work but are worth knowing about are
# printed and do not fail: an app that cannot send an `id_token_hint` has no
# way back from a sign-out on purpose, and that should not be red forever.
#
# It changes nothing. What it finds is fixed in `clients/*.json` above.
apiVersion: batch/v1
kind: Job
metadata:
  name: roster-hydra-clients-check
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roster
        app.kubernetes.io/component: hydra-clients-check
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doctor
          image: ghcr.io/lesomnus/roster
          args:
            - --config=/config/config.yaml
            - login
            - doctor
            # No `--hydra`: `roster.yaml` already says where it answers, and a
            # second copy of that address is a second thing to keep true.
            #
            # `--public` **is** passed, because the half of this that reads
            # what Hydra was told is on its public port and nothing in
            # roster's configuration says where that is. Derived it would be
            # `roster-hydra:4444`, which is right -- said rather than derived
            # so that moving the port moves one line here instead of turning
            # the check into one that reports it could not look.
            # The issuer's own name over TLS, because that is what it now
            # serves. Derived it would be `http://roster-hydra:4444`, which
            # answers bytes that are not a discovery document -- and this said
            # so rather than passing, which is the whole reason that finding
            # exists.
            - --public=https://roster-hydra.roster.svc.cluster.local:4444
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          env:
            # The issuer's certificate is this rig's own.
            - { name: SSL_CERT_FILE, value: /tls/ca.crt }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: config
          configMap: { name: roster }
        # The issuer's CA, for a rig whose certificate nothing already trusts.
        #
        # **Optional, and that is what makes this base applyable by somebody
        # else.** `roster-hydra-tls` is `scripts/cluster.sh`'s own Secret; a
        # deployment whose issuer has a certificate the world trusts has no such
        # thing, and a volume that is not optional is a Job that never starts --
        # so an overlay would have had to patch this mount out before it could
        # apply the base at all. Missing, `SSL_CERT_FILE` names a file that is
        # not there, Go falls back to the system roots, and that is the right
        # answer for a real issuer.
        #
        # Found by writing an overlay for a real deployment, which is the only
        # way a base's coupling to its own rig ever shows up.
        - name: tls
          secret:
            secretName: roster-hydra-tls
            optional: true
            items: [{ key: ca.crt, path: ca.crt }]
