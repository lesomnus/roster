# **Fake, on purpose, and checked in.**
#
# This is a rig: an overlay brings its own and never uses these. They are here
# rather than generated because a generated secret is one the walks would have
# to be told about, and then the rig has a moving part a deployment does not.
apiVersion: v1
kind: Secret
metadata:
  name: roster-hydra
type: Opaque
stringData:
  # Rotating this in a deployment invalidates every token and every remembered
  # session.
  system: this-is-a-rig-and-not-a-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: roster-vouch
type: Opaque
stringData:
  # What a TOTP seed is wrapped with before it is stored.
  # A **list**: `vouch.keys` is one, so the environment form is too, and roster
  # says [1:1] string was used where sequence is expected if it is not.
  keys: '["rig:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="]' 
---
apiVersion: v1
kind: Secret
metadata:
  name: roster-product
type: Opaque
stringData:
  client-secret: this-is-a-rig-and-not-a-secret-either
