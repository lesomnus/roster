# The issuer.
#
# What an overlay changes here is the host in `URLS_*` and where the database
# lives. What it should not change is that the four `URLS_` are all set: one of
# them was missing in a real deployment for a day and what that looked like was
# a **successful** sign-out ending on a page telling the person to contact an
# administrator.
apiVersion: v1
kind: Service
metadata:
  name: roster-hydra
spec:
  selector:
    app.kubernetes.io/name: roster
    app.kubernetes.io/component: hydra
  ports:
    # Public: the browser's half of the protocol, and the only one a host is
    # ever put in front of.
    - { name: public, port: 4444, targetPort: public }
    # Admin: register a client, read a challenge, accept a login. **Anybody who
    # reaches this can sign anybody in as anybody**, so nothing routes it and
    # what protects it is that fact rather than a credential. The Login App and
    # `roster login doctor` call it in-cluster.
    - { name: admin, port: 4445, targetPort: admin }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roster-hydra
  labels:
    app.kubernetes.io/name: roster
    app.kubernetes.io/component: hydra
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: roster
      app.kubernetes.io/component: hydra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roster
        app.kubernetes.io/component: hydra
    spec:
      # No service-link environment variables, for `roster.yaml`'s reason: one
      # pair per Service in the namespace, and neither Hydra nor its migration
      # reads any of them.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }

      # Hydra does not migrate on start and says so by refusing to serve. Run
      # every rollout, because it is idempotent.
      initContainers:
        - name: migrate
          image: oryd/hydra
          args: ["migrate", "sql", "-e", "--yes"]
          env:
            - { name: DSN, value: "sqlite:///data/hydra.db?_fk=true" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }

      containers:
        - name: hydra
          image: oryd/hydra
          # **Not `--dev`.** Its own help calls that *disables critical security
          # checks*, and a deployment that runs it is one whose issuer behaves
          # differently from the thing it was tested against. `compose.yaml` in
          # roster still does, and says so where it does; this is the shape that
          # does not have to.
          args: ["serve", "all"]
          env:
            - { name: DSN, value: "sqlite:///data/hydra.db?_fk=true" }

            # **Rotating this invalidates every token and every remembered
            # session**, which is the safe direction and is why Hydra takes a
            # list rather than one value. An overlay replaces the Secret.
            - name: SECRETS_SYSTEM
              valueFrom: { secretKeyRef: { name: roster-hydra, key: system } }

            # `iss` in every token, and the base of the discovery document each
            # product fetches. **https**, because Hydra outside `--dev` refuses
            # any other scheme -- *issuer URL scheme must be HTTPS unless
            # development mode is enabled*, and it says that by not starting.
            #
            # The name is a Service's, in full, for two reasons. It has to
            # resolve wherever a relying party runs, and the only place all of
            # them do is **inside the cluster** -- which is why the walks are a
            # Job here rather than something on the outside reaching in. And it
            # has a dot in it, because a cookie jar will not answer to a
            # single-label host and a sign-in is mostly cookies.
            - { name: URLS_SELF_ISSUER, value: "https://roster-hydra.roster.svc.cluster.local:4444" }

            # And Hydra terminates it itself.
            #
            # A deployment ends TLS at its ingress and tells Hydra so with
            # `serve.public.tls.allow_termination_from` instead; this does it
            # here because an ingress is a second thing to stand up and the
            # scheme is what the issuer rule is about. What that gives up is
            # everything about **being behind a proxy** -- `X-Forwarded-Proto`,
            # and an app that reads `r.TLS` -- which is written down as still
            # missing rather than quietly not covered.
            - { name: SERVE_PUBLIC_TLS_ENABLED, value: "true" }
            - { name: SERVE_PUBLIC_TLS_CERT_PATH, value: /tls/tls.crt }
            - { name: SERVE_PUBLIC_TLS_KEY_PATH, value: /tls/tls.key }

            # The three redirects, and the fourth that is not a redirect to this
            # app at all.
            # Plain http, and only the issuer is not: the scheme rule is
            # about `URLS_SELF_ISSUER` alone. A deployment serves its Login App
            # over TLS because a browser is typing a password into it, which is
            # a different reason and one this rig has no browser for.
            - { name: URLS_LOGIN, value: "http://roster-login.roster.svc.cluster.local:8091/login" }
            - { name: URLS_CONSENT, value: "http://roster-login.roster.svc.cluster.local:8091/consent" }
            - { name: URLS_LOGOUT, value: "http://roster-login.roster.svc.cluster.local:8091/logout" }
            # Where a browser lands when the sign-out asked to come back
            # **nowhere**, which is every sign-out that arrived with no
            # `id_token_hint`. Unset, that page is Hydra's own fallback, whose
            # text is addressed to an administrator.
            - { name: URLS_POST_LOGOUT_REDIRECT, value: "http://roster-login.roster.svc.cluster.local:8091/signed-out" }

            - { name: LOG_LEVEL, value: "info" }
            - { name: LOG_FORMAT, value: "json" }

          ports:
            - { name: public, containerPort: 4444 }
            - { name: admin, containerPort: 4445 }

          readinessProbe:
            httpGet: { path: /health/ready, port: admin }
            initialDelaySeconds: 2
            periodSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }

      volumes:
        # Made by `scripts/cluster.sh` and not checked in, unlike the fake
        # secrets beside it: a certificate expires, so one in git is a rig that
        # works until a date nobody wrote down.
        - name: tls
          secret:
            secretName: roster-hydra-tls
            # **Optional**, for `clients.yaml`'s reason and with a sharper edge
            # here: a deployment that ends TLS at its ingress has no such Secret
            # at all, and a volume that is not optional is a **pod that never
            # starts**. Found by writing the overlay for a real deployment, where
            # it was the one thing that would have stopped it coming up.
            optional: true
        # Somewhere writable. `readOnlyRootFilesystem: true` is right and it is
        # not the whole story: a Go toolchain and TLS both want a temporary
        # directory, and finding that out at run time is a pod that works until
        # the day something needs one. Cheap insurance rather than a discovered
        # requirement, which is how the deployment that had this before the base
        # did put it.
        - name: tmp
          emptyDir: {}
        # An overlay that wants this to survive a node replaces it with a claim.
        - name: data
          emptyDir: {}
