# What roster is told, in a deployment.
#
# The shape rather than the values: an overlay replaces the hosts, the storage
# and the secrets, and inherits the rest. What it must **not** restate is the
# `login:` block, because that is where two of this week's four defects were --
# a client list and an issuer address that were written once here and once
# somewhere else, and disagreed.
resources: [/config/resources.yaml]

server:
  addr: 0.0.0.0:8080
  http:
    addr: 0.0.0.0:8081
    allow_web: true

# No `host:` either, which means the system resolver: a tenant that claims a
# hostname is checked against the servers that hold the zone, and that is right
# for a deployment on a network. Two reasons to write the block -- a resolver of
# this cluster's own if it answers for customers' domains out of an internal zone,
# and `resolver: none` for an air gap, where a roster operator writes the row
# instead. `docs/operating.md` § "A tenant registers its own hostname".

# No `sign_in:` and no `user_console:` here, and the absence is a decision
# rather than an omission. The user console is a public sign-in on the port
# product apps already reach, and whether a deployment wants one is the
# deployment's to say -- `docs/operating.md` § "The user console" is the two
# lines it takes, and the page is already in the image at
# /usr/share/roster/user. `compose.yaml` turns it on, because that rig is a
# desk.

# SQLite on a volume, which is what a deployment of this size wants and what
# `docs/operating.md` § "Which database" says what the trade is. An overlay that
# outgrows it replaces `db:` and `control.db:` and changes nothing else.
db:
  driver: sqlite3
  dsn: "file:/data/roster.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_txlock=immediate"
  migrate: true
watch:
  broker: memory

control:
  db:
    driver: sqlite3
    dsn: "file:/control/roster-control.db?_pragma=foreign_keys(1)&_pragma=busy_timeout(5000)&_pragma=journal_mode(WAL)&_txlock=immediate"
    migrate: true
  watch:
    broker: memory
  addr: 0.0.0.0:8060
  # The control plane's HTTP listener, for a caller that cannot speak gRPC.
  # `control.addr` above is **gRPC** -- anything pointed at it gets an HTTP/2
  # SETTINGS frame and reads it as a malformed response, which is a probe that
  # never passes and says nothing about why. The probe asks `admin.http` now,
  # because that is where the page is.
  http:
    addr: 0.0.0.0:8061
  # No page here. The admin console is served by `admin.http` below, which is
  # also the listener it calls -- a `__Host-` session cookie is host-only, so
  # the two have to be one host (#27). What this listener answers is what a
  # shell asks, carrying an `rk_`.

# The data plane with **no wall**, which is what the admin console's customers screen
# reads: creating a customer happens before there is a tenant to be narrowed to,
# so it cannot be done through the walled plane at all.
#
# Up, and offered to nobody. There is no Service for it here and `origins` is
# empty, because the caller is a browser on the admin console's own origin and that
# origin is a deployment's to know. Both lines are filled in together or neither
# is; `cmd/serve.go` is why this is a third listener rather than a flag.
admin:
  addr: 0.0.0.0:8070
  http:
    addr: 0.0.0.0:8071
    allow_web: true
    origins: []
  # And the page itself, on the listener it calls. `origins` stays empty
  # because there is one origin: this one.
  console:
    dir: /usr/share/roster/console

# The Login App, in the same process. `docs/operating.md` § "One process, or
# three" is the question of whether it should be, and the answer is a
# deployment's; this is the cheap one.
login:
  addr: 0.0.0.0:8091
  hydra:
    admin: http://roster-hydra:4445
  # Made at start by the init container and read from a file, because a tenant
  # can be made after this has first run -- so a key cannot be put anywhere in
  # advance, and one put there afterwards is a thing to rotate.
  keys:
    acme: file:/run/login/acme.key
  # **Which challenges this app answers at all.** A client not in here is a
  # flow that reaches a page saying the login is not working, and a client in
  # here that the issuer has never heard of is a flow nothing can raise --
  # `roster login doctor` says which of those a deployment has.
  clients:
    acme: [product]
  # roster speaks plain gRPC on the pod network, so the app that dials it has
  # to be told that. Without it the handshake fails with *first record does not
  # look like a TLS handshake*, which reads like a certificate problem and is a
  # missing line.
  insecure: true
  # The sign-in page, which the image already carries. Without it the Login App
  # answers **404** for `/login` -- *this deployment serves no sign-in page* --
  # and a browser Hydra redirected there gets nothing. It is the one line whose
  # absence looks like the issuer is broken.
  page:
    dir: /usr/share/roster/login
  base: http://roster-login.roster.svc.cluster.local:8091
  insecure_cookie: true
  remember: 8h
