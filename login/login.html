<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sign in</title>
<style>
	body {
		font: 15px/1.5 system-ui, sans-serif;
		margin: 3rem auto;
		max-width: 22rem;
		padding: 0 1rem;
	}
	h1 { font-size: 1.3rem; }
	form { display: flex; flex-direction: column; gap: 0.6rem; }
	label { display: flex; gap: 0.5rem; justify-content: space-between; }
	input { flex: 1; min-width: 0; }
	.bad { color: #b00; }
	.none { color: #888; }
	[hidden] { display: none !important; }
</style>

<h1>sign in</h1>

<!--
	The first form. What comes back is this app's own cookie and nothing else;
	what the browser is here for is a token Hydra signs, which is what `/accept`
	below asks for once roster has said yes.
-->
<form id="in">
	<label>who <input name="alias" autofocus autocomplete="username" /></label>
	<label>password <input name="password" type="password" autocomplete="current-password" /></label>
	<button>sign in</button>
	<p class="bad" id="in-bad" hidden>no</p>
</form>

<!--
	The second form, drawn only when roster said there is more to prove. What it
	offers is `available` and not a list this page decided: how many steps there
	are and which to ask for is the flow's, and the flow is here.
-->
<form id="more" hidden>
	<p class="none" id="more-what"></p>
	<label>code <input name="secret" autocomplete="one-time-code" inputmode="numeric" /></label>
	<button>continue</button>
	<p class="bad" id="more-bad" hidden>no</p>
</form>

<script type="module">
	import { signIn, proceed } from './frontdoor.js'

	const $ = (id) => document.getElementById(id)
	const forms = { in: $('in'), more: $('more') }
	let kind = 'totp'

	// Every call in this flow carries the challenge Hydra redirected with, read
	// from this page's own address. Not a cookie: Hydra's challenge is about
	// two kilobytes and a cookie is capped at four, which is too close. It is
	// not a secret either -- the browser arrived holding it -- and the app looks
	// it up at Hydra rather than believing anything in it.
	const flow = new URLSearchParams(location.search).get('login_challenge') ?? ''
	const at = (path) => `${path}?login_challenge=${encodeURIComponent(flow)}`

	// The last hop, and the only thing on this page that is not an ordinary
	// sign-in: roster has said who this is, and Hydra is waiting to be told.
	async function done() {
		const res = await fetch(at('/accept'), { method: 'POST' })
		if (!res.ok) {
			$('in-bad').textContent = 'this login is not working'
			$('in-bad').hidden = false
			return
		}
		const { redirect_to } = await res.json()
		location.assign(redirect_to)
	}

	function answered(answer, bad) {
		bad.hidden = true
		switch (answer.state) {
			case 'in':
				return done()
			case 'more':
				kind = answer.available[0] ?? 'totp'
				forms.in.hidden = true
				forms.more.hidden = false
				$('more-what').textContent = `one more: ${answer.available.join(' or ')}`
				forms.more.secret.focus()
				return
			case 'no':
				bad.textContent = 'no'
				bad.hidden = false
				return
			default:
				bad.textContent = 'this login is not working'
				bad.hidden = false
		}
	}

	forms.in.addEventListener('submit', async (e) => {
		e.preventDefault()
		const who = forms.in.alias.value.trim()
		answered(
			await signIn(
				{
					// An address where there is an `@` and a name otherwise,
					// which is the one guess a single field can make. A
					// deployment that wants two fields draws two.
					...(who.includes('@') ? { address: who } : { alias: who }),
					password: forms.in.password.value,
				},
				{ path: at('/session') },
			),
			$('in-bad'),
		)
	})

	forms.more.addEventListener('submit', async (e) => {
		e.preventDefault()
		answered(
			await proceed({ kind, secret: forms.more.secret.value.trim() }, { path: at('/session/continue') }),
			$('more-bad'),
		)
	})
</script>
