<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>allow?</title>
<style>
	body {
		font: 15px/1.5 system-ui, sans-serif;
		margin: 3rem auto;
		max-width: 24rem;
		padding: 0 1rem;
	}
	h1 { font-size: 1.3rem; }
	ul { padding-left: 1.2rem; }
	li { margin: 0.2rem 0; }
	.acts { display: flex; gap: 0.6rem; margin-top: 1.6rem; }
	.no { background: none; }
	.none { color: #888; }
</style>

<h1>{{ .Client }}</h1>

<p>wants to know who you are and to see:</p>

<ul>
	{{ range .Scope }}<li>{{ . }}</li>{{ else }}<li class="none">nothing beyond who you are</li>{{ end }}
</ul>

<!--
	Two buttons and no checkboxes. A screen that lets somebody grant less than
	a client asked for reads like a choice and is not one: an app that asked
	for a scope generally stops working without it, so the person is picking
	between "allow" and "allow, then find out something is broken". A yes or a
	no is what they can actually answer.
-->
<form method="post" action="/consent">
	<input type="hidden" name="consent_challenge" value="{{ .Challenge }}" />
	<div class="acts">
		<button name="allow" value="1">allow</button>
		<button class="no">no</button>
	</div>
</form>
